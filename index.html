<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Creature Studio</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#15171b;color:#eee;font:13px Arial,sans-serif}
button,input,select{font:inherit}.app{height:100%;display:grid;grid-template-rows:46px 1fr}
.top{display:flex;align-items:center;gap:8px;padding:7px 10px;background:#202329;border-bottom:1px solid #0d0e10}
.logo{font-weight:800;font-size:16px;margin-right:12px}.logo span{color:#62a9ff}
button{background:#30343b;color:#eee;border:1px solid #454a53;border-radius:4px;padding:7px 10px;cursor:pointer}
button:hover{background:#3a4049}.primary{background:#3978c8;border-color:#5795e7}.danger{background:#7d3030}
.main{min-height:0;display:grid;grid-template-columns:220px 1fr 250px}
.left,.right{background:#202329;border-right:1px solid #0d0e10;min-width:0}.right{border-right:0;border-left:1px solid #0d0e10}
.panelTitle{padding:10px;font-weight:700;background:#282c33;border-bottom:1px solid #111;text-transform:uppercase;font-size:11px;color:#bfc5cf}
.section{padding:9px;border-bottom:1px solid #111}.row{display:flex;gap:6px;margin:6px 0}.row>*{min-width:0;flex:1}
.tree{padding:8px}.treeItem{padding:7px;border-radius:4px;cursor:pointer}.treeItem:hover,.treeItem.sel{background:#353b45}
.treeItem small{color:#9299a5}.center{position:relative;min-width:0;background:#111}
#view{position:absolute;inset:0;width:100%;height:100%;display:block}
.modebar{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:3px;background:#24282e;padding:4px;border-radius:6px;border:1px solid #454a53;z-index:5}
.modebar button{border:0}.modebar .active{background:#3978c8}
.hint{position:absolute;bottom:10px;left:10px;background:#202329cc;padding:7px;border-radius:4px;color:#adb4bf;z-index:4}
.prop{padding:9px}.prop label{display:block;color:#aab1bc;margin:8px 0 4px}.prop input,.prop select{width:100%;background:#15171b;border:1px solid #444a53;color:#eee;padding:7px;border-radius:4px}
.xyz{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}.xyz input{width:100%}
.paint{position:absolute;inset:0;display:none;background:#1a1d21;z-index:3}
.paintGrid{position:absolute;left:0;top:0;right:300px;bottom:0;display:flex;align-items:center;justify-content:center;overflow:auto}
#tex{image-rendering:pixelated;border:1px solid #59606b;box-shadow:0 0 0 1px #08090a;background:repeating-conic-gradient(#2c3036 0 25%,#22262b 0 50%) 50%/20px 20px}
.paintTools{position:absolute;right:0;top:0;bottom:0;width:300px;background:#202329;border-left:1px solid #0d0e10;padding:12px}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:8px}.sw{height:28px;border:1px solid #555;border-radius:3px;cursor:pointer}
.modePaint .paint{display:block}.modePaint #view{display:none}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="app">
<header class="top">
 <div class="logo">CREATURE <span>STUDIO</span></div>
 <button class="primary" onclick="addCube()">+ Cube</button>
 <button onclick="addGroup()">+ Group</button>
 <button onclick="setMode('model')">Model</button>
 <button onclick="setMode('paint')">Paint</button>
 <button onclick="setMode('preview')">Creature Preview</button>
 <button onclick="saveProject()">Save</button><button onclick="loadProject()">Load</button>
 <input id="file" type="file" accept=".json" class="hidden" onchange="readProject(event)">
</header>
<main class="main">
<aside class="left">
 <div class="panelTitle">Explorer</div>
 <div class="tree" id="tree"></div>
 <div class="panelTitle">Texture</div>
 <div class="section">
  <div class="row"><button onclick="newTexture()">New 32×32</button><button onclick="document.getElementById('imgfile').click()">Upload</button></div>
  <input id="imgfile" class="hidden" type="file" accept="image/*" onchange="uploadTexture(event)">
  <button style="width:100%" onclick="setMode('paint')">Open Paint Mode</button>
 </div>
 <div class="panelTitle">Animation</div>
 <div class="section">
  <select id="anim" style="width:100%;padding:7px;background:#15171b;color:#eee;border:1px solid #444" onchange="animation=this.value">
   <option>Idle</option><option>Walk</option><option>Run</option><option>Attack</option>
  </select>
  <button style="width:100%;margin-top:7px" onclick="playing=!playing">▶ / ❚❚ Play Animation</button>
 </div>
</aside>

<section class="center" id="center">
 <canvas id="view"></canvas>
 <div class="modebar">
  <button id="mModel" class="active" onclick="setMode('model')">Model</button>
  <button id="mPaint" onclick="setMode('paint')">Paint</button>
  <button id="mPreview" onclick="setMode('preview')">Preview</button>
 </div>
 <div class="hint" id="hint">Chuột trái: xoay • lăn: zoom • kéo phải: di chuyển</div>
 <div class="paint">
  <div class="paintGrid"><canvas id="tex" width="512" height="512"></canvas></div>
  <div class="paintTools">
   <b>PAINT</b>
   <label>Màu</label><input id="color" type="color" value="#ffffff" style="height:40px">
   <div class="row"><button onclick="tool='pencil'">✎ Pencil</button><button onclick="tool='fill'">▦ Fill</button><button onclick="tool='erase'">⌫ Eraser</button></div>
   <button style="width:100%" onclick="pick()">🎨 Color Picker</button>
   <label>Palette</label><div class="palette" id="palette"></div>
   <hr style="border-color:#333">
   <button style="width:100%" onclick="undo()">↶ Undo</button>
   <button style="width:100%;margin-top:6px" onclick="redo()">↷ Redo</button>
   <button style="width:100%;margin-top:12px" onclick="setMode('model')">← Back to Model</button>
  </div>
 </div>
</section>

<aside class="right">
 <div class="panelTitle">Creature Properties</div>
 <div class="prop">
  <label>Name</label><input id="cname" value="My Creature">
  <label>Type</label><select id="ctype"><option>Animal</option><option>Monster</option><option>Humanoid</option><option>Custom</option></select>
  <label>Health</label><input id="health" type="number" value="20">
  <label>Speed</label><input id="speed" type="number" value="0.25" step=".05">
  <label>Selected Part</label><input id="selname" value="None" disabled>
  <label>Position</label><div class="xyz"><input id="px" type="number" step=".1"><input id="py" type="number" step=".1"><input id="pz" type="number" step=".1"></div>
  <label>Size</label><div class="xyz"><input id="sx" type="number" step=".1"><input id="sy" type="number" step=".1"><input id="sz" type="number" step=".1"></div>
  <label>Rotation</label><div class="xyz"><input id="rx" type="number"><input id="ry" type="number"><input id="rz" type="number"></div>
  <div class="row" style="margin-top:12px"><button class="primary" onclick="applyProps()">Apply</button><button class="danger" onclick="deleteSelected()">Delete</button></div>
 </div>
 <div class="panelTitle">Test</div>
 <div class="section">
  <button style="width:100%" onclick="setMode('preview')">🧪 Test Creature</button>
  <p style="color:#9da5b0">Preview cho phép xoay camera quanh toàn bộ sinh vật.</p>
 </div>
</aside>
</main>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script>
<script>
let scene,camera,renderer,root,raycaster=new THREE.Raycaster(),mouse=new THREE.Vector2();
let parts=[],selected=null,mode='model',animation='Idle',playing=false,tool='pencil',drag=false,lastX=0,lastY=0;
let texCanvas=document.getElementById('tex'),tctx=texCanvas.getContext('2d'),undoStack=[],redoStack=[];
let texData=null, texObj=null, angleX=.35,angleY=.65,distance=7,target=new THREE.Vector3(0,1.2,0);

function init(){
 scene=new THREE.Scene(); scene.background=new THREE.Color(0x101216);
 camera=new THREE.PerspectiveCamera(55,1,.05,1000);
 renderer=new THREE.WebGLRenderer({canvas:document.getElementById('view'),antialias:true});
 renderer.setPixelRatio(Math.min(devicePixelRatio,2));
 root=new THREE.Group();scene.add(root);
 scene.add(new THREE.HemisphereLight(0xffffff,0x30343a,2));
 let dl=new THREE.DirectionalLight(0xffffff,2);dl.position.set(4,8,5);scene.add(dl);
 addCube('Body',0,1.5,0,2,2.5,1);
 addCube('Head',0,3.8,0,1.7,1.5,1.5);
 addCube('Left Leg',-.55,.25,0,.65,1.2,.7);
 addCube('Right Leg',.55,.25,0,.65,1.2,.7);
 addCube('Left Arm',-1.35,1.65,0,.55,1.8,.65);
 addCube('Right Arm',1.35,1.65,0,.55,1.8,.65);
 addCube('Tail',0,1.6,-.85,.55,.55,1.5);
 newTexture(); buildPalette(); resize(); updateTree(); select(parts[0]);
 animate();
}
function makeMat(){return new THREE.MeshStandardMaterial({color:0xffffff,roughness:.8,metalness:0})}
function addCube(name='Cube',x=0,y=1,z=0,sx=1,sy=1,sz=1){
 let g=new THREE.BoxGeometry(1,1,1),m=makeMat(),o=new THREE.Mesh(g,m);
 o.name=name;o.position.set(x,y,z);o.scale.set(sx,sy,sz);o.userData.kind='part';o.userData.baseY=y;
 root.add(o);parts.push(o);updateTree();select(o);return o;
}
function addGroup(){let g=new THREE.Group();g.name='Group';g.userData.kind='group';root.add(g);updateTree()}
function updateTree(){
 let t=document.getElementById('tree');t.innerHTML='';
 parts.forEach((p,i)=>{let d=document.createElement('div');d.className='treeItem '+(p===selected?'sel':'');d.innerHTML='▣ '+p.name+' <small>cube</small>';d.onclick=()=>select(p);t.appendChild(d)})
}
function select(o){selected=o;updateTree();if(!o)return;document.getElementById('selname').value=o.name;
 ['px','py','pz'].forEach((id,i)=>document.getElementById(id).value=o.position.toArray()[i].toFixed(2));
 ['sx','sy','sz'].forEach((id,i)=>document.getElementById(id).value=o.scale.toArray()[i].toFixed(2));
 ['rx','ry','rz'].forEach((id,i)=>document.getElementById(id).value=(o.rotation.toArray()[i]*180/Math.PI).toFixed(1));
}
function applyProps(){
 if(!selected)return;
 selected.position.set(+px.value,+py.value,+pz.value);selected.scale.set(+sx.value,+sy.value,+sz.value);
 selected.rotation.set(+rx.value*Math.PI/180,+ry.value*Math.PI/180,+rz.value*Math.PI/180);selected.name=selname.value;updateTree();
}
function deleteSelected(){if(!selected)return;root.remove(selected);parts=parts.filter(x=>x!==selected);selected=null;updateTree()}
function setMode(m){
 mode=m;document.getElementById('center').className='center '+(m==='paint'?'modePaint':'');
 ['mModel','mPaint','mPreview'].forEach(x=>document.getElementById(x).classList.remove('active'));
 document.getElementById(m==='model'?'mModel':m==='paint'?'mPaint':'mPreview').classList.add('active');
 document.getElementById('hint').textContent=m==='paint'?'Paint: click/kéo trên texture để tô pixel':'Chuột trái: xoay • lăn: zoom • kéo phải: di chuyển';
}
function newTexture(){
 tctx.clearRect(0,0,512,512);tctx.fillStyle='#ffffff';tctx.fillRect(0,0,512,512);
 texData=tctx.getImageData(0,0,512,512);undoStack=[];redoStack=[];applyTexture();
}
function applyTexture(){
 if(!texData)return;
 let c=document.createElement('canvas');c.width=512;c.height=512;c.getContext('2d').putImageData(texData,0,0);
 texObj=new THREE.CanvasTexture(c);texObj.colorSpace=THREE.SRGBColorSpace;texObj.magFilter=THREE.NearestFilter;texObj.minFilter=THREE.NearestFilter;
 parts.forEach(p=>{p.material.map=texObj;p.material.color.set(0xffffff);p.material.needsUpdate=true});
}
function uploadTexture(e){
 let f=e.target.files[0];if(!f)return;let im=new Image();im.onload=()=>{tctx.clearRect(0,0,512,512);tctx.drawImage(im,0,0,512,512);texData=tctx.getImageData(0,0,512,512);applyTexture()};im.src=URL.createObjectURL(f)
}
function savePaint(){undoStack.push(tctx.getImageData(0,0,512,512));if(undoStack.length>30)undoStack.shift();redoStack=[]}
function paintAt(e){
 let r=texCanvas.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/r.width*512),y=Math.floor((e.clientY-r.top)/r.height*512);
 if(x<0||y<0||x>=512||y>=512)return;
 savePaint();
 if(tool==='fill'){tctx.fillStyle=color.value;tctx.fillRect(0,0,512,512)}
 else {tctx.fillStyle=tool==='erase'?'#ffffff':color.value;tctx.fillRect(x,y,1,1)}
 texData=tctx.getImageData(0,0,512,512);applyTexture()
}
function undo(){if(!undoStack.length)return;redoStack.push(tctx.getImageData(0,0,512,512));tctx.putImageData(undoStack.pop(),0,0);texData=tctx.getImageData(0,0,512,512);applyTexture()}
function redo(){if(!redoStack.length)return;undoStack.push(tctx.getImageData(0,0,512,512));tctx.putImageData(redoStack.pop(),0,0);texData=tctx.getImageData(0,0,512,512);applyTexture()}
function pick(){tool='picker'}
function buildPalette(){['#000000','#ffffff','#777777','#ff0000','#00ff00','#0000ff','#ffff00','#ff7b00','#8b4513','#00ffff','#ff69b4','#7b2cff'].forEach(c=>{let d=document.createElement('div');d.className='sw';d.style.background=c;d.onclick=()=>{color.value=c;tool='pencil'};palette.appendChild(d)})}
texCanvas.addEventListener('mousedown',e=>{if(tool==='picker'){let r=texCanvas.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/r.width*512),y=Math.floor((e.clientY-r.top)/r.height*512),p=tctx.getImageData(x,y,1,1).data;color.value='#'+[p[0],p[1],p[2]].map(v=>v.toString(16).padStart(2,'0')).join('');tool='pencil';return}paintAt(e)});
texCanvas.addEventListener('mousemove',e=>{if(e.buttons===1&&tool==='pencil')paintAt(e)});
const view=document.getElementById('view');
view.addEventListener('mousedown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY});
window.addEventListener('mouseup',()=>drag=false);
view.addEventListener('mousemove',e=>{if(!drag)return;angleY+=(e.clientX-lastX)*.008;angleX+=(e.clientY-lastY)*.008;angleX=Math.max(-1.3,Math.min(1.3,angleX));lastX=e.clientX;lastY=e.clientY});
view.addEventListener('wheel',e=>{distance*=1+e.deltaY*.001;distance=Math.max(2.5,Math.min(20,distance));e.preventDefault()},{passive:false});
view.addEventListener('click',e=>{if(mode!=='model')return;let r=view.getBoundingClientRect();mouse.x=(e.clientX-r.left)/r.width*2-1;mouse.y=-(e.clientY-r.top)/r.height*2+1;raycaster.setFromCamera(mouse,camera);let hit=raycaster.intersectObjects(parts);if(hit.length)select(hit[0].object)});
function animate(){
 requestAnimationFrame(animate);
 if(playing){let t=performance.now()/400;if(animation==='Walk'||animation==='Run'){parts.forEach((p,i)=>{if(/Leg|Arm/.test(p.name))p.rotation.x=Math.sin(t+(i%2)*Math.PI)*(animation==='Run'?.7:.35)})}}
 let x=Math.cos(angleX)*Math.sin(angleY)*distance,y=Math.sin(angleX)*distance,z=Math.cos(angleX)*Math.cos(angleY)*distance;
 camera.position.set(x,y+1.8,z);camera.lookAt(target);renderer.render(scene,camera)
}
function resize(){let r=document.getElementById('center').getBoundingClientRect();camera.aspect=r.width/r.height;camera.updateProjectionMatrix();renderer.setSize(r.width,r.height,false)}
window.addEventListener('resize',resize);
function saveProject(){
 let data={creature:{name:cname.value,type:ctype.value,health:health.value,speed:speed.value},parts:parts.map(p=>({name:p.name,pos:p.position.toArray(),scale:p.scale.toArray(),rot:[p.rotation.x,p.rotation.y,p.rotation.z]})),texture:texCanvas.toDataURL()};
 let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.download='creature_project.json';a.click()
}
function loadProject(){document.getElementById('file').click()}
function readProject(e){
 let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{let d=JSON.parse(rd.result);cname.value=d.creature.name;ctype.value=d.creature.type;health.value=d.creature.health;speed.value=d.creature.speed;
 parts.forEach(p=>root.remove(p));parts=[];
 d.parts.forEach(q=>{let p=addCube(q.name,...q.pos,...q.scale);p.rotation.set(...q.rot)});let im=new Image();im.onload=()=>{tctx.drawImage(im,0,0,512,512);texData=tctx.getImageData(0,0,512,512);applyTexture()};im.src=d.texture;updateTree()
 };rd.readAsText(f)
}
init();
</script>
</body>
</html>
