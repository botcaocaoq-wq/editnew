<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>editnew - Web Video Rigging App</title>
    <!-- Nhúng file CSS làm đẹp giao diện -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app-container">

        <!-- ==========================================
             PHẦN 1: MÀN HÌNH PREVIEW (HIỂN THỊ CHÍNH)
             ========================================== -->
        <div id="preview-window">
            <!-- Nơi vẽ hình ảnh, lưới tam giác và các khớp xương hoạt hình -->
            <canvas id="videoCanvas" width="800" height="450"></canvas>
        </div>


        <!-- ==========================================
             PHẦN 2: THANH CÔNG CỤ ĐIỀU KHIỂN & UPLOAD
             ========================================== -->
        <div id="toolbar">
            
            <!-- KHU VỰC 2.1: CHỌN VÀ TẢI FILE ẢNH VÀO APP -->
            <div class="upload-section">
                <!-- Thẻ input ẩn dùng để chọn file từ máy tính -->
                <input type="file" id="image-upload" accept="image/*" style="display: none;">
                <!-- Nút bấm mồi để người dùng kích hoạt mở bảng chọn file -->
                <button id="btn-upload">📁 Tải ảnh lên</button>
            </div>
            
            <!-- Vạch kẻ dọc chia đôi thanh công cụ cho đẹp mắt -->
            <div class="divider"></div>

            <!-- KHU VỰC 2.2: BỘ 3 CÔNG CỤ BIẾN ĐỔI XƯƠNG -->
            <div class="tools-section">
                <button id="btn-translate">✋ Di chuyển (Translate)</button>
                <button id="btn-rotate">🔄 Xoay (Rotate)</button>
                <button id="btn-scale">🔎 Phóng to (Scale)</button>
            </div>

            <div class="divider"></div>

            <!-- KHU VỰC 2.3: ĐIỂM CHỐT CHUYỂN ĐỘNG -->
            <div class="keyframe-section">
                <button id="btn-keyframe">🔴 Thêm Keyframe</button>
            </div>

        </div>


        <!-- ==========================================
             PHẦN 3: HỆ THỐNG TIMELINE (DÒNG THỜI GIAN)
             ========================================== -->
        <div id="timeline-container">
            
            <!-- KHU VỰC 3.1: ĐIỀU KHIỂN TRÌNH CHIẾU VÀ BỘ ĐẾM GIỜ -->
            <div id="timeline-header">
                <button id="btn-play">▶ Play</button>
                <!-- Hiển thị thời gian chạy thực tế của thanh trượt -->
                <span id="time-display">0.00s / 10.00s</span>
            </div>

            <!-- KHU VỰC 3.2: RÃNH TRƯỢT THỜI GIAN CHÍNH -->
            <div id="timeline-track">
                <!-- Thanh kim dọc màu đỏ biểu thị vị trí giây hiện tại -->
                <div id="playhead"></div> 
            </div>

        </div>

    </div>

    <!-- ==========================================
         PHẦN 4: NƠI NHÚNG CÁC SCRIPT LOGIC (SẼ LÀM SAU)
         ========================================== -->
    <!-- <script src="src/TransformGizmo.js"></script> -->
    <!-- <script src="src/TimelineManager.js"></script> -->
    <!-- <script src="src/RiggingEngine.js"></script> -->

</body>
</html>
