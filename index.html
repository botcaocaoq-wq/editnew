<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>editnew - Real-Time Glitch & Motion FX</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Nhúng thư viện tự động nén chuỗi khung hình thành file GIF -->
    <script src="https://cloudflare.com"></script>
</head>
<body>
    <div id="app-container">

        <!-- 1. MÀN HÌNH HIỂN THỊ ĐỒ HỌA CHÍNH (PREVIEW) -->
        <div id="preview-window">
            <canvas id="videoCanvas" width="800" height="450"></canvas>
        </div>

        <!-- 2. THANH TRƯỢT ĐIỀU CHỈNH THÔNG SỐ (BÊN TRÊN THANH CÔNG CỤ) -->
        <div id="fx-controls-panel">
            <div class="slider-group">
                <label>⚡ Tốc độ (Speed):</label>
                <input type="range" id="slider-speed" min="0.1" max="5" step="0.1" value="1">
            </div>
            <div class="slider-group">
                <label>💥 Cường độ (Amount):</label>
                <input type="range" id="slider-amount" min="1" max="100" step="1" value="30">
            </div>
        </div>

        <!-- 3. THANH MENU CÔNG CỤ CHỨC NĂNG (TOOLBAR) -->
        <div id="toolbar">
            <!-- PHÂN KHU UPLOAD FILE -->
            <div class="upload-section">
                <input type="file" id="image-upload" accept="image/*" style="display: none;">
                <button id="btn-upload">📁 Tải ảnh lên</button>
            </div>
            
            <div class="divider"></div>

            <!-- PHÂN KHU CHỌN HIỆU ỨNG VÀ ĐIỂM NEO GIỮ HÌNH -->
            <div class="fx-section">
                <button id="btn-pin-mode" style="background: #eab308; color: black; font-weight: bold;">📍 Ghim điểm neo</button>
                <button id="btn-fx-stretch" class="active">💇 Co giãn sợi tóc</button>
                <button id="btn-fx-wave">🌊 Uốn gợn sóng</button>
                <button id="btn-fx-bend">🥑 Uốn mềm mại</button>
            </div>

            <div class="divider"></div>

            <!-- PHÂN KHU XUẤT FILE ĐẦU RA -->
            <div class="export-section">
                <button id="btn-export-gif" style="background: #10b981; border-color: #059669; font-weight: bold;">💾 Xuất file GIF</button>
            </div>
        </div>

    </div>

    <script>
        // =========================================================================
        // LOGIC 1: BỘ LỌC ĐIỀU PHỐI BIẾN DẠNG HÌNH ẢNH THỜI GIAN THỰC
        // =========================================================================
        class MotionFXEngine {
            constructor() {
                this.canvas = document.getElementById('videoCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.bgImage = null;
                
                this.currentFX = 'stretch'; // Tên hiệu ứng chạy mặc định ban đầu
                this.isPinMode = false;      // Chế độ chấm điểm neo giữ hình cố định
                this.pins = [];              // Danh sách lưu tọa độ các điểm neo ghim hình
                
                this.time = 0;
                this.speed = 1;
                this.amount = 30;

                this.initEvents();
                this.animate();
            }

            initEvents() {
                // Đọc thông số liên tục từ 2 thanh kéo slider độ biến dạng
                document.getElementById('slider-speed').addEventListener('input', (e) => this.speed = parseFloat(e.target.value));
                document.getElementById('slider-amount').addEventListener('input', (e) => this.amount = parseInt(e.target.value));

                const btnPin = document.getElementById('btn-pin-mode');
                const fxModes = ['stretch', 'wave', 'bend'];

                // Bật/Tắt chế độ chấm điểm ghim cố định vùng ảnh
                btnPin?.addEventListener('click', () => {
                    this.isPinMode = !this.isPinMode;
                    btnPin.classList.toggle('active', this.isPinMode);
                    btnPin.style.background = this.isPinMode ? '#ca8a04' : '#eab308';
                });

                // Chuyển đổi qua lại giữa bộ 3 hiệu ứng biến dạng biến đổi
                fxModes.forEach(mode => {
                    document.getElementById(`btn-fx-${mode}`)?.addEventListener('click', (e) => {
                        this.isPinMode = false;
                        btnPin.classList.remove('active');
                        btnPin.style.background = '#eab308';

                        fxModes.forEach(m => document.getElementById(`btn-fx-${m}`)?.classList.remove('active'));
                        e.target.classList.add('active');
                        this.currentFX = mode;
                    });
                });

                // Xử lý nạp file ảnh từ máy tính của người dùng
                const btnUpload = document.getElementById('btn-upload');
                const fileInput = document.getElementById('image-upload');
                btnUpload?.addEventListener('click', () => fileInput.click());
                fileInput?.addEventListener('change', (e) => {
                    const file = e.target.files[0]; // Lấy chuẩn xác 1 file ảnh gốc đầu tiên
                    if (!file) return;
                    
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        const img = new Image();
                        img.onload = () => { 
                            this.bgImage = img; 
                            this.pins = []; // Reset xóa hết các điểm ghim của ảnh cũ
                        };
                        img.src = ev.target.result;
                    };
                    reader.readAsDataURL(file);
                });

                // Nhấn chuột lên canvas để chấm ghim điểm cố định giữ hình không cho rung lắc
                this.canvas.addEventListener('mousedown', (e) => {
                    const rect = this.canvas.getBoundingClientRect();
                    const mousePos = { x: e.clientX - rect.left, y: e.clientY - rect.top };

                    if (this.isPinMode) {
                        this.pins.push(mousePos); 
                        console.log("[Hệ thống] Đã ghim điểm neo giữ hình tại tọa độ:", mousePos);
                    }
                });
            }

            // Vòng lặp cập nhật chuyển động liên tục thời gian thực (Real-time render)
            animate() {
                this.time += 0.05 * this.speed;
                this.renderFX();
                requestAnimationFrame(() => this.animate());
            }
            // Toán học ma trận bóc tách cấu trúc pixel hình ảnh
            renderFX() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                if (!this.bgImage) {
                    this.ctx.fillStyle = '#18181b';
                    this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                    return;
                }

                // Vẽ ảnh gốc tạm thời ra làm lớp đệm tính toán pixel màu
                this.ctx.drawImage(this.bgImage, 0, 0, this.canvas.width, this.canvas.height);
                const imgData = this.ctx.getImageData(0, 0, this.canvas.width, this.canvas.height);
                const outputData = this.ctx.createImageData(this.canvas.width, this.canvas.height);

                // Quét qua hàng triệu mảng pixel màu trên bề mặt canvas
                for (let y = 0; y < this.canvas.height; y++) {
                    for (let x = 0; x < this.canvas.width; x++) {
                        
                        let srcX = x;
                        let srcY = y;

                        // Kiểm tra khoảng cách toán học Pitago đến các điểm ghim cố định (Pins)
                        let pinInfluence = 1;
                        this.pins.forEach(pin => {
                            const dist = Math.hypot(x - pin.x, y - pin.y);
                            if (dist < 80) {
                                pinInfluence *= (dist / 80); // Càng sát điểm ghim thì độ méo của hiệu ứng càng giảm hẳn về 0
                            }
                        });

                        // Áp dụng thuật toán lượng giác bẻ cong ma trận điểm ảnh hình ảnh
                        if (this.currentFX === 'stretch') {
                            // 1. Hiệu ứng co giãn sợi tóc kéo dãn chảy dài hình
                            srcX += Math.sin(y * 0.02 + this.time) * this.amount * 0.3 * pinInfluence;
                        } else if (this.currentFX === 'wave') {
                            // 2. Hiệu ứng uốn gợn sóng biến dạng dập dềnh cuộn
                            srcY += Math.sin(x * 0.05 + this.time) * this.amount * 0.4 * pinInfluence;
                        } else if (this.currentFX === 'bend') {
                            // 3. Hiệu ứng uốn cong phồng lồi mắt cá mềm mại
                            const distFromCenter = Math.hypot(x - this.canvas.width/2, y - this.canvas.height/2);
                            const force = Math.cos(distFromCenter * 0.01 - this.time) * this.amount * 0.2;
                            srcX += (x - this.canvas.width/2) * 0.01 * force * pinInfluence;
                            srcY += (y - this.canvas.height/2) * 0.01 * force * pinInfluence;
                        }

                        // Khóa cố định tọa độ quét để không văng lệch ra khỏi mép khung canvas
                        srcX = Math.max(0, Math.min(this.canvas.width - 1, Math.round(srcX)));
                        srcY = Math.max(0, Math.min(this.canvas.height - 1, Math.round(srcY)));

                        // Sao chép ma trận kênh màu RGB sang khung canvas render mới
                        const targetIdx = (y * this.canvas.width + x) * 4;
                        const srcIdx = (srcY * this.canvas.width + srcX) * 4;

                        outputData.data[targetIdx] = imgData.data[srcIdx];
                        outputData.data[targetIdx+1] = imgData.data[srcIdx+1];
                        outputData.data[targetIdx+2] = imgData.data[srcIdx+2];
                        outputData.data[targetIdx+3] = 255; 
                    }
                }

                // Ghi đè dữ liệu pixel đã uốn cong hoàn chỉnh ra màn hình canvas
                this.ctx.putImageData(outputData, 0, 0);

                // Vẽ các điểm Ghim neo hình tròn màu vàng phát sáng định vị lên trên bề mặt ảnh
                this.pins.forEach(pin => {
                    this.ctx.beginPath(); this.ctx.arc(pin.x, pin.y, 6, 0, Math.PI * 2);
                    this.ctx.fillStyle = '#fbbf24'; this.ctx.fill();
                    this.ctx.strokeStyle = '#ffffff'; this.ctx.lineWidth = 1.5; this.ctx.stroke();
                });
            }

            // HÀM CHỤP LẠI KHUNG HÌNH VÀ ĐÓNG GÓI XUẤT FILE ẢNH ĐỘNG GIF ĐỂ TẢI VỀ
            exportToGIF() {
                if (!this.bgImage) return alert("Vui lòng tải một bức ảnh lên trước khi xuất file!");
                const btn = document.getElementById('btn-export-gif');
                btn.innerText = "⏳ Đang xuất GIF..."; btn.style.background = "#4b5563";

                const frames = [];
                let count = 0;
                
                // Thu âm chụp liên tục 20 khung hình chuyển động lặp vòng để ghép thành file GIF
                const captureLoop = () => {
                    if (count < 20) {
                        frames.push(this.canvas.toDataURL());
                        count++;
                        setTimeout(captureLoop, 60); 
                    } else {
                        // Kích hoạt thư viện nén chuỗi ảnh chụp thành file GIF đầu ra hoàn chỉnh
                        gifshot.createGIF({
                            images: frames, interval: 0.06, numFrames: 20, gifWidth: 400, gifHeight: 225
                        }, (obj) => {
                            if (!obj.error) {
                                const link = document.createElement('a'); link.href = obj.image;
                                link.download = 'editnew_animation.gif'; link.click(); // Kích hoạt lệnh tải tự động file về máy tính
                            }
                            btn.innerText = "💾 Xuất file GIF"; btn.style.background = "#10b981";
                        });
                    }
                };
                captureLoop();
            }
        }

        // Kích hoạt chạy toàn bộ ứng dụng liên kết
        window.onload = () => {
            window.fxApp = new MotionFXEngine();
            document.getElementById('btn-export-gif').addEventListener('click', () => window.fxApp.exportToGIF());
        };
    </script>
</body>
</html>
