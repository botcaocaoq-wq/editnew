<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web 3D Sculpting Studio Pro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a1a; color: #fff; overflow: hidden; }
        
        #app-container { display: flex; width: 100vw; height: 100vh; }
        
        /* Sidebar chỉnh công cụ */
        #sidebar { width: 320px; background: #262626; border-right: 1px solid #333; padding: 20px; display: flex; flex-direction: column; gap: 20px; z-index: 10; overflow-y: auto; }
        h3 { font-size: 16px; text-transform: uppercase; letter-spacing: 1px; color: #00adb5; border-bottom: 1px solid #333; padding-bottom: 8px; }
        
        .section { display: flex; flex-direction: column; gap: 10px; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        button { background: #333; color: #fff; border: 1px solid #444; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: 600; transition: all 0.2s; }
        button:hover { background: #444; border-color: #00adb5; }
        button.active { background: #00adb5; border-color: #00adb5; color: #fff; }
        
        /* Grid 14 công cụ chuyên nghiệp */
        .tools-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .tools-grid button { font-size: 12px; text-align: left; padding: 8px 12px; }
        
        /* Cấu hình lưới */
        .slider-container { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
        input[type="range"] { width: 100%; accent-color: #00adb5; }
        .btn-action { background: #222; border: 1px dashed #00adb5; color: #00adb5; grid-column: span 2; text-align: center; }
        .btn-action:hover { background: #00adb5; color: #fff; }

        /* Màn hình hiển thị 3D */
        #canvas-container { flex: 1; position: relative; height: 100%; background: radial-gradient(circle, #2d3436 0%, #1e272e 100%); }
        #canvas-container canvas { width: 100%; height: 100%; display: block; }
        
        .instructions { position: absolute; bottom: 20px; left: 20px; background: rgba(0,0,0,0.7); padding: 12px; border-radius: 6px; font-size: 12px; line-height: 1.6; pointer-events: none; border-left: 3px solid #00adb5; }
    </style>
    <!-- Nhúng thư viện Three.js và OrbitControls điều khiển góc nhìn -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="app-container">
        <!-- BẢNG ĐIỀU KHIỂN SỰ KIỆN -->
        <div id="sidebar">
            <!-- 1. Chọn khối cơ bản -->
            <div class="section">
                <h3>Khối Cơ Bản</h3>
                <div class="btn-group">
                    <button id="btn-sphere" class="active" onclick="changeMesh('sphere')">Khối Cầu</button>
                    <button id="btn-box" onclick="changeMesh('box')">Khối Vuông</button>
                    <button id="btn-cone" onclick="changeMesh('cone')">Tam Giác</button>
                </div>
            </div>

            <!-- 2. Điều khiển cấu hình và mật độ lưới -->
            <div class="section">
                <h3>Cấu Hình Lưới (Mesh)</h3>
                <div class="slider-container">
                    <label>Độ mượt lưới ban đầu: <span id="smooth-val">32</span></label>
                    <input type="range" id="mesh-smoothness" min="8" max="64" value="32" oninput="updateSmoothness(this.value)">
                </div>
                <button class="btn-action" onclick="subdivideToMax()">Nhân Lưới Siêu Mịn (Level 50)</button>
            </div>

            <!-- 3. Danh sách 14 công cụ Sculpting chuyên nghiệp -->
            <div class="section">
                <h3>14 Công Cụ Tiêu Chuẩn</h3>
                <div class="tools-grid" id="tools-panel">
                    <button class="active" onclick="setTool('draw')">1. Draw (Vẽ khối)</button>
                    <button onclick="setTool('clay')">2. Clay (Đắp đất)</button>
                    <button onclick="setTool('inflate')">3. Inflate (Làm phồng)</button>
                    <button onclick="setTool('blob')">4. Blob (Giọt nước)</button>
                    <button onclick="setTool('crease')">5. Crease (Nếp gấp)</button>
                    <button onclick="setTool('smooth')">6. Smooth (Làm mịn)</button>
                    <button onclick="setTool('flatten')">7. Flatten (Phẳng mặt)</button>
                    <button onclick="setTool('scrape')">8. Scrape (Cạo bề mặt)</button>
                    <button onclick="setTool('fill')">9. Fill (Làm đầy khe)</button>
                    <button onclick="setTool('grab')">10. Grab (Kéo khối)</button>
                    <button onclick="setTool('snake')">11. Snake Hook (Kéo gai)</button>
                    <button onclick="setTool('thumb')">12. Thumb (Miết tay)</button>
                    <button onclick="setTool('nudge')">13. Nudge (Đẩy nhẹ)</button>
                    <button onclick="setTool('pinch')">14. Pinch (Bóp nhọn)</button>
                </div>
            </div>
        </div>

        <!-- MÀN HÌNH HIỂN THỊ HÌNH 3D -->
        <div id="canvas-container">
            <div class="instructions">
                🖱️ <b>Chuột trái:</b> Giữ và di chuyển để nặn tượng<br>
                🖱️ <b>Chuột phải / Ctrl + Chuột trái:</b> Xoay camera nhìn mô hình<br>
                📜 <b>Cuộn chuột:</b> Phóng to / Thu nhỏ mô hình
            </div>
        </div>
    </div>

    <script>
        // --- 1. KHỞI TẠO MÔI TRƯỜNG HÌNH 3D (THREE.JS) ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 0, 8);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.mouseButtons = { LEFT: THREE.MOUSE.NONE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.ROTATE };

        // Thiết lập ánh sáng studio chuyên nghiệp
        const ambientLight = new THREE.AmbientLight(0x333333);
        scene.add(ambientLight);

        const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight1.position.set(5, 10, 7);
        scene.add(dirLight1);

        const dirLight2 = new THREE.DirectionalLight(0x00adb5, 0.3);
        dirLight2.position.set(-5, -5, -5);
        scene.add(dirLight2);

        // --- 2. QUẢN LÝ KHỐI MODEL 3D & LƯỚI ---
        let currentMeshType = 'sphere';
        let currentSegments = 32;
        let sculptMesh;
        
        const material = new THREE.MeshStandardMaterial({
            color: 0x90a4ae,
            roughness: 0.6,
            metalness: 0.1,
            wireframe: false,
            flatShading: true
        });

        function generateGeometry(type, segments) {
            if (type === 'sphere') return new THREE.SphereGeometry(2, segments, segments);
            if (type === 'box') return new THREE.BoxGeometry(2.5, 2.5, 2.5, segments/2, segments/2, segments/2);
            if (type === 'cone') return new THREE.ConeGeometry(2, 3, segments, segments);
        }

        function createSculptMesh() {
            if (sculptMesh) scene.remove(sculptMesh);
            const geometry = generateGeometry(currentMeshType, currentSegments);
            sculptMesh = new THREE.Mesh(geometry, material);
            scene.add(sculptMesh);
        }
        createSculptMesh();

        function changeMesh(type) {
            document.querySelectorAll('.btn-group button').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${type}`).classList.add('active');
            currentMeshType = type;
            createSculptMesh();
        }

        function updateSmoothness(val) {
            document.getElementById('smooth-val').innerText = val;
            currentSegments = parseInt(val);
            createSculptMesh();
        }

        function subdivideToMax() {
            document.getElementById('mesh-smoothness').value = 50;
            updateSmoothness(50);
            alert("Đã kích hoạt lưới siêu mịn (Level 50)!");
        }

        // --- 3. QUẢN LÝ 14 CÔNG CỤ NẶN TƯỢNG ---
        let activeTool = 'draw';
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let isSculpting = false;

        function setTool(toolName) {
            activeTool = toolName;
            const buttons = document.querySelectorAll('#tools-panel button');
            buttons.forEach(btn => {
                if (btn.getAttribute('onclick').includes(toolName)) btn.classList.add('active');
                else btn.classList.remove('active');
            });
        }

        // --- 4. XỬ LÝ TÁC ĐỘNG VẬT LÝ VÀO ĐIỂM LƯỚI ---
        function sculpt(event) {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(sculptMesh);

            if (intersects.length > 0) {
                const hitPoint = intersects.point;
                const geometry = sculptMesh.geometry;
                const positionAttribute = geometry.attributes.position;
                const vertex = new THREE.Vector3();

                const brushRadius = 0.6;
                let brushIntensity = 0.05;

                if (activeTool === 'smooth' || activeTool === 'flatten' || activeTool === 'scrape') {
                    brushIntensity = 0.02;
                }

                for (let i = 0; i < positionAttribute.count; i++) {
                    vertex.fromBufferAttribute(positionAttribute, i);
                    const worldVertex = vertex.clone().applyMatrix4(sculptMesh.matrixWorld);
                    const distance = worldVertex.distanceTo(hitPoint);

                    if (distance < brushRadius) {
                        const falloff = (1 - distance / brushRadius);
                        const normal = intersects.face.normal.clone();

                        switch(activeTool) {
                            case 'draw':
                            case 'clay':
                                vertex.addScaledVector(normal, brushIntensity * falloff);
                                break;
                            case 'inflate':
                            case 'blob':
                                const dir = worldVertex.clone().sub(hitPoint).normalize();
                                vertex.addScaledVector(dir, brushIntensity * 1.5 * falloff);
                                break;
                            case 'crease':
                            case 'scrape':
                                vertex.addScaledVector(normal, -brushIntensity * 1.2 * falloff);
                                break;
                            case 'smooth':
                                const center = hitPoint.clone().applyMatrix4(sculptMesh.matrixWorld.invert());
                                vertex.lerp(center, 0.08 * falloff);
                                break;
                            case 'flatten':
                                const localHit = hitPoint.clone().applyMatrix4(sculptMesh.matrixWorld.invert());
                                vertex.y = THREE.MathUtils.lerp(vertex.y, localHit.y, 0.1 * falloff);
                                break;
                            case 'grab':
                            case 'snake':
                            case 'thumb':
                            case 'nudge':
                                vertex.add(new THREE.Vector3(0, brushIntensity * falloff, 0));
                                break;
                            case 'pinch':
                            case 'fill':
                                const toHit = hitPoint.clone().applyMatrix4(sculptMesh.matrixWorld.invert()).sub(vertex);
                                vertex.addScaledVector(toHit, 0.1 * falloff);
                                break;
                        }
                        positionAttribute.setXYZ(i, vertex.x, vertex.y, vertex.z);
                    }
                }
                positionAttribute.needsUpdate = true;
                geometry.computeVertexNormals();
            }
        }

        // --- 5. LẮNG NGHE SỰ KIỆN CHUỘT ---
        window.addEventListener('mousedown', (e) => {
            if(e.button === 0 && !e.ctrlKey) {
                isSculpting = true;
                controls.enabled = false;
                sculpt(e);
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (isSculpting) sculpt(e);
        });

        window.addEventListener('mouseup', () => {
            isSculpting = false;
            controls.enabled = true;
        });

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
