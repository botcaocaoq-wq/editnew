async function loadPolyHavenFast() {
    // Hiện thư viện từ cache ngay nếu có.
    try {
        const cached = JSON.parse(localStorage.getItem(ASSET_CACHE_KEY) || "null");
        if (cached?.assets?.length) {
            polyAssets = cached.assets;
            renderLibrary();
        }
    } catch (error) {
        console.warn("Poly Haven cache error:", error);
    }

    // Tải metadata mới ở nền, không chặn model upload.
    try {
        const response = await fetch(API + "/assets", { cache: "force-cache" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();

        polyAssets = Object.entries(data)
            .filter(([, asset]) => asset && asset.type === 1)
            .map(([id, asset]) => ({
                id,
                name: asset.name || id,
                category: asset.category || "",
                tags: Array.isArray(asset.tags) ? asset.tags : [],
                thumbnail_url: asset.thumbnail_url || ""
            }));

        try {
            localStorage.setItem(
                ASSET_CACHE_KEY,
                JSON.stringify({ time: Date.now(), assets: polyAssets })
            );
        } catch (_) {}

        renderLibrary();
    } catch (error) {
        console.warn("Poly Haven load failed:", error);
        if (!polyAssets.length) {
            textureList.innerHTML = '<div class="error">Không tải được Poly Haven.<br>Bạn vẫn có thể upload texture riêng.</div>';
        }
    }
}

function createHumanSkinPreview() {
    const canvas = document.createElement("canvas");
    canvas.width = 220; canvas.height = 220;
    const ctx = canvas.getContext("2d", {alpha:false});
    const img = ctx.createImageData(canvas.width, canvas.height);
    let seed = 1337;
    const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
    for (let y=0;y<220;y++) {
        for (let x=0;x<220;x++) {
            const n = .72 + .28 * rnd();
            const warm = Math.sin(x*.055+y*.018)*5 + Math.sin(y*.09)*3;
            const i=(y*220+x)*4;
            img.data[i]=Math.max(0,Math.min(255,206*n+warm));
            img.data[i+1]=Math.max(0,Math.min(255,145*n+warm*.55));
            img.data[i+2]=Math.max(0,Math.min(255,122*n+warm*.35));
            img.data[i+3]=255;
        }
    }
    ctx.putImageData(img,0,0);
    ctx.globalAlpha=.16;
    for(let i=0;i<900;i++){
        const x=rnd()*220, y=rnd()*220, r=.25+rnd()*1.2;
        ctx.fillStyle=rnd()>.52?"#7d463f":"#efb09a";
        ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    }
    return canvas.toDataURL("image/png");
}

function makeLocalMaterialPreview(kind){
    const canvas=document.createElement("canvas");
    canvas.width=220; canvas.height=220;
    const ctx=canvas.getContext("2d",{alpha:false});
    const img=ctx.createImageData(220,220);
    let seed=0x12345678+kind.length*997;
    const rnd=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;};
    const palettes={
        glass:[[165,205,230],[235,250,255]], fabric:[[90,100,114],[165,175,188]],
        leather:[[75,43,25],[156,92,48]], ceramic:[[195,195,188],[242,242,235]],
        marble:[[170,170,166],[238,238,232]], brick:[[122,57,39],[198,108,73]],
        rubber:[[28,30,32],[74,77,81]], water:[[38,103,135],[112,200,230]],
        plastic:[[72,90,120],[180,205,235]], crystal:[[90,145,205],[225,250,255]],
        lava:[[94,28,10],[235,74,18]], clay:[[142,84,57],[205,132,92]],
        carpet:[[60,58,55],[130,125,118]], paper:[[175,174,168],[232,230,220]]
    };
    const pal=palettes[kind]||palettes.ceramic;
    for(let y=0;y<220;y++) for(let x=0;x<220;x++){
        const u=x/220,v=y/220;
        const n=.55+.45*(.5+.5*Math.sin(u*17+Math.sin(v*9)*2));
        let r=pal[0][0]*(.8+.22*n),g=pal[0][1]*(.8+.22*n),b=pal[0][2]*(.8+.22*n);
        if(kind==="glass"){
            const s=Math.max(0,Math.sin(u*30+v*8+n*4)); r+=pal[1][0]*.12*s; g+=pal[1][1]*.14*s; b+=pal[1][2]*.16*s;
        } else if(kind==="fabric"){
            const w=(Math.sin(x*.95)*.5+.5)*(Math.sin(y*.95)*.5+.5); r+=36*w;g+=38*w;b+=42*w;
        } else if(kind==="leather"){
            const q=Math.sin(u*58+n*11)*Math.sin(v*47+n*7);r+=16*q;g+=11*q;b+=7*q;
        } else if(kind==="ceramic"){
            const q=Math.sin(u*12+v*8)*7;r+=q;g+=q;b+=q;
        } else if(kind==="marble"){
            const q=Math.max(0,Math.sin(u*12+v*17+Math.sin(v*13)*3))*34;r-=q*.62;g-=q*.65;b-=q*.68;
        } else if(kind==="brick"){
            const row=Math.floor(v*13),off=row%2?.08:0;const mortar=Math.abs(((u+off)%0.24)-.12)<.008||Math.abs((v*13%1)-.98)<.018;if(mortar){r*=.62;g*=.62;b*=.62;}
        } else if(kind==="rubber"){
            const q=Math.sin(u*75+v*15)*3.5;r+=q;g+=q;b+=q;
        } else if(kind==="water"){
            const q=Math.sin(u*25+v*11)*12+Math.sin(v*33-u*8)*7;r+=q*.15;g+=q*.55;b+=q*.8;
        }
        const i=(y*220+x)*4;img.data[i]=Math.max(0,Math.min(255,Math.round(r)));img.data[i+1]=Math.max(0,Math.min(255,Math.round(g)));img.data[i+2]=Math.max(0,Math.min(255,Math.round(b)));img.data[i+3]=255;
    }
    ctx.putImageData(img,0,0);
    if(kind==="marble"||kind==="glass"){
        ctx.globalAlpha=.14;ctx.strokeStyle=kind==="glass"?"#fff":"#666";ctx.lineWidth=1.1;
        for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(rnd()*220,0);for(let y=20;y<=220;y+=20)ctx.lineTo(35+rnd()*150,y);ctx.stroke();}
    }
    if(kind==="fabric"){
        ctx.globalAlpha=.07;ctx.strokeStyle="#fff";for(let i=0;i<220;i+=5){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,220);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(220,i);ctx.stroke();}
    }
    return canvas.toDataURL("image/png");
}

async function applyPolyMaterial(asset, card) {
    if (!selectedMesh) {
        alert("Hãy click vào một mesh trước.");
        return;
    }
    if (card?.dataset.loading === "1") return;

    const targetMesh = selectedMesh;
    const targetMaterialIndex = selectedMaterialIndex;
    lastAppliedAsset = { ...asset };
    const applyId = ++textureApplyToken;
    const material = ensureEditableMaterial(targetMesh);

    if (card) {
        card.dataset.loading = "1";
        card.classList.add("loading");
    }

    try {
        const files = await getPolyFiles(asset.id);
        const textureFiles = findTextureFiles(files);
        if (!Object.values(textureFiles).some(Boolean)) throw new Error("Không tìm thấy PBR maps.");

        saveHistory();

        // Base Color được ưu tiên. Gắn ngay khi xong, không đợi PBR khác.
        if (textureFiles.diff) {
            const diff = await loadCachedTexture(textureFiles.diff, THREE.SRGBColorSpace);
            if (isCurrentApply(applyId, targetMesh, targetMaterialIndex)) {
                material.map = diff;
                material.needsUpdate = true;
                applyUVToMaterial(material);
                updateSelectionUI();
            } else {
                return;
            }
        }

        // Các map còn lại chạy song song ở nền.
        const jobs = [];
        if (textureFiles.rough) jobs.push(loadCachedTexture(textureFiles.rough, THREE.NoColorSpace).then(tex => ({ type: "rough", tex })));
        if (textureFiles.normal) jobs.push(loadCachedTexture(textureFiles.normal, THREE.NoColorSpace).then(tex => ({ type: "normal", tex })));
        if (textureFiles.ao) jobs.push(loadCachedTexture(textureFiles.ao, THREE.NoColorSpace).then(tex => ({ type: "ao", tex })));
        if (textureFiles.metal) jobs.push(loadCachedTexture(textureFiles.metal, THREE.NoColorSpace).then(tex => ({ type: "metal", tex })));

        Promise.all(jobs)
            .then(maps => {
                if (!isCurrentApply(applyId, targetMesh, targetMaterialIndex)) return;
                for (const { type, tex } of maps) {
                    if (type === "rough") material.roughnessMap = tex;
                    if (type === "normal") material.normalMap = tex;
                    if (type === "ao") {
                        material.aoMap = tex;
                        ensureUV2(targetMesh);
                    }
                    if (type === "metal") material.metalnessMap = tex;
                }
                material.needsUpdate = true;
                applyUVToMaterial(material);
                updateSelectionUI();
            })
            .catch(error => console.warn("Background PBR map error:", error));
    } catch (error) {
        console.error("Material load error:", error);
        if (isCurrentApply(applyId, targetMesh, targetMaterialIndex)) {
            alert("Không thể tải material này.");
        }
    } finally {
        if (card) {
            card.dataset.loading = "0";
            card.classList.remove("loading");
        }
    }
}

function isCurrentApply(id, mesh, materialIndex) {
    return id === textureApplyToken && selectedMesh === mesh && selectedMaterialIndex === materialIndex;
}

async function getPolyFiles(assetId) {
    if (polyFilesCache.has(assetId)) return polyFilesCache.get(assetId);

    const sessionKey = `polyFiles:${assetId}`;
    try {
        const cached = sessionStorage.getItem(sessionKey);
        if (cached) {
            const parsed = JSON.parse(cached);
            polyFilesCache.set(assetId, parsed);
            return parsed;
        }
    } catch (_) {}

    const response = await fetch(`${API}/files/${encodeURIComponent(assetId)}`, { cache: "force-cache" });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);

    const files = await response.json();
    polyFilesCache.set(assetId, files);
    try { sessionStorage.setItem(sessionKey, JSON.stringify(files)); } catch (_) {}
    return files;
}

function loadCachedTexture(url, colorSpace) {
    const key = `${url}|${colorSpace}`;
    if (textureCache.has(key)) return Promise.resolve(textureCache.get(key));
    if (pendingTextureLoads.has(key)) return pendingTextureLoads.get(key);

    const promise = new Promise((resolve, reject) => {
        const loader = new THREE.TextureLoader();
        loader.load(
            url,
            texture => {
                prepareTexture(texture, colorSpace);
                textureCache.set(key, texture);
                pendingTextureLoads.delete(key);
                resolve(texture);
            },
            undefined,
            error => {
                pendingTextureLoads.delete(key);
                reject(error);
            }
        );
    });

    pendingTextureLoads.set(key, promise);
    return promise;
}

function prepareTexture(texture, colorSpace) {
    texture.colorSpace = colorSpace;
    texture.wrapS = THREE.RepeatWrapping;
    texture.wrapT = THREE.RepeatWrapping;
    texture.anisotropy = Math.min(renderer.capabilities.getMaxAnisotropy(), 4);
}

function findTextureFiles(obj) {
    const candidates = { diff: [], rough: [], normal: [], ao: [], metal: [] };

    function put(type, url, key) {
        if (!url) return;
        const lower = `${key} ${url}`.toLowerCase();
        candidates[type].push({ url, lower });
    }

    function walk(value) {
        if (!value || typeof value !== "object") return;
        for (const key in value) {
            const v = value[key];
            if (v && typeof v === "object") {
                if (v.url) {
                    const s = `${key} ${v.url}`.toLowerCase();
                    if (s.includes("diff") || s.includes("albedo") || s.includes("basecolor")) put("diff", v.url, key);
                    if (s.includes("rough")) put("rough", v.url, key);
                    if (s.includes("nor_gl") || s.includes("normal")) put("normal", v.url, key);
                    if (s.includes("ao")) put("ao", v.url, key);
                    if (s.includes("metal")) put("metal", v.url, key);
                }
                walk(v);
            }
        }
    }

    function pick(list) {
        if (!list.length) return null;
        const score = item => {
            const s = item.lower;
            if (/(^|[^0-9])512([^0-9]|$)/.test(s)) return 5;
            if (/(^|[^0-9])1k([^0-9]|$)/.test(s)) return 10;
            if (/(^|[^0-9])2k([^0-9]|$)/.test(s)) return 20;
            if (/(^|[^0-9])4k([^0-9]|$)/.test(s)) return 40;
            if (/(^|[^0-9])8k([^0-9]|$)/.test(s)) return 80;
            if (/(^|[^0-9])16k([^0-9]|$)/.test(s)) return 160;
            return 30;
        };
        return [...list].sort((a, b) => score(a) - score(b))[0].url;
    }

    walk(obj);
    return {
        diff: pick(candidates.diff),
        rough: pick(candidates.rough),
        normal: pick(candidates.normal),
        ao: pick(candidates.ao),
        metal: pick(candidates.metal)
    };
}

function ensureEditableMaterial(mesh) {
    if (Array.isArray(mesh.material)) {
        if (!mesh.userData.textureStudioCloned) {
            mesh.material = mesh.material.map(m => m.clone());

    if (!mesh.userData.textureStudioCloned) {
        mesh.material = mesh.material.clone();
        mesh.userData.textureStudioCloned = true;
    }
    return mesh.material;
}

function getTriangleMaterialIndex(geometry, triangleIndex) {
    const indexOffset = triangleIndex * 3;
    const groups = geometry.groups || [];
    for (const group of groups) {
        const start = group.start;
        const end = group.start + group.count;
        if (indexOffset >= start && indexOffset < end) return group.materialIndex || 0;
    }
    return 0;
}

function unionFind(size) {
    const parent = new Int32Array(size);
    const rank = new Uint8Array(size);
    for (let i = 0; i < size; i++) parent[i] = i;

    function find(x) {
        let root = x;
        while (parent[root] !== root) root = parent[root];
        while (parent[x] !== x) {
            const next = parent[x];
            parent[x] = root;
            x = next;
        }
        return root;
    }

    function unite(a, b) {
        a = find(a);
        b = find(b);
        if (a === b) return;
        if (rank[a] < rank[b]) [a, b] = [b, a];
        parent[b] = a;
        if (rank[a] === rank[b]) rank[a]++;
    }

    return { find, unite };
}

function buildPartGeometry(geometry, triangles, indexArray) {
    const sourceAttributes = geometry.attributes;
    const used = new Map();
    const sourceVertexIds = [];
    const localIndices = [];
    const materialIds = [];

    const localVertex = globalIndex => {
        if (used.has(globalIndex)) return used.get(globalIndex);
        const id = sourceVertexIds.length;
        used.set(globalIndex, id);
        sourceVertexIds.push(globalIndex);
        return id;
    };

    for (const tri of triangles) {
        localIndices.push(
            localVertex(indexArray[tri.offset]),
            localVertex(indexArray[tri.offset + 1]),
            localVertex(indexArray[tri.offset + 2])
        );
        materialIds.push(tri.materialIndex || 0);
    }

    const partGeometry = new THREE.BufferGeometry();

    for (const name in sourceAttributes) {
        const attr = sourceAttributes[name];
        if (!attr || !attr.array || !Number.isInteger(attr.itemSize)) continue;

        const ArrayType = attr.array.constructor;
        const values = new ArrayType(sourceVertexIds.length * attr.itemSize);

        for (let i = 0; i < sourceVertexIds.length; i++) {
            const src = sourceVertexIds[i] * attr.itemSize;
            const dst = i * attr.itemSize;
            for (let j = 0; j < attr.itemSize; j++) {
                values[dst + j] = attr.array[src + j];
            }
        }

        partGeometry.setAttribute(
            name,
            new THREE.BufferAttribute(values, attr.itemSize, attr.normalized)
        );
    }

    partGeometry.setIndex(localIndices);

    let runStart = 0;
    let runMaterial = materialIds[0] || 0;

    for (let i = 1; i <= materialIds.length; i++) {
        const nextMaterial = i < materialIds.length ? (materialIds[i] || 0) : -1;
        if (nextMaterial !== runMaterial) {
            partGeometry.addGroup(
                runStart * 3,
                (i - runStart) * 3,
                runMaterial
            );
            runStart = i;
            runMaterial = nextMaterial;
        }
    }

    if (!sourceAttributes.normal) {
        partGeometry.computeVertexNormals();
    }

    partGeometry.computeBoundingBox();
    partGeometry.computeBoundingSphere();
    return partGeometry;
}

function separateSelectedMesh() {
    if (!selectedMesh || !model) {
        alert("Hãy click chọn mesh trước.");
        return;
    }

    const mesh = selectedMesh;
    if (!mesh.isMesh || !mesh.geometry?.attributes?.position) return;

    const button = document.getElementById("separateBtn");
    button?.classList.add("busy");
    setSeparateStatus("Đang tách các phần của mesh...");

    requestAnimationFrame(() => {
        try {
            const geometry = mesh.geometry;
            const position = geometry.attributes.position;
            const vertexCount = position.count;

            if (vertexCount < 3) {
                setSeparateStatus("Mesh này không có đủ dữ liệu để tách.");
                setTimeout(() => setSeparateStatus("", false), 1800);
                return;
            }

            let indexArray;

            if (geometry.index) {
                indexArray = geometry.index.array;
            } else {
                // Tạo index giả để xử lý model không indexed.
                indexArray = new Uint32Array(vertexCount);
                for (let i = 0; i < vertexCount; i++) indexArray[i] = i;
            }

            const triangleCount = Math.floor(indexArray.length / 3);
            if (triangleCount <= 1) {
                setSeparateStatus("Mesh này không có đủ mặt để tách.");
                setTimeout(() => setSeparateStatus("", false), 1800);
                return;
            }

            const uf = unionFind(vertexCount);

            // Indexed mesh: vertices có cùng index tự động liên kết.
            // Non-indexed mesh: tìm các vertex trùng/siêu gần nhau bằng vị trí.
            if (geometry.index) {
                for (let t = 0; t < triangleCount; t++) {
                    const o = t * 3;
                    uf.unite(indexArray[o], indexArray[o + 1]);
                    uf.unite(indexArray[o + 1], indexArray[o + 2]);
                }
            } else {
                const buckets = new Map();
                const q = 100000;

                for (let i = 0; i < vertexCount; i++) {
                    const x = Math.round(position.getX(i) * q);
                    const y = Math.round(position.getY(i) * q);
                    const z = Math.round(position.getZ(i) * q);
                    const key = `${x}|${y}|${z}`;

                    const previous = buckets.get(key);
                    if (previous !== undefined) uf.unite(previous, i);
                    else buckets.set(key, i);
                }

                for (let t = 0; t < triangleCount; t++) {
                    const o = t * 3;
                    uf.unite(indexArray[o], indexArray[o + 1]);
                    uf.unite(indexArray[o + 1], indexArray[o + 2]);
                }
            }

            const components = new Map();

            for (let t = 0; t < triangleCount; t++) {
                const o = t * 3;
                const root = uf.find(indexArray[o]);

                if (!components.has(root)) components.set(root, []);

                components.get(root).push({
                    offset: o,
                    materialIndex: getTriangleMaterialIndex(geometry, t)
                });
            }

            if (components.size <= 1) {
                setSeparateStatus("Mesh chỉ có 1 phần liên kết.");
                setTimeout(() => setSeparateStatus("", false), 1800);
                return;
            }

            const parent = mesh.parent || model;
            const originalName = mesh.name || "Mesh";
            const sourceMaterials = Array.isArray(mesh.material)
                ? mesh.material
                : [mesh.material];

            const parts = [];
            let partNumber = 1;

            for (const triangles of components.values()) {
                const partGeometry = buildPartGeometry(
                    geometry,
                    triangles,
                    indexArray
                );

                const partMaterials = sourceMaterials.map(m =>
                    m?.clone ? m.clone() : m
                );

                const part = new THREE.Mesh(
                    partGeometry,
                    partMaterials.length === 1
                        ? partMaterials[0]
                        : partMaterials
                );

                part.name = `${originalName}_Part_${String(partNumber).padStart(2, "0")}`;
                part.position.copy(mesh.position);
                part.quaternion.copy(mesh.quaternion);
                part.scale.copy(mesh.scale);
                part.renderOrder = mesh.renderOrder;
                part.castShadow = mesh.castShadow;
                part.receiveShadow = mesh.receiveShadow;
                part.userData.separatedFrom = originalName;
                part.userData.separatedPart = partNumber;
                part.userData.textureStudioCloned = true;

                parent.add(part);
                parts.push(part);
                partNumber++;
            }

            parent.remove(mesh);
            geometry.dispose();

            selectedMesh = parts[0] || null;
            selectedMaterialIndex = 0;
            renderPartsList();
            updateSelectionUI();

            setSeparateStatus(
                `Đã tách ${parts.length} phần. Mỗi phần giờ là một mesh riêng.`
            );
            setTimeout(() => setSeparateStatus("", false), 2600);
        } catch (error) {
            console.error("Separate Parts error:", error);
            setSeparateStatus("Không thể tách mesh này.");
            setTimeout(() => setSeparateStatus("", false), 2200);
        } finally {
            button?.classList.remove("busy");
        }
    });
}

function clearCracks() {
    for (const crack of crackItems) {
        crack.traverse(obj => {
            if (obj.geometry) obj.geometry.dispose();
            if (obj.material) {
                const maps = [obj.material.map];
                maps.forEach(tex => tex?.dispose());
                obj.material.dispose();
            }
        });
        scene.remove(crack);
    }
    crackItems.clear();
    activeCrack = null;
}

function loadModel(event) {
    const file = event.target.files[0];
    event.target.value = "";
    if (!file) return;

    const url = URL.createObjectURL(file);
    const loader = new GLTFLoader();

    loader.load(
        url,
        gltf => {
            clearCracks();
            disposeModel(model);
            model = gltf.scene;
            selectedMesh = null;
            selectedMaterialIndex = 0;
            crackMode = false;

            renderer.domElement.style.cursor = "default";
            textureApplyToken++;
            scene.add(model);

            model.traverse(obj => {
                if (!obj.isMesh) return;
                obj.castShadow = false;
                obj.receiveShadow = false;
                const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
                mats.forEach(mat => {
                    if (mat?.map) mat.map.colorSpace = THREE.SRGBColorSpace;
                });
            });

            centerModel();
            document.getElementById("modelName").textContent = file.name;
            document.getElementById("selectionInfo").textContent = "Nothing selected";
            document.getElementById("selectedName").textContent = "NONE";
            renderPartsList();
            URL.revokeObjectURL(url);
        },
        undefined,
        error => {
            console.error(error);
            URL.revokeObjectURL(url);
            alert("Không thể đọc model.");
        }
    );
}

function disposeModel(root) {
    if (!root) return;

    root.traverse(obj => {
        if (!obj.isMesh) return;
        obj.geometry?.dispose();
        const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
        mats.forEach(mat => {
            if (!mat) return;
            mat.dispose();
        });
    });
    scene.remove(root);
}

function centerModel() {
    if (!model) return;
    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    model.position.sub(center);
    const size = box.getSize(new THREE.Vector3());
    const max = Math.max(size.x, size.y, size.z, 0.1);
    const distance = max * 2.5;
    camera.position.set(distance * 0.8, distance * 0.6, distance);
    controls.target.set(0, 0, 0);
    controls.update();
}

function selectObject(event) {
    if (!model) return;

    const rect = renderer.domElement.getBoundingClientRect();
    mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);

    // In crack mode, existing cracks can be grabbed and moved.
    if (crackMode) {
        const crackHits = raycaster.intersectObjects([...crackItems], true);
        if (crackHits.length) {
            const crack = crackHits[0].object.userData.crackRoot || crackHits[0].object;
            beginCrackDrag(crack, event);
            return;
        }

        const hits = raycaster.intersectObject(model, true);
        if (!hits.length) return;

        const hit = hits[0];
        if (hit.object.isMesh) {
            selectedMesh = hit.object;
            selectedMaterialIndex = hit.face?.materialIndex ?? 0;
            updateSelectionUI();
            createCrackAtHit(hit);
        }
        return;
    }

    const hits = raycaster.intersectObject(model, true);
    if (!hits.length) return;

    const hit = hits[0];
    if (hit.object.isMesh) {
        selectedMesh = hit.object;
        selectedMaterialIndex = hit.face?.materialIndex ?? 0;
        updateSelectionUI();
    }
}

function toggleCrackMode() {
    crackMode = !crackMode;
    const btn = document.getElementById("crackMode");
    const head = document.getElementById("crackLibraryHead");
    const categories = document.getElementById("crackCategories");
    const search = document.getElementById("searchBox");

    btn.classList.toggle("active", crackMode);
    renderer.domElement.style.cursor = crackMode ? "crosshair" : "default";

    if (crackMode) {
        head.hidden = false;
        categories.hidden = false;
        search.placeholder = "Search cracks...";
        textureList.classList.add("crack-library-active");
        renderCrackLibrary();
        showCrackInspector(activeCrack);
    } else {
        head.hidden = true;
        categories.hidden = true;
        search.placeholder = "Search wood, stone, metal...";
        textureList.classList.remove("crack-library-active");
        renderLibrary();
        activeCrack = null;
        crackDrag = null;
        showCrackInspector(null);
        controls.enabled = true;
    }
}

function renderCrackLibrary() {
    if (!crackMode) return;
    const list = document.getElementById("textureList");
    list.classList.remove("library-virtual");
    list.classList.add("crack-library-active");
    list.innerHTML = "";

    const query = document.getElementById("searchBox").value.toLowerCase().trim();
    const items = crackPresets.filter(p => {
        const text = `${p.name} ${p.category} ${p.desc}`.toLowerCase();
        const matchesSearch = !query || text.includes(query);
        const matchesCategory = selectedCrackCategory === "all" || p.category === selectedCrackCategory;
        return matchesSearch && matchesCategory;
    });

    const frag = document.createDocumentFragment();
    for (const preset of items) {
        const card = document.createElement("div");
        card.className = "crackPresetCard" + (preset.id === selectedCrackPreset ? " active" : "");
        const img = document.createElement("img");
        img.src = getCrackPreviewURL(preset);
        img.alt = preset.name;
        img.loading = "lazy";
        img.decoding = "async";

        const meta = document.createElement("div");
        meta.className = "crackPresetMeta";
        const title = document.createElement("strong");
        title.textContent = preset.name;
        const desc = document.createElement("small");
        desc.textContent = preset.desc;
        meta.append(title, desc);
        card.append(img, meta);

        card.onclick = () => {
            selectedCrackPreset = preset.id;
            renderCrackLibrary();
        };
        frag.appendChild(card);
    }

    if (!items.length) {
        list.innerHTML = '<div class="empty" style="grid-column:1/-1">No crack found</div>';
        return;
    }
    list.appendChild(frag);
    const count = document.getElementById("crackCount");
    if (count) count.textContent = `${items.length}/${crackPresets.length}`;
}

function getCrackPreviewURL(preset) {
    if (crackPreviewCache.has(preset.id)) return crackPreviewCache.get(preset.id);
    const url = makeCrackPreview(preset).toDataURL("image/png");
    crackPreviewCache.set(preset.id, url);
    return url;
}

function makeCrackPreview(preset) {
    return makeCrackCanvas(220, 220, preset, true);
}

function makeCrackCanvas(width, height, preset, preview=false) {
    const canvas = document.createElement("canvas");
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, width, height);

    const cx = width * 0.5;
    const cy = height * 0.5;
    const rng = mulberry32(preset.seed || 1);

    const drawPath = (points, baseWidth, glow=false) => {
        if (glow) {
            ctx.save();
            ctx.globalCompositeOperation = "lighter";
            ctx.strokeStyle = preset.glowColor || "rgba(255,90,15,.35)";
            ctx.lineWidth = baseWidth * 3.2;
            ctx.shadowBlur = baseWidth * 3.4;
            ctx.shadowColor = preset.glowColor || "rgba(255,78,0,.75)";
            trace(points);
            ctx.restore();
        }

        ctx.save();
        ctx.strokeStyle = preset.color;
        ctx.lineWidth = baseWidth;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        trace(points);
        ctx.restore();
    };

    const trace = (points) => {
        ctx.beginPath();
        ctx.moveTo(points[0][0], points[0][1]);
        for (let i = 1; i < points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
        ctx.stroke();
    };

    const branch = (angle, length, turns=4, width=4, offset=0) => {
        const pts = [[cx, cy]];
        let x = cx, y = cy;
        for (let i = 1; i <= turns; i++) {
            const t = i / turns;
            const a = angle + Math.sin(i * 2.2 + preset.seed) * 0.18;
            const step = length / turns;
            x += Math.cos(a) * step;
            y += Math.sin(a) * step;
            pts.push([x + offset * (rng() - .5), y + offset * (rng() - .5)]);
        }
        drawPath(pts, width * (1 - tScaleNoise(rng)), preset.glow);
        return pts;
    };

    const branches = [];
    const isSpider = preset.id.includes("spider") || preset.id === "web-01";
    const isImpact = preset.category === "impact" || preset.id.includes("impact");
    const isFine = preset.id.includes("fine") || preset.category === "glass";
    const count = isSpider ? 11 : isImpact ? 13 : isFine ? 9 : 8;
    const lenBase = Math.min(width, height) * ((preset.id.includes("deep") || preset.id.includes("lava-deep")) ? .46 : .38) * preset.scale;

    if (isImpact) {
        ctx.save();
        ctx.fillStyle = preset.color;
        ctx.beginPath(); ctx.arc(cx, cy, width * .055, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
    }

    for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i / count) + (rng() - .5) * .35;
        const length = lenBase * (.72 + rng() * .55);
        const widthBase = preset.id === "thin" || preset.id === "glass" ? width * .013 : width * .022;
        const pts = branch(angle, length, isSpider ? 5 : 4 + Math.floor(rng() * 2), widthBase, width * .022);
        branches.push({pts, angle});

        if (preset.id !== "impact" || i % 2 === 0) {
            const leafCount = isSpider ? 2 : 1;
            for (let j = 1; j <= leafCount; j++) {
                const idx = Math.max(1, Math.floor((pts.length - 1) * (0.35 + rng() * .45)));
                const p = pts[idx];
                const side = rng() > .5 ? 1 : -1;
                const a = angle + side * (Math.PI * .42 + (rng() - .5) * .25);
                const l = width * (.09 + rng() * .13);
                const sub = [[p[0], p[1]], [p[0] + Math.cos(a)*l*.55, p[1] + Math.sin(a)*l*.55], [p[0] + Math.cos(a)*l, p[1] + Math.sin(a)*l]];
                drawPath(sub, widthBase * .62, preset.glow);
            }
        }
    }

    if (preset.id === "deep" || preset.id === "stone") {
        ctx.save();
        ctx.globalAlpha = .28;
        ctx.strokeStyle = "rgba(255,255,255,.16)";
        ctx.lineWidth = width * .006;
        ctx.lineCap = "round";
        for (const b of branches) {
            const p = b.pts.map(([x,y]) => [x+1.2, y+1.2]);
            trace(p);
        }
        ctx.restore();
    }

    if (preview) {
        const grad = ctx.createRadialGradient(cx,cy,0,cx,cy,width*.52);
        grad.addColorStop(0,"rgba(255,255,255,.03)");
        grad.addColorStop(1,"rgba(0,0,0,0)");
        ctx.fillStyle = grad;
        ctx.fillRect(0,0,width,height);
    }

    return canvas;
}

function tScaleNoise(v) {
    return v * .22;
}

function mulberry32(a) {
    return function() {
        let t = a += 0x6D2B79F5;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
}

function getCrackPreset() {
    return crackPresets.find(p => p.id === selectedCrackPreset) || crackPresets[0];
}

function makeCrackTexture(preset = getCrackPreset()) {
    if (crackTextureCache.has(preset.id)) {
        const cached = crackTextureCache.get(preset.id);
        cached.needsUpdate = true;
        return cached;
    }

    const canvas = makeCrackCanvas(512, 512, preset, false);
    const tex = new THREE.CanvasTexture(canvas);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.wrapS = THREE.ClampToEdgeWrapping;
    tex.wrapT = THREE.ClampToEdgeWrapping;
    tex.anisotropy = Math.min(renderer.capabilities.getMaxAnisotropy(), 4);
    tex.minFilter = THREE.LinearMipmapLinearFilter;
    tex.magFilter = THREE.LinearFilter;
    tex.generateMipmaps = true;
    crackTextureCache.set(preset.id, tex);
    return tex;
}

function createCrackAtHit(hit) {
    const crack = new THREE.Group();
    const worldNormal = getHitWorldNormal(hit);
    const preset = getCrackPreset();

    crack.name = preset.name;
    crack.userData.crackRoot = crack;
    crack.userData.meshUuid = hit.object.uuid;
    crack.userData.normal = worldNormal.clone();
    crack.userData.point = hit.point.clone();
    crack.userData.presetId = preset.id;
    crack.userData.baseSize = 0.42 * preset.scale;
    crack.userData.size = 1;
    crack.userData.opacity = 0.94;
    crack.userData.spin = 0;
    crack.userData.material = new THREE.MeshBasicMaterial({
        map: makeCrackTexture(preset),
        transparent: true,
        opacity: crack.userData.opacity,
        alphaTest: 0.04,
        depthWrite: false,
        depthTest: true,
        polygonOffset: true,
        polygonOffsetFactor: -1.5,
        polygonOffsetUnits: -1.5,
        side: THREE.DoubleSide,
        toneMapped: false
    });

    scene.add(crack);
    crackItems.add(crack);
    activeCrack = crack;
    rebuildCrackDecal(crack, hit.object, hit.point, worldNormal);
    showCrackInspector(crack);
}

function getCrackEuler(normal, spinDeg = 0) {
    const n = normal.clone().normalize();
    const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 0, 1), n);
    const spinQ = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), THREE.MathUtils.degToRad(spinDeg));
    q.multiply(spinQ);
    return new THREE.Euler().setFromQuaternion(q, "XYZ");
}

function rebuildCrackDecal(crack, mesh, point, normal) {
    if (!crack || !mesh || !mesh.isMesh) return;

    const size = Math.max(0.06, (crack.userData.baseSize || 0.42) * (crack.userData.size || 1));
    const orientation = getCrackEuler(normal, crack.userData.spin || 0);
    const decalSize = new THREE.Vector3(size, size, size * 0.32);

    let child = crack.userData.decalMesh;
    const geometry = new DecalGeometry(mesh, point, orientation, decalSize);

    if (!child) {
        child = new THREE.Mesh(geometry, crack.userData.material);
        child.userData.crackRoot = crack;
        crack.add(child);
        crack.userData.decalMesh = child;
    } else {
        child.geometry.dispose();
        child.geometry = geometry;
    }

    child.userData.crackRoot = crack;
    child.material.opacity = crack.userData.opacity ?? 0.94;
    crack.position.set(0, 0, 0);
    crack.rotation.set(0, 0, 0);
    crack.scale.set(1, 1, 1);
    crack.userData.point = point.clone();
    crack.userData.normal = normal.clone().normalize();
    crack.userData.meshUuid = mesh.uuid;
}

function applyCrackTransform(crack, normal) {
    if (!crack) return;
    const n = (normal || crack.userData.normal || new THREE.Vector3(0,1,0)).clone().normalize();
    crack.userData.normal = n;

    const mesh = model ? findMeshByUuid(crack.userData.meshUuid) : null;
    if (mesh && crack.userData.point) {
        rebuildCrackDecal(crack, mesh, crack.userData.point, n);
    }
}

function findMeshByUuid(uuid) {
    if (!model || !uuid) return null;
    let found = null;
    model.traverse(obj => {
        if (!found && obj.isMesh && obj.uuid === uuid) found = obj;
    });
    return found;
}

function getHitWorldNormal(hit) {
    const localNormal = hit.face?.normal ? hit.face.normal.clone() : new THREE.Vector3(0, 1, 0);
    const normalMatrix = new THREE.Matrix3().getNormalMatrix(hit.object.matrixWorld);
    return localNormal.applyMatrix3(normalMatrix).normalize();
}

function orientCrackToNormal(crack, normal) {
    applyCrackTransform(crack, normal);
}

function beginCrackDrag(crack, event) {
    if (!crack || !model) return;
    activeCrack = crack;
    showCrackInspector(crack);
    crackDrag = { crack, pointerId: event.pointerId };
    renderer.domElement.setPointerCapture?.(event.pointerId);
    controls.enabled = false;
}

function moveCrack(event) {
    if (!crackDrag) return;

    const rect = renderer.domElement.getBoundingClientRect();
    mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);

    const hits = raycaster.intersectObject(model, true);
    if (!hits.length) return;

    const hit = hits[0];
    if (!hit.object.isMesh) return;

    const crack = crackDrag.crack;
    const worldNormal = getHitWorldNormal(hit);
    crack.userData.meshUuid = hit.object.uuid;
    crack.userData.point = hit.point.clone();
    crack.userData.normal = worldNormal.clone();
    rebuildCrackDecal(crack, hit.object, hit.point, worldNormal);
}

function endCrackDrag() {
    if (!crackDrag) return;
    const pointerId = crackDrag.pointerId;
    crackDrag = null;
    controls.enabled = true;
    if (pointerId != null) {
        try { renderer.domElement.releasePointerCapture(pointerId); } catch (_) {}
    }
}

window.addEventListener("keydown", event => {
    if (event.key === "Delete" && activeCrack) {
        deleteActiveCrack();
        return;
    }
    if (!crackMode || !activeCrack) return;
    if (event.key.toLowerCase() === "q") rotateActiveCrack(-10);
    if (event.key.toLowerCase() === "e") rotateActiveCrack(10);
});

function bindCrackControls() {
    const opacity = document.getElementById("crackOpacity");
    const size = document.getElementById("crackSize");
    const rotation = document.getElementById("crackRotation");
    opacity.oninput = () => {
        if (!activeCrack) return;
        activeCrack.userData.opacity = Number(opacity.value);
        activeCrack.traverse(obj => { if (obj.isMesh && obj.material) obj.material.opacity = activeCrack.userData.opacity; });
        document.getElementById("crackOpacityValue").textContent = Number(opacity.value).toFixed(2);
    };
    size.oninput = () => {
        if (!activeCrack) return;
        activeCrack.userData.size = Number(size.value);
        applyCrackTransform(activeCrack);
        document.getElementById("crackSizeValue").textContent = Number(size.value).toFixed(2);
    };
    rotation.oninput = () => {
        if (!activeCrack) return;
        activeCrack.userData.spin = Number(rotation.value);
        applyCrackTransform(activeCrack);
        document.getElementById("crackRotationValue").textContent = rotation.value + "°";
    };
    document.getElementById("crackRotateLeft").onclick = () => rotateActiveCrack(-15);
    document.getElementById("crackRotateRight").onclick = () => rotateActiveCrack(15);
    document.getElementById("removeCrack").onclick = () => deleteActiveCrack();
}

function rotateActiveCrack(delta) {
    if (!activeCrack) return;
    activeCrack.userData.spin = THREE.MathUtils.clamp((activeCrack.userData.spin || 0) + delta, -180, 180);
    document.getElementById("crackRotation").value = activeCrack.userData.spin;
    document.getElementById("crackRotationValue").textContent = activeCrack.userData.spin + "°";
    applyCrackTransform(activeCrack);
}

function showCrackInspector(crack) {
    const panel = document.getElementById("crackInspector");
    if (!panel) return;
    panel.hidden = !crackMode || !crack;
    if (!crack) return;
    const preset = crackPresets.find(p => p.id === crack.userData.presetId);
    document.getElementById("crackPresetName").textContent = preset?.name || "CRACK";
    document.getElementById("crackOpacity").value = crack.userData.opacity ?? .9;
    document.getElementById("crackOpacityValue").textContent = Number(crack.userData.opacity ?? .9).toFixed(2);
    document.getElementById("crackSize").value = crack.userData.size ?? 1;
    document.getElementById("crackSizeValue").textContent = Number(crack.userData.size ?? 1).toFixed(2);
    document.getElementById("crackRotation").value = crack.userData.spin ?? 0;
    document.getElementById("crackRotationValue").textContent = (crack.userData.spin ?? 0) + "°";
}

function deleteActiveCrack() {
    if (!activeCrack) return;
    const crack = activeCrack;
    crackItems.delete(crack);
    crack.traverse(obj => {
        obj.geometry?.dispose();
        if (obj.material) obj.material.dispose();
    });
    scene.remove(crack);
    activeCrack = null;
    crackDrag = null;
    showCrackInspector(null);
}

function updateSelectionUI() {
    if (!selectedMesh) return;
    document.getElementById("selectedName").textContent = selectedMesh.name || "MESH";
    document.getElementById("selectionInfo").textContent = selectedMesh.name || "Selected mesh";

    const m = getSelectedMaterial();
    if (!m) return;

    document.getElementById("roughness").value = m.roughness ?? 0.5;
    document.getElementById("roughnessValue").textContent = Number(m.roughness ?? 0.5).toFixed(2);
    document.getElementById("metallic").value = m.metalness ?? 0;
    document.getElementById("metallicValue").textContent = Number(m.metalness ?? 0).toFixed(2);

    if (m.color) {
        const hex = "#" + m.color.getHexString();
        document.getElementById("baseColor").value = hex;
        document.getElementById("baseColorValue").textContent = hex;
    }

    if (m.map) {
        document.getElementById("scale").value = m.map.repeat.x;
        document.getElementById("scaleValue").textContent = Number(m.map.repeat.x).toFixed(2);
        const degrees = Math.round(THREE.MathUtils.radToDeg(m.map.rotation));
        document.getElementById("rotation").value = degrees;
        document.getElementById("rotationValue").textContent = degrees + "°";
        document.getElementById("offsetX").value = m.map.offset.x;
        document.getElementById("offsetY").value = m.map.offset.y;
        document.getElementById("offsetXValue").textContent = Number(m.map.offset.x).toFixed(2);
        document.getElementById("offsetYValue").textContent = Number(m.map.offset.y).toFixed(2);
    }
}

function bindMaterialControls() {
    const scale = document.getElementById("scale");
    const rotation = document.getElementById("rotation");
    const offsetX = document.getElementById("offsetX");
    const offsetY = document.getElementById("offsetY");
    const roughness = document.getElementById("roughness");
    const metallic = document.getElementById("metallic");
    const baseColor = document.getElementById("baseColor");

    scale.oninput = () => {
        document.getElementById("scaleValue").textContent = Number(scale.value).toFixed(2);
        applyUV();
    };
    rotation.oninput = () => {
        document.getElementById("rotationValue").textContent = rotation.value + "°";
        applyUV();
    };
    offsetX.oninput = () => {
        document.getElementById("offsetXValue").textContent = offsetX.value;
        applyUV();
    };
    offsetY.oninput = () => {
        document.getElementById("offsetYValue").textContent = offsetY.value;
        applyUV();
    };
    roughness.oninput = () => {
        const m = getSelectedMaterial();
        if (!m) return;
        m.roughness = Number(roughness.value);
        document.getElementById("roughnessValue").textContent = Number(roughness.value).toFixed(2);
    };
    metallic.oninput = () => {
        const m = getSelectedMaterial();
        if (!m) return;
        m.metalness = Number(metallic.value);
        document.getElementById("metallicValue").textContent = Number(metallic.value).toFixed(2);
    };
    baseColor.oninput = event => {
        const m = getSelectedMaterial();
        if (!m) return;
        m.color.set(event.target.value);
        document.getElementById("baseColorValue").textContent = event.target.value;
    };
}

function applyUVToMaterial(mat) {
    if (!mat) return;
    const maps = [mat.map, mat.normalMap, mat.roughnessMap, mat.metalnessMap, mat.aoMap];
    const scale = Number(document.getElementById("scale").value);
    const rotation = Number(document.getElementById("rotation").value) * Math.PI / 180;
    const x = Number(document.getElementById("offsetX").value);
    const y = Number(document.getElementById("offsetY").value);

    maps.forEach(tex => {
        if (!tex) return;
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(scale, scale);
        tex.rotation = rotation;
        tex.offset.set(x, y);
    });
}

function applyUV() {
    applyUVToMaterial(getSelectedMaterial());
}

async function uploadTexture(event) {
    const file = event.target.files[0];
    event.target.value = "";
    if (!file) return;
    if (!selectedMesh) {
        alert("Hãy chọn mesh trước.");
        return;
    }

    try {
        const texture = await loadLocalTextureFast(file);
        saveHistory();
        const material = ensureEditableMaterial(selectedMesh);
        material.map = texture;
        material.needsUpdate = true;
        applyUVToMaterial(material);
        updateSelectionUI();
    } catch (error) {
        console.error(error);
        alert("Không thể đọc texture.");
    }
}

function loadLocalTextureFast(file) {
    return new Promise((resolve, reject) => {
        const objectURL = URL.createObjectURL(file);
        const img = new Image();

        img.onload = () => {
            try {
                const scale = Math.min(1, MAX_LOCAL_TEXTURE_SIZE / Math.max(img.width, img.height));
                const width = Math.max(1, Math.round(img.width * scale));
                const height = Math.max(1, Math.round(img.height * scale));
                const canvas = document.createElement("canvas");
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext("2d", { alpha: true });
                ctx.drawImage(img, 0, 0, width, height);

                const texture = new THREE.CanvasTexture(canvas);
                prepareTexture(texture, THREE.SRGBColorSpace);
                URL.revokeObjectURL(objectURL);
                resolve(texture);
            } catch (error) {
                URL.revokeObjectURL(objectURL);
                reject(error);
            }
        };
        img.onerror = () => {
            URL.revokeObjectURL(objectURL);
            reject(new Error("Image decode failed"));
        };
        img.decoding = "async";
        img.src = objectURL;
    });
}

function ensureUV2(mesh) {
    const uv = mesh?.geometry?.attributes?.uv;
    if (uv && !mesh.geometry.attributes.uv2) {
        mesh.geometry.setAttribute("uv2", uv);
    }
}

function removeTexture() {
    const material = getSelectedMaterial();
    if (!material) return;

    saveHistory();
    ++textureApplyToken;

    const oldTextures = [
        material.map,
        material.normalMap,
        material.roughnessMap,
        material.metalnessMap,
        material.aoMap
    ].filter(Boolean);

    material.map = null;
    material.normalMap = null;
    material.roughnessMap = null;
    material.metalnessMap = null;
    material.aoMap = null;
    material.needsUpdate = true;

    oldTextures.forEach(releaseTextureIfUnused);
    updateSelectionUI();
}

function releaseTextureIfUnused(texture) {
    if (!texture) return;

    let used = false;
    if (model) {
        model.traverse(obj => {
            if (used || !obj.isMesh) return;
            const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
            mats.forEach(mat => {
                if (!mat || used) return;
                if (
                    mat.map === texture ||
                    mat.normalMap === texture ||
                    mat.roughnessMap === texture ||
                    mat.metalnessMap === texture ||
                    mat.aoMap === texture
                ) used = true;
            });
        });
    }
    if (used) return;

    for (const [key, cached] of textureCache.entries()) {
        if (cached === texture) textureCache.delete(key);
    }
    texture.dispose();
}

function resetMaterial() {
    if (!selectedMesh) return;
    saveHistory();
    ++textureApplyToken;

    if (Array.isArray(selectedMesh.material)) {
        selectedMesh.material = selectedMesh.material.map(() => new THREE.MeshStandardMaterial({
            color: 0xffffff,
            roughness: 0.5,
            metalness: 0
        }));
    } else {
        selectedMesh.material = new THREE.MeshStandardMaterial({
            color: 0xffffff,
            roughness: 0.5,
            metalness: 0
        });
    }
    selectedMesh.userData.textureStudioCloned = true;
    updateSelectionUI();
}

function addLayer() {
    const layer = document.createElement("div");
    layer.className = "layer";
    layer.innerHTML = '<span>●</span><span>New Layer</span><button>×</button>';
    layer.querySelector("button").onclick = () => layer.remove();
    document.getElementById("layers").appendChild(layer);
}

function toggleWire() {
    if (!model) return;
    wireframe = !wireframe;
    model.traverse(obj => {
        if (!obj.isMesh) return;
        const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
        mats.forEach(m => { if (m) m.wireframe = wireframe; });
    });
}


function focusModel() {
    if (model) centerModel();
}

function getModelParts() {
    if (!model) return [];
    const parts = [];
    model.traverse(obj => {
        if (!obj.isMesh) return;
        let depth = 0, p = obj.parent;
        while (p && p !== model) { depth++; p = p.parent; }
        parts.push({ object: obj, depth });
    });
    return parts;
}

function togglePartsPanel(force) {
    const panel = document.getElementById("partsPanel");
    const open = typeof force === "boolean" ? force : !panel.classList.contains("active");
    panel.classList.toggle("active", open);
    if (open) {
        renderPartsList();
        document.getElementById("partsSearch").focus();
    }
}

function renderPartsList() {
    const list = document.getElementById("partsList");
    if (!model) { list.innerHTML = '<div class="empty">Chưa có model</div>'; return; }
    const q = document.getElementById("partsSearch").value.toLowerCase().trim();
    const parts = getModelParts().filter(p => {
        const name = p.object.name || "Unnamed Mesh";
        return !q || name.toLowerCase().includes(q);
    });
    list.innerHTML = "";
    if (!parts.length) { list.innerHTML = '<div class="empty">Không tìm thấy part</div>'; return; }
    const frag = document.createDocumentFragment();
    parts.forEach((part, index) => {
        const obj = part.object;
        const row = document.createElement("button");
        row.type = "button";
        row.className = "partRow" + (selectedMesh === obj ? " active" : "");
        row.style.paddingLeft = (7 + Math.min(part.depth, 6) * 12) + "px";
        const icon = document.createElement("span"); icon.className="partIcon"; icon.textContent="◆";
        const name = document.createElement("span"); name.className="partName"; name.textContent=obj.name || `Mesh ${index+1}`;
        const meta = document.createElement("span"); meta.className="partMeta"; meta.textContent="MESH";
        row.append(icon,name,meta);
        row.onclick = () => {
            selectedMesh = obj;
            selectedMaterialIndex = 0;
            updateSelectionUI();
            renderPartsList();
        };
        frag.appendChild(row);
    });
    list.appendChild(frag);
}

function setProStatus(message) {
    const el = document.getElementById("proStatus");
    if (el) el.textContent = message;
}

function bindProTools() {
    document.getElementById("copyMaterialBtn").onclick = copyMaterial;
    document.getElementById("pasteMaterialBtn").onclick = pasteMaterial;
    document.getElementById("favoriteMaterialBtn").onclick = favoriteMaterial;
    document.getElementById("randomMaterialBtn").onclick = randomizeMaterial;
    document.getElementById("isolateBtn").onclick = isolateSelected;
    document.getElementById("showAllBtn").onclick = showAllParts;
    document.getElementById("hideSelectedBtn").onclick = hideSelectedPart;
    document.getElementById("duplicateMeshBtn").onclick = duplicateSelectedMesh;
    document.getElementById("focusSelectedBtn").onclick = focusSelectedPart;
    document.getElementById("statsBtn").onclick = toggleSceneStats;
    document.getElementById("applyFavoriteBtn").onclick = applyFavorite;
    loadFavorites();
}

function copyMaterial() {
    const m = getSelectedMaterial();
    if (!m) { setProStatus("Chưa chọn material."); return; }
    materialClipboard = m.clone();
    setProStatus("Đã copy material.");
}

function pasteMaterial() {
    if (!selectedMesh) { setProStatus("Hãy chọn mesh trước."); return; }
    if (!materialClipboard) { setProStatus("Clipboard material đang trống."); return; }
    saveHistory();
    const pasted = materialClipboard.clone();
    if (Array.isArray(selectedMesh.material)) selectedMesh.material[selectedMaterialIndex] = pasted;
    else selectedMesh.material = pasted;
    selectedMesh.userData.textureStudioCloned = true;
    updateSelectionUI();
    setProStatus("Đã paste material vào part đang chọn.");
}

function favoriteMaterial() {
    const m = getSelectedMaterial();
    if (!m) { setProStatus("Chưa chọn material."); return; }
    const snap = {
        id: "fav-" + Date.now(),
        name: `${selectedMesh?.name || "Material"} — ${new Date().toLocaleTimeString()}`,
        color: m.color?.getHexString?.() || "ffffff",
        roughness: m.roughness ?? .5,
        metalness: m.metalness ?? 0,
        map: m.map || null,
        repeat: m.map ? [m.map.repeat.x, m.map.repeat.y] : [1,1],
        rotation: m.map?.rotation || 0,
        offset: m.map ? [m.map.offset.x, m.map.offset.y] : [0,0]
    };
    favoriteMaterials.unshift(snap);
    favoriteMaterials = favoriteMaterials.slice(0, 12);
    try {
        localStorage.setItem("textureStudio_favorite_names_v1", JSON.stringify(
            favoriteMaterials.map(x => ({id:x.id,name:x.name,color:x.color,roughness:x.roughness,metalness:x.metalness}))
        ));
    } catch (_) {}
    refreshFavoriteSelect();
    document.getElementById("favoriteSelect").value = snap.id;
    setProStatus("★ Đã lưu Favorite trong phiên làm việc.");
}

function refreshFavoriteSelect() {
    const select = document.getElementById("favoriteSelect");
    if (!select) return;
    const current = select.value;
    select.innerHTML = "";
    if (!favoriteMaterials.length) {
        select.innerHTML = '<option value="">No favorite saved</option>';
        return;
    }
    favoriteMaterials.forEach((fav, i) => {
        const opt = document.createElement("option");
        opt.value = fav.id;
        opt.textContent = `${i+1}. ${fav.name}`;
        select.appendChild(opt);
    });
    if (favoriteMaterials.some(x => x.id === current)) select.value = current;
}

function loadFavorites() {
    // Restore lightweight favorites only; texture objects stay session-local for performance.
    try {
        const raw = JSON.parse(localStorage.getItem("textureStudio_favorite_names_v1") || "[]");
        favoriteMaterials = raw.map(x => ({...x,map:null,repeat:[1,1],rotation:0,offset:[0,0]}));
    } catch (_) { favoriteMaterials = []; }
    refreshFavoriteSelect();
}

function applyFavorite() {
    if (!selectedMesh) { setProStatus("Hãy chọn mesh trước."); return; }
    const id = document.getElementById("favoriteSelect").value;
    const fav = favoriteMaterials.find(x => x.id === id);
    if (!fav) { setProStatus("Chưa có Favorite."); return; }
    saveHistory();
    const m = ensureEditableMaterial(selectedMesh);
    if (m.color) m.color.set(fav.color || "ffffff");
    m.roughness = Number(fav.roughness ?? .5);
    m.metalness = Number(fav.metalness ?? 0);
    if (fav.map) {
        m.map = fav.map;
        m.map.wrapS = THREE.RepeatWrapping; m.map.wrapT = THREE.RepeatWrapping;
        m.map.repeat.set(fav.repeat?.[0] ?? 1, fav.repeat?.[1] ?? 1);
        m.map.rotation = fav.rotation ?? 0;
        m.map.offset.set(fav.offset?.[0] ?? 0, fav.offset?.[1] ?? 0);
    }
    m.needsUpdate = true;
    updateSelectionUI();
    setProStatus("Đã áp Favorite.");
}

function randomizeMaterial() {
    const m = getSelectedMaterial();
    if (!m) { setProStatus("Hãy chọn mesh trước."); return; }
    saveHistory();
    m.color.setHSL(Math.random(), .35 + Math.random()*.55, .35 + Math.random()*.35);
    m.roughness = Math.random();
    m.metalness = Math.random() > .55 ? .75 + Math.random()*.25 : Math.random()*.18;
    m.needsUpdate = true;
    updateSelectionUI();
    setProStatus("✦ Đã tạo biến thể material.");
}

function isolateSelected() {
    if (!model || !selectedMesh) { setProStatus("Hãy chọn mesh trước."); return; }
    model.traverse(obj => { if (obj.isMesh) obj.visible = obj === selectedMesh; });
    isolationActive = true;
    setProStatus("◎ Isolate bật — Show All để khôi phục.");
}

function showAllParts() {
    if (!model) return;
    model.traverse(obj => { if (obj.isMesh) obj.visible = true; });
    isolationActive = false;
    setProStatus("◉ Đã hiện lại toàn bộ part.");
}

function hideSelectedPart() {
    if (!selectedMesh) { setProStatus("Hãy chọn mesh trước."); return; }
    selectedMesh.visible = false;
    setProStatus("◌ Đã ẩn part đang chọn.");
}

function duplicateSelectedMesh() {
    if (!selectedMesh) { setProStatus("Hãy chọn mesh trước."); return; }
    const clone = selectedMesh.clone(true);
    clone.position.x += .15;
    clone.userData = {...selectedMesh.userData, duplicateOf:selectedMesh.uuid, textureStudioCloned:true};
    if (Array.isArray(clone.material)) clone.material = clone.material.map(m => m?.clone ? m.clone() : m);
    else if (clone.material?.clone) clone.material = clone.material.clone();
    clone.name = `${selectedMesh.name || "Mesh"}_Copy`;
    (selectedMesh.parent || model).add(clone);
    selectedMesh = clone;
    selectedMaterialIndex = 0;
    updateSelectionUI();
    renderPartsList();
    setProStatus("＋ Đã duplicate part.");
}

function focusSelectedPart() {
    if (!selectedMesh) { setProStatus("Hãy chọn mesh trước."); return; }
    const box = new THREE.Box3().setFromObject(selectedMesh);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    const distance = Math.max(size.x,size.y,size.z,.1) * 2.8;
    camera.position.copy(center).add(new THREE.Vector3(distance*.8,distance*.55,distance));
    controls.target.copy(center);
    controls.update();
    setProStatus("⌖ Đã focus vào part.");
}

function toggleSceneStats() {
    statsVisible = !statsVisible;
    const el = document.getElementById("sceneStats");
    if (!el) return;
    el.hidden = !statsVisible;
    if (statsVisible) updateSceneStats();
    setProStatus(statsVisible ? "▤ Scene Stats đang bật." : "Scene Stats đã tắt.");
}

function updateSceneStats() {
    const el = document.getElementById("sceneStats");
    if (!el || !model) return;
    let meshes=0, triangles=0, materials=0, textures=0;
    const seen = new Set();
    model.traverse(obj => {
        if (!obj.isMesh) return;
        meshes++;
        triangles += obj.geometry?.index ? obj.geometry.index.count/3 : (obj.geometry?.attributes?.position?.count || 0)/3;
        const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
        materials += mats.length;
        mats.forEach(m => [m?.map,m?.normalMap,m?.roughnessMap,m?.metalnessMap,m?.aoMap].forEach(t => { if(t&&!seen.has(t)){seen.add(t);textures++;} }));
    });
    const calls = renderer?.info?.render?.calls ?? 0;
    el.innerHTML = `<strong>SCENE STATS</strong><br>Meshes: ${meshes}<br>Triangles: ${Math.round(triangles).toLocaleString()}<br>Materials: ${materials}<br>Unique textures: ${textures}<br>Draw calls: ${calls}`;
}

function saveHistory() {
    const material = getSelectedMaterial();
    if (!selectedMesh || !material) return;

    history = history.slice(0, historyIndex + 1);
    history.push({
        mesh: selectedMesh.uuid,
        material: material.clone(),
        materialIndex: selectedMaterialIndex
    });
    historyIndex = history.length - 1;

    if (history.length > 30) {
        history.shift();
        historyIndex--;
    }
}

function undo() {
    if (historyIndex < 0) return;
    restoreHistory(history[historyIndex]);
    historyIndex--;
}

function redo() {
    if (historyIndex >= history.length - 1) return;
    historyIndex++;
    restoreHistory(history[historyIndex]);
}

function restoreHistory(state) {
    if (!model) return;
    let mesh = null;
    model.traverse(obj => {
        if (obj.uuid === state.mesh) mesh = obj;
    });
    if (!mesh) return;

    selectedMaterialIndex = state.materialIndex ?? 0;
    if (Array.isArray(mesh.material)) {
        mesh.material[selectedMaterialIndex] = state.material.clone();
    } else {
        mesh.material = state.material.clone();
    }
    selectedMesh = mesh;
    ++textureApplyToken;
    updateSelectionUI();
}

function saveProject() {
    const project = {
        version: 2,
        modelName: document.getElementById("modelName").textContent,
        selected: selectedMesh?.name || null,
        materials: [],
        cracks: []
    };

    if (model) {
        model.traverse(obj => {
            if (!obj.isMesh) return;
            const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
            mats.forEach((m, index) => project.materials.push({
                name: obj.name,
                materialIndex: index,
                color: m.color ? m.color.getHexString() : "ffffff",
                roughness: m.roughness ?? 0.5,
                metallic: m.metalness ?? 0,
                hasBaseTexture: !!m.map,
                hasNormal: !!m.normalMap,
                hasRoughness: !!m.roughnessMap,
                hasMetallic: !!m.metalnessMap,
                hasAO: !!m.aoMap
            }));
        });
    }

    for (const crack of crackItems) {
        project.cracks.push({
            presetId: crack.userData.presetId,
            meshUuid: crack.userData.meshUuid,
            size: crack.userData.size ?? 1,
            opacity: crack.userData.opacity ?? .9,
            rotation: crack.userData.spin ?? 0,
            position: [crack.position.x, crack.position.y, crack.position.z]
        });
    }

    downloadBlob(
        new Blob([JSON.stringify(project, null, 2)], { type: "application/json" }),
        "texture-project.json"
    );
}

function exportGLB() {
    if (!model) {
        alert("Chưa có model.");
        return;
    }

    new GLTFExporter().parse(
        model,
        result => downloadBlob(
            new Blob([result], { type: "model/gltf-binary" }),
            "textured-model.glb"
        ),
        error => {
            console.error(error);
            alert("Export thất bại.");
        },
        { binary: true }
    );
}

function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function debounce(fn, delay) {
    let timer = 0;
    return (...args) => {
        clearTimeout(timer);
        timer = setTimeout(() => fn(...args), delay);
    };
}


function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
    if (statsVisible) {
        const now = performance.now();
        if (now - lastStatsUpdate > 700) { lastStatsUpdate = now; updateSceneStats(); }
    }
}
</script>
