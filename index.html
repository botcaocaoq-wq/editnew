<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Viva Studio — Texture Designer</title>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  overflow:hidden;
  background:#111318;
  color:#e9e9ed;
  font-family:Inter,Arial,sans-serif;
}

#app{
  width:100vw;
  height:100vh;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:54px;
  display:flex;
  align-items:center;
  gap:14px;
  padding:0 16px;
  background:#191b21;
  border-bottom:1px solid #2c2f38;
}

.logo{
  font-size:18px;
  font-weight:800;
  color:white;
}

.logo span{
  color:#8c7cff;
}

button,
select,
input{
  font:inherit;
}

button{
  border:1px solid #363943;
  background:#242730;
  color:#eee;
  border-radius:7px;
  padding:8px 11px;
  cursor:pointer;
}

button:hover{
  background:#30333d;
}

.workspace{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:280px 1fr 285px;
}

.panel{
  background:#181a20;
  min-height:0;
  overflow:auto;
}

.left{
  border-right:1px solid #2c2f38;
}

.right{
  border-left:1px solid #2c2f38;
}

.panel-title{
  padding:15px;
  font-size:13px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.7px;
  border-bottom:1px solid #292c34;
}

.search{
  margin:12px;
}

.search input{
  width:100%;
  padding:10px;
  background:#101217;
  border:1px solid #333640;
  color:white;
  border-radius:7px;
  outline:none;
}

.categories{
  display:flex;
  gap:6px;
  padding:0 12px 12px;
  overflow-x:auto;
}

.category{
  white-space:nowrap;
  font-size:11px;
  padding:6px 9px;
}

.category.active{
  background:#6558d8;
  border-color:#7568ec;
}

.library{
  padding:0 12px 15px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.texture-card{
  background:#22252d;
  border:1px solid #333640;
  border-radius:8px;
  overflow:hidden;
  cursor:pointer;
}

.texture-card:hover{
  border-color:#8074ed;
  transform:translateY(-1px);
}

.texture-image{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  display:block;
  background:#30333b;
}

.texture-name{
  padding:7px;
  font-size:11px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.viewport{
  position:relative;
  min-width:0;
  min-height:0;
  background:#101116;
}

#canvas{
  width:100%;
  height:100%;
  display:block;
}

.viewport-info{
  position:absolute;
  top:12px;
  left:12px;
  background:#181a20dd;
  border:1px solid #343741;
  border-radius:7px;
  padding:8px 10px;
  font-size:11px;
  pointer-events:none;
}

.drop{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
  opacity:.35;
}

.drop-box{
  border:1px dashed #727683;
  border-radius:10px;
  padding:25px;
  text-align:center;
}

.section{
  padding:14px;
  border-bottom:1px solid #292c34;
}

.section h3{
  margin:0 0 12px;
  font-size:12px;
}

.field{
  margin:10px 0;
}

.field label{
  display:flex;
  justify-content:space-between;
  font-size:11px;
  color:#aeb1bb;
  margin-bottom:6px;
}

.field input[type="range"]{
  width:100%;
}

.field input[type="number"]{
  width:100%;
  background:#101217;
  color:white;
  border:1px solid #333640;
  border-radius:6px;
  padding:7px;
}

.upload{
  width:100%;
  margin-top:5px;
}

.mesh-list{
  max-height:260px;
  overflow:auto;
}

.mesh-item{
  width:100%;
  text-align:left;
  margin-bottom:5px;
  font-size:11px;
}

.mesh-item.selected{
  background:#5d51ce;
  border-color:#7669ed;
}

.status{
  position:absolute;
  bottom:12px;
  left:12px;
  background:#181a20dd;
  border:1px solid #343741;
  padding:7px 10px;
  border-radius:6px;
  font-size:11px;
}

.empty{
  color:#777b87;
  font-size:11px;
  padding:12px;
  line-height:1.5;
}

@media(max-width:900px){
  .workspace{
    grid-template-columns:220px 1fr;
  }

  .right{
    display:none;
  }
}
</style>
</head>

<body>
<div id="app">

  <div class="topbar">
    <div class="logo">Viva <span>Studio</span></div>

    <button id="loadModelBtn">📦 Load Model</button>
    <input id="modelInput" type="file" accept=".glb,.gltf" hidden>

    <button id="uploadTextureBtn">🖼 Upload Texture</button>
    <input id="textureInput" type="file" accept="image/*" hidden>

    <button id="resetBtn">Reset</button>
  </div>

  <div class="workspace">

    <!-- LIBRARY -->
    <aside class="panel left">

      <div class="panel-title">Texture Library</div>

      <div class="search">
        <input id="search" placeholder="Tìm texture...">
      </div>

      <div class="categories">
        <button class="category active" data-cat="all">All</button>
        <button class="category" data-cat="wood">Wood</button>
        <button class="category" data-cat="metal">Metal</button>
        <button class="category" data-cat="stone">Stone</button>
        <button class="category" data-cat="concrete">Concrete</button>
        <button class="category" data-cat="ground">Ground</button>
      </div>

      <div id="library" class="library"></div>

    </aside>

    <!-- VIEWPORT -->
    <main class="viewport">
      <canvas id="canvas"></canvas>

      <div class="viewport-info">
        🖱 Kéo = xoay &nbsp; • &nbsp;
        Wheel = zoom &nbsp; • &nbsp;
        Click mesh = chọn
      </div>

      <div class="drop">
        <div class="drop-box">
          <b>3D VIEWPORT</b><br>
          Load .GLB / .GLTF để bắt đầu
        </div>
      </div>

      <div id="status" class="status">
        Chưa có model
      </div>
    </main>

    <!-- PROPERTIES -->
    <aside class="panel right">

      <div class="panel-title">Properties</div>

      <div class="section">
        <h3>Selected Mesh</h3>
        <div id="selectedMesh" class="empty">
          Chưa chọn mesh
        </div>
      </div>

      <div class="section">
        <h3>Mesh List</h3>
        <div id="meshList" class="mesh-list">
          <div class="empty">Chưa có model</div>
        </div>
      </div>

      <div class="section">
        <h3>Material</h3>

        <div class="field">
          <label>
            Texture Scale
            <span id="scaleValue">1.00</span>
          </label>
          <input id="scale" type="range"
                 min="0.1" max="20" step="0.1" value="1">
        </div>

        <div class="field">
          <label>
            Roughness
            <span id="roughnessValue">0.50</span>
          </label>
          <input id="roughness" type="range"
                 min="0" max="1" step="0.01" value="0.5">
        </div>

        <div class="field">
          <label>
            Metalness
            <span id="metalnessValue">0.00</span>
          </label>
          <input id="metalness" type="range"
                 min="0" max="1" step="0.01" value="0">
        </div>

        <div class="field">
          <label>
            Normal Strength
            <span id="normalValue">1.00</span>
          </label>
          <input id="normal" type="range"
                 min="0" max="3" step="0.05" value="1">
        </div>

      </div>

    </aside>

  </div>
</div>

<script type="module">

import * as THREE from "three";

import { OrbitControls }
from "three/addons/controls/OrbitControls.js";

import { GLTFLoader }
from "three/addons/loaders/GLTFLoader.js";


/* =========================================================
   THREE
========================================================= */

const canvas = document.getElementById("canvas");

const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias:true
});

renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(canvas.clientWidth,canvas.clientHeight,false);
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x101116);

const camera = new THREE.PerspectiveCamera(
  45,
  canvas.clientWidth / canvas.clientHeight,
  0.01,
  1000
);

camera.position.set(3,2,5);

const controls = new OrbitControls(camera,canvas);

controls.enableDamping = true;

const hemi = new THREE.HemisphereLight(
  0xffffff,
  0x333333,
  2
);

scene.add(hemi);

const keyLight = new THREE.DirectionalLight(
  0xffffff,
  3
);

keyLight.position.set(5,8,5);

scene.add(keyLight);

const grid = new THREE.GridHelper(
  20,
  20,
  0x333640,
  0x22252d
);

scene.add(grid);


/* =========================================================
   MODEL
========================================================= */

let currentModel = null;
let selectedMesh = null;

const loader = new GLTFLoader();


function loadModel(file){

  const url = URL.createObjectURL(file);

  loader.load(
    url,

    gltf => {

      if(currentModel){
        scene.remove(currentModel);
      }

      currentModel = gltf.scene;

      scene.add(currentModel);

      buildMeshList();

      centerModel(currentModel);

      document.getElementById("status").textContent =
        "Model: " + file.name;

      URL.revokeObjectURL(url);
    },

    undefined,

    error => {
      console.error(error);
      alert("Không thể load model.");
    }
  );
}


function centerModel(model){

  const box = new THREE.Box3().setFromObject(model);

  const center = box.getCenter(new THREE.Vector3());

  const size = box.getSize(new THREE.Vector3());

  model.position.sub(center);

  const maxSize = Math.max(
    size.x,
    size.y,
    size.z
  );

  const distance = maxSize * 1.8;

  camera.position.set(
    distance,
    distance * .7,
    distance
  );

  controls.target.set(0,0,0);

  controls.update();
}


/* =========================================================
   MESH LIST
========================================================= */

const meshList = document.getElementById("meshList");

function buildMeshList(){

  meshList.innerHTML = "";

  if(!currentModel){
    meshList.innerHTML =
      '<div class="empty">Chưa có model</div>';
    return;
  }

  currentModel.traverse(obj => {

    if(!obj.isMesh) return;

    const button = document.createElement("button");

    button.className = "mesh-item";

    button.textContent =
      obj.name || "Mesh";

    button.onclick = () => selectMesh(obj);

    obj.userData.meshButton = button;

    meshList.appendChild(button);
  });
}


function selectMesh(mesh){

  selectedMesh = mesh;

  document
    .querySelectorAll(".mesh-item")
    .forEach(x =>
      x.classList.remove("selected")
    );

  if(mesh.userData.meshButton){
    mesh.userData.meshButton.classList.add("selected");
  }

  document.getElementById("selectedMesh").textContent =
    mesh.name || "Unnamed Mesh";

  readMaterialSettings();
}


/* =========================================================
   TEXTURE LIBRARY
=========================================================

   Đây là cấu trúc Library.

   Khi kết nối nguồn texture thật, chỉ cần thay URL
   trong danh sách này hoặc dùng API/backend để lấy
   danh sách texture động.
========================================================= */

const textures = [

  {
    name:"Wood Oak",
    category:"wood",
    url:"https://cdn.jsdelivr.net/gh/mrdoob/three.js@r180/examples/textures/hardwood2_diffuse.jpg"
  },

  {
    name:"Brick",
    category:"stone",
    url:"https://threejs.org/examples/textures/brick_diffuse.jpg"
  },

  {
    name:"Concrete",
    category:"concrete",
    url:"https://threejs.org/examples/textures/terrain/grasslight-big.jpg"
  },

  {
    name:"Metal",
    category:"metal",
    url:"https://threejs.org/examples/textures/metal.jpg"
  }

];


const library =
  document.getElementById("library");


let currentCategory = "all";


function renderLibrary(){

  library.innerHTML = "";

  const search =
    document.getElementById("search")
      .value
      .toLowerCase();

  textures
    .filter(texture => {

      const categoryOK =
        currentCategory === "all" ||
        texture.category === currentCategory;

      const searchOK =
        texture.name
          .toLowerCase()
          .includes(search);

      return categoryOK && searchOK;

    })
    .forEach(texture => {

      const card =
        document.createElement("div");

      card.className =
        "texture-card";

      card.innerHTML = `
        <img class="texture-image"
             src="${texture.url}"
             loading="lazy">

        <div class="texture-name">
          ${texture.name}
        </div>
      `;

      card.onclick =
        () => applyTexture(texture.url);

      library.appendChild(card);

    });
}


renderLibrary();


/* =========================================================
   APPLY TEXTURE
========================================================= */

const textureLoader =
  new THREE.TextureLoader();


function applyTexture(url){

  if(!selectedMesh){

    alert("Hãy chọn một mesh trước.");

    return;
  }

  textureLoader.load(

    url,

    texture => {

      texture.colorSpace =
        THREE.SRGBColorSpace;

      texture.wrapS =
        THREE.RepeatWrapping;

      texture.wrapT =
        THREE.RepeatWrapping;

      texture.repeat.set(
        Number(document.getElementById("scale").value),
        Number(document.getElementById("scale").value)
      );

      let material =
        selectedMesh.material;

      if(Array.isArray(material)){
        material = material[0];
      }

      if(!(material instanceof THREE.MeshStandardMaterial)){

        material =
          new THREE.MeshStandardMaterial();

        selectedMesh.material =
          material;
      }

      material.map = texture;

      material.needsUpdate = true;

      readMaterialSettings();

    },

    undefined,

    error => {
      console.error(error);
      alert("Không tải được texture.");
    }
  );
}


/* =========================================================
   UPLOAD CUSTOM TEXTURE
========================================================= */

document
  .getElementById("textureInput")
  .addEventListener("change",event => {

    const file =
      event.target.files[0];

    if(!file) return;

    const url =
      URL.createObjectURL(file);

    applyTexture(url);

  });


/* =========================================================
   MATERIAL SETTINGS
========================================================= */

const scale =
  document.getElementById("scale");

const roughness =
  document.getElementById("roughness");

const metalness =
  document.getElementById("metalness");

const normal =
  document.getElementById("normal");


function getMaterial(){

  if(!selectedMesh) return null;

  let material =
    selectedMesh.material;

  if(Array.isArray(material)){
    material = material[0];
  }

  return material;
}


function readMaterialSettings(){

  const material =
    getMaterial();

  if(!material) return;

  roughness.value =
    material.roughness ?? .5;

  metalness.value =
    material.metalness ?? 0;

  roughnessValue.textContent =
    Number(roughness.value).toFixed(2);

  metalnessValue.textContent =
    Number(metalness.value).toFixed(2);
}


function updateMaterial(){

  const material =
    getMaterial();

  if(!material) return;

  material.roughness =
    Number(roughness.value);

  material.metalness =
    Number(metalness.value);

  if(material.map){

    material.map.repeat.set(
      Number(scale.value),
      Number(scale.value)
    );

  }

  material.needsUpdate = true;

  scaleValue.textContent =
    Number(scale.value).toFixed(2);

  roughnessValue.textContent =
    Number(roughness.value).toFixed(2);

  metalnessValue.textContent =
    Number(metalness.value).toFixed(2);

  normalValue.textContent =
    Number(normal.value).toFixed(2);
}


[
  scale,
  roughness,
  metalness,
  normal
].forEach(input => {

  input.addEventListener(
    "input",
    updateMaterial
  );

});


const scaleValue =
  document.getElementById("scaleValue");

const roughnessValue =
  document.getElementById("roughnessValue");

const metalnessValue =
  document.getElementById("metalnessValue");

const normalValue =
  document.getElementById("normalValue");


/* =========================================================
   UPLOAD MODEL
========================================================= */

document
  .getElementById("loadModelBtn")
  .onclick = () =>
    document
      .getElementById("modelInput")
      .click();


document
  .getElementById("modelInput")
  .addEventListener("change",event => {

    const file =
      event.target.files[0];

    if(file){
      loadModel(file);
    }

  });


document
  .getElementById("uploadTextureBtn")
  .onclick = () =>
    document
      .getElementById("textureInput")
      .click();


/* =========================================================
   SEARCH / CATEGORY
========================================================= */

document
  .getElementById("search")
  .addEventListener(
    "input",
    renderLibrary
  );


document
  .querySelectorAll(".category")
  .forEach(button => {

    button.onclick = () => {

      document
        .querySelectorAll(".category")
        .forEach(x =>
          x.classList.remove("active")
        );

      button.classList.add("active");

      currentCategory =
        button.dataset.cat;

      renderLibrary();

    };

  });


/* =========================================================
   CLICK MESH IN VIEWPORT
========================================================= */

const raycaster =
  new THREE.Raycaster();

const mouse =
  new THREE.Vector2();


canvas.addEventListener(
  "pointerdown",
  event => {

    const rect =
      canvas.getBoundingClientRect();

    mouse.x =
      ((event.clientX - rect.left) /
      rect.width) * 2 - 1;

    mouse.y =
      -((event.clientY - rect.top) /
      rect.height) * 2 + 1;

    raycaster.setFromCamera(
      mouse,
      camera
    );

    if(!currentModel) return;

    const hits =
      raycaster.intersectObject(
        currentModel,
        true
      );

    if(hits.length){

      selectMesh(hits[0].object);

    }

  }
);


/* =========================================================
   RESET
========================================================= */

document
  .getElementById("resetBtn")
  .onclick = () => {

    if(!selectedMesh) return;

    selectedMesh.material =
      selectedMesh.userData.originalMaterial ||
      selectedMesh.material;

    selectedMesh.material.needsUpdate = true;

  };


/* =========================================================
   RESIZE
========================================================= */

function resize(){

  const width =
    canvas.clientWidth;

  const height =
    canvas.clientHeight;

  camera.aspect =
    width / height;

  camera.updateProjectionMatrix();

  renderer.setSize(
    width,
    height,
    false
  );

}

window.addEventListener(
  "resize",
  resize
);

resize();


/* =========================================================
   LOOP
========================================================= */

function animate(){

  requestAnimationFrame(animate);

  controls.update();

  renderer.render(
    scene,
    camera
  );

}

animate();

</script>

</body>
</html>
