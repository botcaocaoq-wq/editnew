<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Texture Studio</title>
<link rel="stylesheet" href="styles.css">

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<header class="topbar">
    <div class="logo">TEXTURE<span>STUDIO</span></div>

    <div class="toolbar">
        <button id="uploadModel">＋ Model</button>
        <button id="uploadTexture">＋ Texture</button>
        <button id="decalMode">▣ Decal</button>
        <button id="paintMode">✎ Paint</button>
        <button id="autoUV">UV</button>
        <button id="undoBtn">↶</button>
        <button id="redoBtn">↷</button>
        <button id="saveProject">Save</button>
        <button id="exportGLB" class="primary">Export GLB</button>
    </div>

    <input id="modelInput" type="file" accept=".glb,.gltf,.bin" hidden>
    <input id="textureInput" type="file" accept="image/*" hidden>
</header>

<main class="layout">

    <!-- LEFT -->
    <aside class="panel library">
        <div class="panelTitle">
            <span>TEXTURE LIBRARY</span>
            <small>POLY HAVEN</small>
        </div>

        <input id="searchBox" class="search" placeholder="Search wood, stone, metal...">

        <div class="categories">
            <button data-cat="all" class="active">ALL</button>
            <button data-cat="wood">WOOD</button>
            <button data-cat="stone">STONE</button>
            <button data-cat="metal">METAL</button>
            <button data-cat="concrete">CONCRETE</button>
            <button data-cat="ground">GROUND</button>
        </div>

        <div id="textureList" class="textureList">
            <div class="loading">Loading Poly Haven...</div>
        </div>

        <div class="credit">
            Powered by
            <a href="https://polyhaven.com" target="_blank">Poly Haven</a>
        </div>
    </aside>


    <!-- VIEWPORT -->
    <section class="viewport">

        <div id="viewer"></div>

        <div class="viewerTop">
            <span id="modelName">No model</span>
            <span id="selectionInfo">Nothing selected</span>
        </div>

        <div class="crosshair"></div>

        <div class="bottomTools">
            <button id="focusBtn">Focus</button>
            <button id="wireBtn">Wireframe</button>
            <button id="gridBtn">Grid</button>
        </div>

    </section>


    <!-- RIGHT -->
    <aside class="panel inspector">

        <div class="panelTitle">
            <span>MATERIAL</span>
            <small id="selectedName">NONE</small>
        </div>

        <div class="section">
            <label>Base Color</label>
            <div class="colorRow">
                <input id="baseColor" type="color" value="#ffffff">
                <span id="baseColorValue">#ffffff</span>
            </div>
        </div>

        <div class="section">
            <label>Texture Scale <b id="scaleValue">1.00</b></label>
            <input id="scale" type="range" min=".05" max="20" step=".05" value="1">
        </div>

        <div class="section">
            <label>Rotation <b id="rotationValue">0°</b></label>
            <input id="rotation" type="range" min="-180" max="180" step="1" value="0">
        </div>

        <div class="section">
            <label>Offset X <b id="offsetXValue">0</b></label>
            <input id="offsetX" type="range" min="-2" max="2" step=".01" value="0">
        </div>

        <div class="section">
            <label>Offset Y <b id="offsetYValue">0</b></label>
            <input id="offsetY" type="range" min="-2" max="2" step=".01" value="0">
        </div>

        <div class="section">
            <label>Roughness <b id="roughnessValue">0.50</b></label>
            <input id="roughness" type="range" min="0" max="1" step=".01" value=".5">
        </div>

        <div class="section">
            <label>Metallic <b id="metallicValue">0.00</b></label>
            <input id="metallic" type="range" min="0" max="1" step=".01" value="0">
        </div>

        <div class="section">
            <label>Layers</label>

            <div id="layers">
                <div class="layer selected">
                    <span>●</span>
                    <span>Base Material</span>
                    <button>×</button>
                </div>
            </div>

            <button id="newLayer" class="wide">＋ Add Layer</button>
        </div>

        <div class="section">
            <label>TOOLS</label>

            <button id="removeTexture" class="danger wide">
                Remove Texture
            </button>

            <button id="resetMaterial" class="wide">
                Reset Material
            </button>
        </div>

    </aside>

</main>

<script type="module">

import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { GLTFExporter } from "three/addons/exporters/GLTFExporter.js";

const API = "https://api.polyhaven.com";

let scene;
let camera;
let renderer;
let controls;

let model = null;
let selectedMesh = null;

let raycaster = new THREE.Raycaster();
let mouse = new THREE.Vector2();

let textureCache = new Map();
let polyAssets = [];

let history = [];
let historyIndex = -1;

let paintMode = false;
let decalMode = false;
let wireframe = false;
let gridVisible = true;

const viewer = document.getElementById("viewer");

init();
loadPolyHaven();

function init(){

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x101216);

    camera = new THREE.PerspectiveCamera(
        45,
        viewer.clientWidth / viewer.clientHeight,
        .01,
        5000
    );

    camera.position.set(3,2,5);

    renderer = new THREE.WebGLRenderer({
        antialias:true,
        preserveDrawingBuffer:true
    });

    renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    renderer.setSize(viewer.clientWidth,viewer.clientHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    viewer.appendChild(renderer.domElement);

    controls = new OrbitControls(camera,renderer.domElement);
    controls.enableDamping = true;

    const hemi = new THREE.HemisphereLight(
        0xffffff,
        0x202020,
        2
    );

    scene.add(hemi);

    const key = new THREE.DirectionalLight(
        0xffffff,
        3
    );

    key.position.set(4,8,5);
    scene.add(key);

    const fill = new THREE.DirectionalLight(
        0x8aaaff,
        1
    );

    fill.position.set(-4,2,-4);
    scene.add(fill);

    window.addEventListener("resize",resize);

    renderer.domElement.addEventListener(
        "pointerdown",
        selectObject
    );

    document.getElementById("uploadModel")
        .onclick = () => document.getElementById("modelInput").click();

    document.getElementById("uploadTexture")
        .onclick = () => document.getElementById("textureInput").click();

    document.getElementById("modelInput")
        .addEventListener("change",loadModel);

    document.getElementById("textureInput")
        .addEventListener("change",uploadTexture);

    document.getElementById("searchBox")
        .addEventListener("input",filterTextures);

    document.querySelectorAll("[data-cat]")
        .forEach(btn=>{
            btn.onclick=()=>{
                document.querySelectorAll("[data-cat]")
                    .forEach(x=>x.classList.remove("active"));

                btn.classList.add("active");
                renderLibrary();
            };
        });

    bindMaterialControls();

    document.getElementById("wireBtn").onclick=toggleWire;
    document.getElementById("gridBtn").onclick=toggleGrid;
    document.getElementById("focusBtn").onclick=focusModel;

    document.getElementById("removeTexture")
        .onclick=removeTexture;

    document.getElementById("resetMaterial")
        .onclick=resetMaterial;

    document.getElementById("undoBtn")
        .onclick=undo;

    document.getElementById("redoBtn")
        .onclick=redo;

    document.getElementById("saveProject")
        .onclick=saveProject;

    document.getElementById("exportGLB")
        .onclick=exportGLB;

    document.getElementById("autoUV")
        .onclick=autoUV;

    document.getElementById("decalMode")
        .onclick=()=>{
            decalMode=!decalMode;
            paintMode=false;
            updateModeButtons();
        };

    document.getElementById("paintMode")
        .onclick=()=>{
            paintMode=!paintMode;
            decalMode=false;
            updateModeButtons();
        };

    document.getElementById("newLayer")
        .onclick=addLayer;

    animate();
}

function resize(){

    camera.aspect =
        viewer.clientWidth /
        viewer.clientHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        viewer.clientWidth,
        viewer.clientHeight
    );
}

async function loadPolyHaven(){

    try{

        const response =
            await fetch(API + "/assets");

        const data =
            await response.json();

        polyAssets =
            Object.entries(data)
            .filter(([id,a])=>a.type === 1)
            .map(([id,a])=>({
                id,
                ...a
            }));

        renderLibrary();

    }catch(error){

        document.getElementById("textureList").innerHTML =
            `<div class="error">
                Không tải được Poly Haven.<br>
                Bạn vẫn có thể upload texture riêng.
            </div>`;

        console.error(error);
    }
}

function filterTextures(){
    renderLibrary();
}

function renderLibrary(){

    const list =
        document.getElementById("textureList");

    const query =
        document.getElementById("searchBox")
        .value
        .toLowerCase()
        .trim();

    const category =
        document.querySelector("[data-cat].active")
        ?.dataset.cat || "all";

    let items = polyAssets.filter(asset=>{

        const text =
            `${asset.name} ${asset.category || ""} ${(asset.tags || []).join(" ")}`
            .toLowerCase();

        const matchSearch =
            !query || text.includes(query);

        const matchCategory =
            category === "all" ||
            text.includes(category);

        return matchSearch && matchCategory;
    });

    items = items.slice(0,60);

    list.innerHTML = "";

    if(!items.length){

        list.innerHTML =
            `<div class="empty">No texture found</div>`;

        return;
    }

    items.forEach(asset=>{

        const card =
            document.createElement("div");

        card.className="textureCard";

        card.innerHTML = `
            <img
              src="${asset.thumbnail_url || ""}"
              loading="lazy"
            >
            <div>
                <strong>${escapeHTML(asset.name)}</strong>
                <small>${escapeHTML(asset.category || "PBR")}</small>
            </div>
        `;

        card.onclick=()=>{
            applyPolyMaterial(asset);
        };

        list.appendChild(card);
    });
}

async function applyPolyMaterial(asset){

    if(!selectedMesh){

        alert("Hãy click vào một mesh trước.");

        return;
    }

    try{

        const response =
            await fetch(`${API}/files/${asset.id}`);

        const files =
            await response.json();

        const textureFiles =
            findTextureFiles(files);

        saveHistory();

        const loader =
            new THREE.TextureLoader();

        if(textureFiles.diff){

            const tex =
                await loader.loadAsync(textureFiles.diff);

            tex.colorSpace =
                THREE.SRGBColorSpace;

            tex.wrapS =
                THREE.RepeatWrapping;

            tex.wrapT =
                THREE.RepeatWrapping;

            selectedMesh.material =
                cloneMaterial(selectedMesh.material);

            selectedMesh.material.map = tex;

            textureCache.set(
                asset.id + "_diff",
                tex
            );
        }

        if(textureFiles.rough){

            const rough =
                await loader.loadAsync(textureFiles.rough);

            rough.colorSpace =
                THREE.NoColorSpace;

            selectedMesh.material.roughnessMap =
                rough;
        }

        if(textureFiles.normal){

            const normal =
                await loader.loadAsync(textureFiles.normal);

            normal.colorSpace =
                THREE.NoColorSpace;

            selectedMesh.material.normalMap =
                normal;
        }

        if(textureFiles.ao){

            const ao =
                await loader.loadAsync(textureFiles.ao);

            ao.colorSpace =
                THREE.NoColorSpace;

            selectedMesh.material.aoMap =
                ao;

            if(!selectedMesh.geometry.attributes.uv2){

                selectedMesh.geometry.setAttribute(
                    "uv2",
                    selectedMesh.geometry.attributes.uv
                );
            }
        }

        if(textureFiles.metal){

            const metal =
                await loader.loadAsync(textureFiles.metal);

            metal.colorSpace =
                THREE.NoColorSpace;

            selectedMesh.material.metalnessMap =
                metal;
        }

        selectedMesh.material.needsUpdate=true;

        updateSelectionUI();

    }catch(error){

        console.error(error);

        alert("Không thể tải material này.");
    }
}

function findTextureFiles(obj){

    let result = {};

    function walk(value){

        if(!value) return;

        if(typeof value === "object"){

            for(const key in value){

                const v=value[key];

                if(v && typeof v === "object"){

                    if(v.url){

                        const lower =
                            `${key} ${v.url}`
                            .toLowerCase();

                        if(
                            lower.includes("diff") ||
                            lower.includes("albedo") ||
                            lower.includes("basecolor")
                        )
                            result.diff ||= v.url;

                        if(lower.includes("rough"))
                            result.rough ||= v.url;

                        if(
                            lower.includes("nor_gl") ||
                            lower.includes("normal")
                        )
                            result.normal ||= v.url;

                        if(lower.includes("ao"))
                            result.ao ||= v.url;

                        if(
                            lower.includes("metal")
                        )
                            result.metal ||= v.url;
                    }

                    walk(v);
                }
            }
        }
    }

    walk(obj);

    return result;
}

function cloneMaterial(material){

    if(Array.isArray(material))
        return material.map(m=>m.clone());

    return material.clone();
}

function loadModel(event){

    const file =
        event.target.files[0];

    if(!file) return;

    const url =
        URL.createObjectURL(file);

    const loader =
        new GLTFLoader();

    loader.load(
        url,
        gltf=>{

            if(model)
                scene.remove(model);

            model =
                gltf.scene;

            scene.add(model);

            model.traverse(obj=>{

                if(obj.isMesh){

                    obj.castShadow=true;
                    obj.receiveShadow=true;

                    if(
                        obj.material &&
                        obj.material.map
                    ){
                        obj.material.map.colorSpace =
                            THREE.SRGBColorSpace;
                    }
                }

            });

            centerModel();

            document.getElementById("modelName")
                .textContent=file.name;

            URL.revokeObjectURL(url);

        },
        undefined,
        error=>{
            console.error(error);
            alert("Không thể đọc model.");
        }
    );
}

function centerModel(){

    if(!model) return;

    const box =
        new THREE.Box3().setFromObject(model);

    const center =
        box.getCenter(new THREE.Vector3());

    model.position.sub(center);

    const size =
        box.getSize(new THREE.Vector3());

    const max =
        Math.max(size.x,size.y,size.z);

    const distance =
        max * 2.5;

    camera.position.set(
        distance*.8,
        distance*.6,
        distance
    );

    controls.target.set(0,0,0);
    controls.update();
}

function selectObject(event){

    if(!model) return;

    const rect =
        renderer.domElement.getBoundingClientRect();

    mouse.x =
        ((event.clientX-rect.left)/rect.width)*2-1;

    mouse.y =
        -((event.clientY-rect.top)/rect.height)*2+1;

    raycaster.setFromCamera(mouse,camera);

    const hits =
        raycaster.intersectObject(model,true);

    if(!hits.length) return;

    const hit=hits[0];

    if(hit.object.isMesh){

        selectedMesh=hit.object;

        updateSelectionUI();

        if(decalMode){
            createDecalPlaceholder(hit);
        }
    }
}

function updateSelectionUI(){

    if(!selectedMesh) return;

    document.getElementById("selectedName")
        .textContent =
        selectedMesh.name || "MESH";

    document.getElementById("selectionInfo")
        .textContent =
        selectedMesh.name || "Selected mesh";

    const m=selectedMesh.material;

    if(!m) return;

    document.getElementById("roughness").value =
        m.roughness ?? .5;

    document.getElementById("roughnessValue")
        .textContent =
        Number(m.roughness ?? .5).toFixed(2);

    document.getElementById("metallic").value =
        m.metalness ?? 0;

    document.getElementById("metallicValue")
        .textContent =
        Number(m.metalness ?? 0).toFixed(2);

    if(m.color){

        document.getElementById("baseColor").value =
            "#" + m.color.getHexString();

        document.getElementById("baseColorValue")
            .textContent =
            "#" + m.color.getHexString();
    }
}

function bindMaterialControls(){

    const scale =
        document.getElementById("scale");

    const rotation =
        document.getElementById("rotation");

    const offsetX =
        document.getElementById("offsetX");

    const offsetY =
        document.getElementById("offsetY");

    const roughness =
        document.getElementById("roughness");

    const metallic =
        document.getElementById("metallic");

    scale.oninput=()=>{

        document.getElementById("scaleValue")
            .textContent =
            Number(scale.value).toFixed(2);

        applyUV();
    };

    rotation.oninput=()=>{

        document.getElementById("rotationValue")
            .textContent =
            rotation.value+"°";

        applyUV();
    };

    offsetX.oninput=()=>{

        document.getElementById("offsetXValue")
            .textContent =
            offsetX.value;

        applyUV();
    };

    offsetY.oninput=()=>{

        document.getElementById("offsetYValue")
            .textContent =
            offsetY.value;

        applyUV();
    };

    roughness.oninput=()=>{

        if(!selectedMesh) return;

        selectedMesh.material.roughness =
            Number(roughness.value);

        document.getElementById("roughnessValue")
            .textContent =
            Number(roughness.value).toFixed(2);

        selectedMesh.material.needsUpdate=true;
    };

    metallic.oninput=()=>{

        if(!selectedMesh) return;

        selectedMesh.material.metalness =
            Number(metallic.value);

        document.getElementById("metallicValue")
            .textContent =
            Number(metallic.value).toFixed(2);

        selectedMesh.material.needsUpdate=true;
    };

    document.getElementById("baseColor")
        .oninput=e=>{

            if(!selectedMesh) return;

            selectedMesh.material.color
                .set(e.target.value);

            document.getElementById("baseColorValue")
                .textContent=e.target.value;

            selectedMesh.material.needsUpdate=true;
        };
}

function applyUV(){

    if(!selectedMesh) return;

    const mat=selectedMesh.material;

    const maps=[
        mat.map,
        mat.normalMap,
        mat.roughnessMap,
        mat.metalnessMap,
        mat.aoMap
    ];

    const s=
        Number(document.getElementById("scale").value);

    const r=
        Number(document.getElementById("rotation").value)
        * Math.PI / 180;

    const x=
        Number(document.getElementById("offsetX").value);

    const y=
        Number(document.getElementById("offsetY").value);

    maps.forEach(tex=>{

        if(!tex) return;

        tex.wrapS=THREE.RepeatWrapping;
        tex.wrapT=THREE.RepeatWrapping;

        tex.repeat.set(s,s);
        tex.rotation=r;
        tex.offset.set(x,y);

        tex.needsUpdate=true;
    });
}

function uploadTexture(event){

    const file =
        event.target.files[0];

    if(!file || !selectedMesh){

        if(!selectedMesh)
            alert("Hãy chọn mesh trước.");

        return;
    }

    const url =
        URL.createObjectURL(file);

    const loader =
        new THREE.TextureLoader();

    loader.load(url,tex=>{

        saveHistory();

        tex.colorSpace =
            THREE.SRGBColorSpace;

        tex.wrapS =
            THREE.RepeatWrapping;

        tex.wrapT =
            THREE.RepeatWrapping;

        selectedMesh.material =
            cloneMaterial(selectedMesh.material);

        selectedMesh.material.map=tex;
        selectedMesh.material.needsUpdate=true;

        updateSelectionUI();

    });
}

function createDecalPlaceholder(hit){

    const geometry =
        new THREE.PlaneGeometry(.5,.5);

    const material =
        new THREE.MeshBasicMaterial({
            color:0xffffff,
            transparent:true,
            opacity:.8,
            side:THREE.DoubleSide,
            depthWrite:false
        });

    const decal =
        new THREE.Mesh(
            geometry,
            material
        );

    decal.position.copy(hit.point);

    decal.lookAt(
        hit.point.clone().add(hit.face.normal)
    );

    decal.userData.isDecal=true;

    scene.add(decal);
}

function removeTexture(){

    if(!selectedMesh) return;

    saveHistory();

    const m=selectedMesh.material;

    m.map=null;
    m.normalMap=null;
    m.roughnessMap=null;
    m.metalnessMap=null;
    m.aoMap=null;

    m.needsUpdate=true;
}

function resetMaterial(){

    if(!selectedMesh) return;

    saveHistory();

    selectedMesh.material =
        new THREE.MeshStandardMaterial({
            color:0xffffff,
            roughness:.5,
            metalness:0
        });
}

function addLayer(){

    const layer =
        document.createElement("div");

    layer.className="layer";

    layer.innerHTML=`
        <span>●</span>
        <span>New Layer</span>
        <button>×</button>
    `;

    layer.querySelector("button")
        .onclick=()=>layer.remove();

    document.getElementById("layers")
        .appendChild(layer);
}

function toggleWire(){

    if(!model) return;

    wireframe=!wireframe;

    model.traverse(obj=>{

        if(!obj.isMesh) return;

        if(Array.isArray(obj.material)){

            obj.material.forEach(
                m=>m.wireframe=wireframe
            );

        }else{

            obj.material.wireframe=wireframe;
        }
    });
}

function toggleGrid(){

    gridVisible=!gridVisible;
}

function focusModel(){

    if(model) centerModel();
}

function updateModeButtons(){

    document.getElementById("paintMode")
        .classList.toggle("active",paintMode);

    document.getElementById("decalMode")
        .classList.toggle("active",decalMode);
}

function autoUV(){

    if(!selectedMesh){

        alert("Hãy chọn mesh trước.");

        return;
    }

    /*
      Three.js không có UV unwrap chuyên nghiệp
      tích hợp sẵn.

      Ở bản này, nếu model đã có UV:
      giữ nguyên UV.

      Bước tiếp theo có thể tích hợp
      UV unwrap thực sự.
    */

    if(selectedMesh.geometry.attributes.uv){

        alert(
            "Mesh này đã có UV. Texture có thể sử dụng UV hiện tại."
        );

    }else{

        alert(
            "Mesh chưa có UV. Cần thêm bộ UV unwrap ở phiên bản tiếp theo."
        );
    }
}

function saveHistory(){

    if(!selectedMesh) return;

    const state={
        mesh:selectedMesh.uuid,
        material:selectedMesh.material.clone()
    };

    history =
        history.slice(0,historyIndex+1);

    history.push(state);

    historyIndex=history.length-1;

    if(history.length>30)
        history.shift();
}

function undo(){

    if(historyIndex<0) return;

    historyIndex--;

    if(historyIndex<0) return;

    restoreHistory(history[historyIndex]);
}

function redo(){

    if(historyIndex>=history.length-1)
        return;

    historyIndex++;

    restoreHistory(history[historyIndex]);
}

function restoreHistory(state){

    if(!model) return;

    let mesh=null;

    model.traverse(obj=>{

        if(obj.uuid===state.mesh)
            mesh=obj;
    });

    if(!mesh) return;

    mesh.material =
        state.material.clone();

    selectedMesh=mesh;

    updateSelectionUI();
}

function saveProject(){

    const project={
        version:1,
        modelName:
            document.getElementById("modelName").textContent,
        selected:
            selectedMesh?.name || null,
        materials:[]
    };

    if(model){

        model.traverse(obj=>{

            if(!obj.isMesh) return;

            const m=obj.material;

            project.materials.push({
                name:obj.name,
                color:m.color
                    ? m.color.getHexString()
                    : "ffffff",
                roughness:m.roughness ?? .5,
                metallic:m.metalness ?? 0
            });
        });
    }

    const blob =
        new Blob(
            [JSON.stringify(project,null,2)],
            {type:"application/json"}
        );

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href=url;
    a.download="texture-project.json";
    a.click();

    URL.revokeObjectURL(url);
}

function exportGLB(){

    if(!model){

        alert("Chưa có model.");

        return;
    }

    const exporter =
        new GLTFExporter();

    exporter.parse(
        model,
        result=>{

            const blob =
                new Blob(
                    [result],
                    {type:"model/gltf-binary"}
                );

            const url =
                URL.createObjectURL(blob);

            const a =
                document.createElement("a");

            a.href=url;
            a.download="textured-model.glb";
            a.click();

            URL.revokeObjectURL(url);
        },
        error=>{
            console.error(error);
            alert("Export thất bại.");
        },
        {binary:true}
    );
}

function escapeHTML(text){

    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function animate(){

    requestAnimationFrame(animate);

    controls.update();

    renderer.render(scene,camera);
}

</script>
