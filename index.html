<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rhythm Game - Kho Nhạc Của Tôi</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:
        radial-gradient(circle at top,#17272c 0%,#090d0f 50%,#030405 100%);
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
}

.container{
    width:min(1200px,94%);
    margin:auto;
    padding:25px 0 40px;
}

header{
    text-align:center;
    margin-bottom:20px;
}

header h1{
    margin:0;
    color:#1ed760;
    font-size:34px;
    text-shadow:0 0 20px rgba(30,215,96,.3);
}

header p{
    color:#999;
    margin:8px 0 0;
}

.layout{
    display:grid;
    grid-template-columns:350px 1fr;
    gap:20px;
}

.panel{
    background:rgba(18,23,26,.96);
    border:1px solid #30383d;
    border-radius:16px;
    padding:20px;
    box-shadow:0 15px 40px rgba(0,0,0,.35);
}

.panel h2{
    margin:0 0 15px;
    font-size:20px;
}

/* SEARCH */

.search-box{
    display:flex;
    gap:8px;
}

#search-input{
    flex:1;
    min-width:0;
    padding:12px;
    border-radius:8px;
    border:1px solid #444;
    background:#0d1113;
    color:white;
    outline:none;
}

#search-input:focus{
    border-color:#1db954;
}

.btn{
    border:0;
    border-radius:8px;
    padding:10px 14px;
    cursor:pointer;
    font-weight:bold;
}

.btn-search{
    background:#1db954;
    color:white;
}

.song-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 0;
    border-bottom:1px solid #292f32;
}

.song-info{
    flex:1;
    min-width:0;
}

.song-info strong{
    display:block;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.song-info small{
    color:#888;
}

.btn-add{
    background:#20282b;
    color:#1ed760;
    white-space:nowrap;
}

.empty{
    color:#777;
    text-align:center;
    padding:18px 5px;
    font-size:13px;
}

/* LIBRARY */

.library{
    margin-top:25px;
}

.library-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
}

.library-header h2{
    margin:0;
}

.library-count{
    color:#777;
    font-size:12px;
    margin-top:4px;
}

.clear-library{
    border:1px solid #4a2929;
    background:transparent;
    color:#ff5252;
    padding:7px 10px;
    border-radius:7px;
    cursor:pointer;
    font-size:12px;
}

.library-song{
    display:flex;
    align-items:center;
    gap:10px;
    background:#121719;
    border:1px solid #2b3337;
    border-radius:10px;
    padding:10px;
    margin-bottom:8px;
    transition:.2s;
}

.library-song:hover{
    border-color:#1db954;
}

.library-song.active-song{
    border-color:#1db954;
    background:rgba(29,185,84,.12);
    box-shadow:0 0 14px rgba(29,185,84,.1);
}

.song-cover{
    width:42px;
    height:42px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:8px;
    background:linear-gradient(135deg,#1db954,#08652e);
    font-size:20px;
}

.library-song-info{
    flex:1;
    min-width:0;
}

.library-song-title{
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.library-song-artist{
    color:#888;
    font-size:12px;
    margin-top:3px;
}

.library-actions{
    display:flex;
    gap:4px;
}

.library-play{
    border:0;
    width:35px;
    height:35px;
    border-radius:50%;
    background:#1db954;
    color:white;
    cursor:pointer;
}

.library-delete{
    border:0;
    width:32px;
    height:32px;
    background:transparent;
    color:#ff5252;
    cursor:pointer;
}

.empty-library{
    text-align:center;
    color:#777;
    padding:25px 10px;
    border:1px dashed #30383d;
    border-radius:10px;
}

.empty-icon{
    font-size:35px;
    margin-bottom:8px;
}

.empty-library b{
    color:#aaa;
}

/* GAME */

.game-top{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:15px;
}

.stat{
    background:#0e1315;
    border:1px solid #30383d;
    border-radius:10px;
    text-align:center;
    padding:11px;
}

.stat span{
    display:block;
    color:#777;
    font-size:11px;
    margin-bottom:4px;
}

.stat strong{
    color:#1ed760;
    font-size:22px;
}

#message{
    height:30px;
    text-align:center;
    font-weight:bold;
    font-size:20px;
}

.perfect{color:#00ff88}
.good{color:#00e5ff}
.miss{color:#ff5252}

.game-wrapper{
    width:100%;
}

#game-canvas{
    display:block;
    width:100%;
    height:auto;
    background:#080b0d;
    border:2px solid #30383d;
    border-radius:12px;
}

.audio-status{
    text-align:center;
    color:#777;
    min-height:22px;
    margin:12px 0;
    font-size:14px;
}

.audio-status.playing{
    color:#69f0ae;
}

.controls{
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
}

.control-btn{
    border:1px solid #394247;
    background:#20272b;
    color:white;
    padding:10px 16px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.control-btn:hover{
    background:#2c363b;
}

.help{
    margin-top:15px;
    background:#0d1113;
    border:1px solid #292f33;
    border-radius:10px;
    padding:12px;
    text-align:center;
    color:#888;
}

.keys{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:10px;
}

.key{
    width:48px;
    height:40px;
    display:flex;
    justify-content:center;
    align-items:center;
    border:2px solid #555;
    border-radius:8px;
    font-weight:bold;
}

.key.active{
    border-color:#1db954;
    color:#1db954;
    box-shadow:0 0 15px rgba(29,185,84,.5);
}

/* MOBILE */

@media(max-width:850px){
    .layout{
        grid-template-columns:1fr;
    }
}

@media(max-width:500px){
    .container{
        width:95%;
        padding-top:15px;
    }

    header h1{
        font-size:27px;
    }

    .panel{
        padding:14px;
    }

    .library-header{
        align-items:flex-start;
    }

    .game-top{
        gap:5px;
    }

    .stat{
        padding:8px 3px;
    }

    .stat strong{
        font-size:18px;
    }

    .keys{
        gap:6px;
    }

    .key{
        width:43px;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <h1>🎵 Rhythm Game</h1>
    <p>Kho nhạc của tôi • Chọn bài và bắt nhịp</p>
</header>

<div class="layout">

<!-- ================= KHO NHẠC ================= -->

<div class="panel">

    <h2>🔎 Tìm bài hát</h2>

    <div class="search-box">
        <input
            id="search-input"
            type="text"
            placeholder="Tên bài hát hoặc ca sĩ..."
        >

        <button
            class="btn btn-search"
            onclick="searchSongs()"
        >
            Tìm
        </button>
    </div>

    <div id="search-results">
        <div class="empty">
            Nhập tên bài hát để tìm.
        </div>
    </div>


    <div class="library">

        <div class="library-header">

            <div>
                <h2>❤️ Kho nhạc của tôi</h2>

                <div class="library-count">
                    <span id="library-count">0</span>
                    bài hát
                </div>
            </div>

            <button
                class="clear-library"
                onclick="clearLibrary()"
            >
                🗑 Xóa hết
            </button>

        </div>


        <div id="my-library">

            <div class="empty-library">

                <div class="empty-icon">
                    🎵
                </div>

                <b>Kho nhạc đang trống</b>

                <p>
                    Tìm bài hát phía trên<br>
                    rồi thêm vào kho của bạn.
                </p>

            </div>

        </div>

    </div>

</div>


<!-- ================= GAME ================= -->

<div class="panel">

    <div class="game-top">

        <div class="stat">
            <span>ĐIỂM</span>
            <strong id="score">0</strong>
        </div>

        <div class="stat">
            <span>COMBO</span>
            <strong id="combo">0</strong>
        </div>

        <div class="stat">
            <span>BEST</span>
            <strong id="best">0</strong>
        </div>

    </div>


    <div id="message"></div>


    <canvas
        id="game-canvas"
        width="700"
        height="600"
    ></canvas>


    <div
        id="audio-state"
        class="audio-status"
    >
        🎧 Hãy thêm/chọn một bài hát.
    </div>


    <div class="controls">

        <button
            class="control-btn"
            onclick="togglePause()"
        >
            ⏸ Tạm dừng
        </button>

        <button
            class="control-btn"
            onclick="restartGame()"
        >
            🔄 Chơi lại
        </button>

        <button
            class="control-btn"
            onclick="stopSong()"
        >
            ⏹ Dừng
        </button>

    </div>


    <div class="help">

        🎮 Điều khiển bằng bàn phím

        <div class="keys">

            <div id="key-KeyA" class="key">
                A
            </div>

            <div id="key-KeyS" class="key">
                S
            </div>

            <div id="key-KeyD" class="key">
                D
            </div>

            <div id="key-KeyF" class="key">
                F
            </div>

        </div>

    </div>

</div>

</div>
</div>


<script>

/* =========================================================
   KHO NHẠC MẪU
   ========================================================= */

const ONLINE_DATABASE = [

    {
        id:"1",
        title:"Ngôi Sao Cô Đơn",
        artist:"Jack-J97",
        url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"
    },

    {
        id:"2",
        title:"Chờ Ngày Mưa Tan",
        artist:"Noo Phước Thịnh",
        url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"
    },

    {
        id:"3",
        title:"Cắt Đôi Nỗi Sầu",
        artist:"Tăng Duy Tân",
        url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"
    },

    {
        id:"4",
        title:"Lạc Trôi",
        artist:"Sơn Tùng M-TP",
        url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3"
    },

    {
        id:"5",
        title:"Making My Way",
        artist:"Sơn Tùng M-TP",
        url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3"
    },

    {
        id:"6",
        title:"Em Của Ngày Hôm Qua",
        artist:"Sơn Tùng M-TP",
        url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3"
    }

];


/* =========================================================
   BIẾN GAME
   ========================================================= */

let myLibrary = [];

let currentSong = null;

let currentAudio = null;

let isPlaying = false;

let isPaused = false;

let notes = [];

let score = 0;

let combo = 0;

let bestCombo = 0;

let lastHitTime = 0;


/* =========================================================
   CANVAS
   ========================================================= */

const canvas =
    document.getElementById("game-canvas");

const ctx =
    canvas.getContext("2d");


/* =========================================================
   LANE
   ========================================================= */

const keys = [
    "KeyA",
    "KeyS",
    "KeyD",
    "KeyF"
];

const laneX = [
    87.5,
    262.5,
    437.5,
    612.5
];

const targetY = 510;

const noteRadius = 30;

const colors = [
    "#ff3366",
    "#00e5ff",
    "#ffeb3b",
    "#e040fb"
];


let keyState = {
    KeyA:false,
    KeyS:false,
    KeyD:false,
    KeyF:false
};


/* =========================================================
   LOCAL STORAGE
   ========================================================= */

function saveLibrary(){

    localStorage.setItem(
        "rhythmGameLibrary",
        JSON.stringify(myLibrary)
    );

}


function loadLibrary(){

    try{

        const saved =
            localStorage.getItem(
                "rhythmGameLibrary"
            );

        if(saved){

            myLibrary =
                JSON.parse(saved);

        }

    }catch(error){

        console.error(error);

        myLibrary = [];

    }

    updateLibraryUI();

}


/* =========================================================
   SEARCH
   ========================================================= */

function searchSongs(){

    const input =
        document.getElementById(
            "search-input"
        );

    const query =
        input.value
            .toLowerCase()
            .trim();

    const container =
        document.getElementById(
            "search-results"
        );

    container.innerHTML = "";


    if(!query){

        container.innerHTML = `
            <div class="empty">
                Hãy nhập tên bài hát cần tìm!
            </div>
        `;

        return;
    }


    const results =
        ONLINE_DATABASE.filter(song =>

            song.title
                .toLowerCase()
                .includes(query)

            ||

            song.artist
                .toLowerCase()
                .includes(query)

        );


    if(results.length === 0){

        container.innerHTML = `
            <div class="empty">
                Không tìm thấy bài hát nào.
            </div>
        `;

        return;
    }


    results.forEach(song => {

        const exists =
            myLibrary.some(
                s => s.id === song.id
            );


        const item =
            document.createElement(
                "div"
            );

        item.className =
            "song-item";


        item.innerHTML = `

            <div class="song-info">

                <strong>
                    ${escapeHTML(song.title)}
                </strong>

                <small>
                    ${escapeHTML(song.artist)}
                </small>

            </div>

            <button
                class="btn btn-add"
                onclick="addToLibrary('${song.id}')"
            >
                ${exists ? "✓ Đã thêm" : "❤️ Thêm"}
            </button>

        `;


        container.appendChild(item);

    });

}


/* =========================================================
   ENTER SEARCH
   ========================================================= */

document
    .getElementById("search-input")
    .addEventListener(
        "keydown",
        function(e){

            if(e.key === "Enter"){

                searchSongs();

            }

        }
    );


/* =========================================================
   ADD SONG
   ========================================================= */

function addToLibrary(songId){

    if(
        myLibrary.some(
            song => song.id === songId
        )
    ){

        showMessage(
            "Bài hát đã có trong kho ❤️",
            "good"
        );

        return;
    }


    const song =
        ONLINE_DATABASE.find(
            s => s.id === songId
        );


    if(!song) return;


    myLibrary.push(song);

    saveLibrary();

    updateLibraryUI();

    searchSongs();


    showMessage(
        "❤️ Đã thêm vào kho!",
        "good"
    );

}


/* =========================================================
   DELETE SONG
   ========================================================= */

function removeFromLibrary(songId){

    myLibrary =
        myLibrary.filter(
            song => song.id !== songId
        );


    saveLibrary();

    updateLibraryUI();

    searchSongs();


    if(
        currentSong &&
        currentSong.id === songId
    ){

        stopSong();

    }

}


/* =========================================================
   CLEAR LIBRARY
   ========================================================= */

function clearLibrary(){

    if(myLibrary.length === 0){

        return;

    }


    if(
        !confirm(
            "Bạn có chắc muốn xóa toàn bộ kho nhạc?"
        )
    ){

        return;

    }


    stopSong();

    myLibrary = [];

    saveLibrary();

    updateLibraryUI();

    searchSongs();

}


/* =========================================================
   UPDATE LIBRARY
   ========================================================= */

function updateLibraryUI(){

    const container =
        document.getElementById(
            "my-library"
        );


    const count =
        document.getElementById(
            "library-count"
        );


    count.textContent =
        myLibrary.length;


    container.innerHTML = "";


    if(myLibrary.length === 0){

        container.innerHTML = `

            <div class="empty-library">

                <div class="empty-icon">
                    🎵
                </div>

                <b>Kho nhạc đang trống</b>

                <p>
                    Tìm bài hát phía trên<br>
                    rồi thêm vào kho của bạn.
                </p>

            </div>

        `;

        return;
    }


    myLibrary.forEach(song => {

        const item =
            document.createElement(
                "div"
            );


        item.className =
            "library-song";


        if(
            currentSong &&
            currentSong.id === song.id
        ){

            item.classList.add(
                "active-song"
            );

        }


        item.innerHTML = `

            <div class="song-cover">
                🎵
            </div>

            <div class="library-song-info">

                <div class="library-song-title">
                    ${escapeHTML(song.title)}
                </div>

                <div class="library-song-artist">
                    ${escapeHTML(song.artist)}
                </div>

            </div>

            <div class="library-actions">

                <button
                    class="library-play"
                    title="Chơi"
                >
                    ▶
                </button>

                <button
                    class="library-delete"
                    title="Xóa"
                >
                    🗑
                </button>

            </div>

        `;


        item
            .querySelector(
                ".library-play"
            )
            .onclick =
            function(){

                startSong(song);

            };


        item
            .querySelector(
                ".library-delete"
            )
            .onclick =
            function(){

                removeFromLibrary(
                    song.id
                );

            };


        container.appendChild(item);

    });

}


/* =========================================================
   START SONG
   ========================================================= */

function startSong(song){

    stopAudioOnly();


    currentSong = song;


    currentAudio =
        new Audio(song.url);


    currentAudio.loop = true;

    currentAudio.volume = 0.65;


    currentAudio
        .play()
        .catch(function(){

            setAudioStatus(
                "▶️ Hãy bấm A/S/D/F để kích hoạt nhạc.",
                false
            );

        });


    resetGame();


    isPlaying = true;

    isPaused = false;

    lastHitTime = Date.now();


    updateLibraryUI();


    setAudioStatus(
        "🔊 Đang phát: " + song.title,
        true
    );


    showMessage(
        "BẮT ĐẦU! 🎵",
        "good"
    );

}


/* =========================================================
   AUDIO
   ========================================================= */

function stopAudioOnly(){

    if(currentAudio){

        currentAudio.pause();

        currentAudio.currentTime = 0;

        currentAudio = null;

    }

}


function stopSong(){

    stopAudioOnly();

    currentSong = null;

    isPlaying = false;

    isPaused = false;

    notes = [];

    resetGame();

    updateLibraryUI();

    setAudioStatus(
        "🎧 Đã dừng.",
        false
    );

}


/* =========================================================
   PAUSE
   ========================================================= */

function togglePause(){

    if(!currentSong){

        showMessage(
            "Hãy chọn bài hát trước!",
            "miss"
        );

        return;
    }


    if(isPaused){

        isPaused = false;


        if(currentAudio){

            currentAudio
                .play()
                .catch(()=>{});

        }


        setAudioStatus(
            "🔊 Nhạc đang phát.",
            true
        );

    }else{

        isPaused = true;


        if(currentAudio){

            currentAudio.pause();

        }


        setAudioStatus(
            "⏸ Đã tạm dừng.",
            false
        );

    }

}


/* =========================================================
   RESTART
   ========================================================= */

function restartGame(){

    if(!currentSong){

        showMessage(
            "Hãy chọn bài hát trước!",
            "miss"
        );

        return;
    }


    startSong(currentSong);

}


/* =========================================================
   RESET
   ========================================================= */

function resetGame(){

    score = 0;

    combo = 0;

    notes = [];

    lastHitTime = Date.now();


    document
        .getElementById("score")
        .textContent = "0";


    document
        .getElementById("combo")
        .textContent = "0";

}


/* =========================================================
   KEY DOWN
   ========================================================= */

window.addEventListener(
    "keydown",
    function(e){

        if(!keys.includes(e.code))
            return;


        e.preventDefault();


        keyState[e.code] = true;


        const key =
            document.getElementById(
                "key-" + e.code
            );


        if(key){

            key.classList.add(
                "active"
            );

        }


        if(
            currentAudio &&
            currentAudio.paused &&
            !isPaused
        ){

            currentAudio
                .play()
                .catch(()=>{});

        }


        checkHit(e.code);

    }
);


/* =========================================================
   KEY UP
   ========================================================= */

window.addEventListener(
    "keyup",
    function(e){

        if(!keys.includes(e.code))
            return;


        keyState[e.code] = false;


        const key =
            document.getElementById(
                "key-" + e.code
            );


        if(key){

            key.classList.remove(
                "active"
            );

        }

    }
);


/* =========================================================
   HIT
   ========================================================= */

function checkHit(keyCode){

    if(
        !isPlaying ||
        isPaused
    ){

        return;

    }


    const lane =
        keys.indexOf(keyCode);


    let index = -1;

    let distance =
        Infinity;


    for(
        let i = 0;
        i < notes.length;
        i++
    ){

        if(
            notes[i].lane !== lane
        ){

            continue;

        }


        const d =
            Math.abs(
                notes[i].y - targetY
            );


        if(d < distance){

            distance = d;

            index = i;

        }

    }


    if(
        index !== -1 &&
        distance <= 60
    ){

        notes.splice(
            index,
            1
        );


        if(distance <= 20){

            score +=
                100 + combo * 2;

            combo++;

            showMessage(
                "PERFECT! ✨",
                "perfect"
            );

        }

        else if(distance <= 40){

            score +=
                50 + combo;

            combo++;

            showMessage(
                "GOOD! 👍",
                "good"
            );

        }

        else{

            score += 20;

            combo++;

            showMessage(
                "OK!",
                "good"
            );

        }


        if(
            combo > bestCombo
        ){

            bestCombo =
                combo;

        }


        lastHitTime =
            Date.now();


        updateStats();

    }

    else{

        combo = 0;

        updateStats();

        showMessage(
            "MISS!",
            "miss"
        );

    }

}


/* =========================================================
   SPAWN NOTES
   ========================================================= */

setInterval(
    function(){

        if(
            !isPlaying ||
            isPaused
        ){

            return;

        }


        const lane =
            Math.floor(
                Math.random() * 4
            );


        notes.push({

            lane:lane,

            y:-30,

            speed:
                4.5 +
                Math.random() * 1.5

        });

    },
    600
);


/* =========================================================
   UPDATE STATS
   ========================================================= */

function updateStats(){

    document
        .getElementById("score")
        .textContent =
        score;


    document
        .getElementById("combo")
        .textContent =
        combo;


    document
        .getElementById("best")
        .textContent =
        bestCombo;

}


/* =========================================================
   AUDIO STATUS
   ========================================================= */

function setAudioStatus(
    text,
    playing
){

    const element =
        document.getElementById(
            "audio-state"
        );


    element.textContent =
        text;


    element.className =
        playing
            ? "audio-status playing"
            : "audio-status";

}


/* =========================================================
   MESSAGE
   ========================================================= */

let messageTimer;


function showMessage(
    text,
    type
){

    const element =
        document.getElementById(
            "message"
        );


    element.textContent =
        text;


    element.className =
        type || "";


    clearTimeout(
        messageTimer
    );


    if(text){

        messageTimer =
            setTimeout(
                function(){

                    element.textContent =
                        "";

                    element.className =
                        "";

                },
                600
            );

    }

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   GAME RENDER
   ========================================================= */

function update(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* BACKGROUND */

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            canvas.height
        );


    gradient.addColorStop(
        0,
        "#070a0c"
    );


    gradient.addColorStop(
        1,
        "#121a1e"
    );


    ctx.fillStyle =
        gradient;


    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* LANES */

    for(
        let i = 0;
        i < 4;
        i++
    ){

        const left =
            i === 0
                ? 0
                : (
                    laneX[i-1] +
                    laneX[i]
                ) / 2;


        const right =
            i === 3
                ? canvas.width
                : (
                    laneX[i] +
                    laneX[i+1]
                ) / 2;


        ctx.fillStyle =
            i % 2 === 0
                ? "rgba(255,255,255,.015)"
                : "rgba(255,255,255,.035)";


        ctx.fillRect(
            left,
            0,
            right-left,
            canvas.height
        );

    }


    /* LANE LINES */

    for(
        let i = 0;
        i < 4;
        i++
    ){

        ctx.strokeStyle =
            "#30383d";

        ctx.lineWidth = 2;


        ctx.beginPath();

        ctx.moveTo(
            laneX[i],
            0
        );

        ctx.lineTo(
            laneX[i],
            canvas.height
        );

        ctx.stroke();

    }


    /* TARGET AREA */

    ctx.fillStyle =
        "rgba(29,185,84,.08)";


    ctx.fillRect(
        0,
        targetY - 45,
        canvas.width,
        90
    );


    /* TARGET CIRCLES */

    for(
        let i = 0;
        i < 4;
        i++
    ){

        const active =
            keyState[keys[i]];


        ctx.strokeStyle =
            active
                ? "#1db954"
                : "#666";


        ctx.lineWidth =
            active
                ? 5
                : 2;


        ctx.beginPath();

        ctx.arc(
            laneX[i],
            targetY,
            noteRadius,
            0,
            Math.PI * 2
        );

        ctx.stroke();


        ctx.fillStyle =
            active
                ? "#1db954"
                : "#aaa";


        ctx.font =
            "bold 16px Arial";


        ctx.textAlign =
            "center";


        ctx.fillText(
            keys[i].replace(
                "Key",
                ""
            ),
            laneX[i],
            targetY + 6
        );

    }


    /* NOTES */

    if(
        isPlaying &&
        !isPaused
    ){

        for(
            let i = notes.length - 1;
            i >= 0;
            i--
        ){

            const note =
                notes[i];


            note.y +=
                note.speed;


            ctx.shadowColor =
                colors[note.lane];

            ctx.shadowBlur = 18;


            ctx.fillStyle =
                colors[note.lane];


            ctx.beginPath();

            ctx.arc(
                laneX[note.lane],
                note.y,
                noteRadius - 3,
                0,
                Math.PI * 2
            );

            ctx.fill();


            ctx.shadowBlur = 0;


            /* HIGHLIGHT */

            ctx.fillStyle =
                "rgba(255,255,255,.5)";


            ctx.beginPath();

            ctx.arc(
                laneX[note.lane] - 7,
                note.y - 7,
                6,
                0,
                Math.PI * 2
            );

            ctx.fill();


            /* MISS */

            if(
                note.y >
                canvas.height + 40
            ){

                notes.splice(
                    i,
                    1
                );


                combo = 0;

                updateStats();

                showMessage(
                    "MISS!",
                    "miss"
                );

            }

        }

    }


    /* PAUSE */

    if(isPaused){

        ctx.fillStyle =
            "rgba(0,0,0,.6)";


        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        ctx.fillStyle =
            "white";


        ctx.font =
            "bold 36px Arial";


        ctx.textAlign =
            "center";


        ctx.fillText(
            "⏸ PAUSED",
            canvas.width / 2,
            canvas.height / 2
        );

    }


    requestAnimationFrame(
        update
    );

}


/* =========================================================
   START
   ========================================================= */

loadLibrary();

searchSongs();

update();

</script>
