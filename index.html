<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rhythm Game - Kho Nhạc Trực Tuyến</title>
    <script>
        // --- DỮ LIỆU KHO NHẠC TRỰC TUYẾN GIẢ LẬP ---
        const ONLINE_DATABASE = [
            { id: "1", title: "Ngôi Sao Cô Đơn", artist: "Jack-J97", url: "https://soundhelix.com" },
            { id: "2", title: "Chờ Ngày Mưa Tan", artist: "Noo Phước Thịnh", url: "https://soundhelix.com" },
            { id: "3", title: "Cắt Đôi Nỗi Sầu", artist: "Tăng Duy Tân", url: "https://soundhelix.com" },
            { id: "4", title: "Lạc Trôi", artist: "Sơn Tùng M-TP", url: "https://soundhelix.com" },
            { id: "5", title: "Making My Way", artist: "Sơn Tùng M-TP", url: "https://soundhelix.com" },
            { id: "6", title: "Em Của Ngày Hôm Qua", artist: "Sơn Tùng M-TP", url: "https://soundhelix.com" }
        ];

        let myLibrary = []; 
        let currentAudio = null;
        let lastHitTime = 0; 
        let isPlaying = false;
        
        function searchSongs() {
            const query = document.getElementById("search-input").value.toLowerCase().trim();
            const resultsContainer = document.getElementById("search-results");
            resultsContainer.innerHTML = "";
            
            if(!query) {
                resultsContainer.innerHTML = '<div style="color: #aaa; padding: 10px; text-align: center; font-size: 13px;">Hãy nhập tên bài hát cần tìm!</div>';
                return;
            }

            const filtered = ONLINE_DATABASE.filter(song => song.title.toLowerCase().includes(query) || song.artist.toLowerCase().includes(query));
            
            if(filtered.length === 0) {
                resultsContainer.innerHTML = '<div style="color: #aaa; padding: 10px; text-align: center; font-size: 13px;">Không tìm thấy bài hát nào phù hợp!</div>';
                return;
            }

            filtered.forEach(song => {
                const item = document.createElement("div");
                item.className = "song-item";
                item.innerHTML = `
                    <div class="song-info">
                        <strong>${song.title}</strong><br>
                        <small style="color:#aaa">${song.artist}</small>
                    </div>
                    <button class="btn-action btn-add" onclick="addToLibrary('${song.id}')">❤️ Thêm</button>
                `;
                resultsContainer.appendChild(item);
            });
        }

        function addToLibrary(songId) {
            if (myLibrary.some(s => s.id === songId)) {
                alert("Bài hát này đã có trong kho nhạc yêu thích của bạn rồi!");
                return;
            }
            const song = ONLINE_DATABASE.find(s => s.id === songId);
            myLibrary.push(song);
            updateLibraryUI();
        }

        function updateLibraryUI() {
            const libContainer = document.getElementById("my-library");
            const hint = document.getElementById("empty-hint");
            
            if(myLibrary.length > 0 && hint) hint.remove();
            
            libContainer.querySelectorAll(".btn-play").forEach(el => el.remove());

            myLibrary.forEach(song => {
                const btn = document.createElement("button");
                btn.className = "btn-play";
                btn.id = `lib-song-${song.id}`;
                btn.innerHTML = `
                    <span>🎵 <b>${song.title}</b> - ${song.artist}</span>
                    <span style="color: #1db954; font-weight: bold;">▶ Chơi</span>
                `;
                btn.onclick = () => startSong(song);
                libContainer.appendChild(btn);
            });
        }

        function startSong(song) {
            document.querySelectorAll(".btn-play").forEach(el => el.classList.remove("active-song"));
            const currentBtn = document.getElementById(`lib-song-${song.id}`);
            if (currentBtn) currentBtn.classList.add("active-song");

            if(currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }

            currentAudio = new Audio(song.url);
            currentAudio.volume = 0; 
            currentAudio.play().catch(e => console.log("Chờ bấm phím kích hoạt luồng phát"));
            
            score = 0;
            combo = 0;
            document.getElementById("score").innerText = score;
            document.getElementById("combo").innerText = combo;
            
            lastHitTime = Date.now();
            isPlaying = true;
            notes = []; 
            document.getElementById("audio-state").innerText = "Đã nạp nhạc! Hãy bấm phím LIÊN TỤC để nghe tiếng.";
            document.getElementById("audio-state").className = "audio-status playing";
        }

        const canvas = document.getElementById("game-canvas");
        const ctx = canvas.getContext("2d");

        const keys = ['KeyA', 'KeyS', 'KeyD', 'KeyF'];
const laneX = [100, 200, 300, 400];


        const targetY = 480; 
        const noteRadius = 25;
        let notes = [];
        let score = 0;
        let combo = 0;

        let keyState = { KeyA: false, KeyS: false, KeyD: false, KeyF: false };

        window.addEventListener('keydown', (e) => {
            if (keys.includes(e.code)) {
                keyState[e.code] = true;
                checkHit(e.code);
            }
        });

        window.addEventListener('keyup', (e) => {
            if (keys.includes(e.code)) {
                keyState[e.code] = false;
            }
        });

        function checkHit(keyCode) {
            if (!isPlaying) return;
            const laneIndex = keys.indexOf(keyCode);
            let hitSuccess = false;

            for (let i = 0; i < notes.length; i++) {
                let note = notes[i];
                if (note.lane === laneIndex && Math.abs(note.y - targetY) < 40) {
                    notes.splice(i, 1);
                    score += 10 + combo;
                    combo++;
                    lastHitTime = Date.now(); 
                    hitSuccess = true;
                    break;
                }
            }

            if (!hitSuccess) {
                combo = 0; 
            }

            document.getElementById("score").innerText = score;
            document.getElementById("combo").innerText = combo;
        }

        setInterval(() => {
            if (!isPlaying) return;
            let randomLane = Math.floor(Math.random() * 4);
            notes.push({ lane: randomLane, y: 0, speed: 4 });
        }, 600);

        function update() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < 4; i++) {
                ctx.strokeStyle = "#333";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(laneX[i], 0);
                ctx.lineTo(laneX[i], canvas.height);
                ctx.stroke();

                ctx.strokeStyle = keyState[keys[i]] ? "#1db954" : "#555";
                ctx.lineWidth = keyState[keys[i]] ? 4 : 2;
                ctx.beginPath();
                ctx.arc(laneX[i], targetY, noteRadius, 0, Math.PI * 2);
                ctx.stroke();
                
                ctx.fillStyle = "#aaa";
                ctx.font = "14px Arial";
                ctx.fillText(keys[i].replace("Key", ""), laneX[i] - 6, targetY + 5);
            }

            if (isPlaying) {
                for (let i = notes.length - 1; i >= 0; i--) {
                    notes[i].y += notes[i].speed;

                    const colors = ["#ff3366", "#00e5ff", "#ffeb3b", "#e040fb"];
                    ctx.fillStyle = colors[notes[i].lane];
                    ctx.beginPath();
                    ctx.arc(laneX[notes[i].lane], notes[i].y, noteRadius - 2, 0, Math.PI * 2);
                    ctx.fill();

                    if (notes[i].y > canvas.height) {
                        notes.splice(i, 1);
                        combo = 0; 
                        document.getElementById("combo").innerText = combo;
                    }
                }

                let now = Date.now();
                if (currentAudio) {
                    if (now - lastHitTime > 800) {
                        currentAudio.volume = 0; 
                        document.getElementById("audio-state").innerText = "🔇 Đang mất nhịp! Hãy bấm tiếp để nghe tiếng...";
                        document.getElementById("audio-state").className = "audio-status";
                        document.getElementById("audio-state").style.color = "#ff5252";
                    } else {
                        currentAudio.volume = 1; 
                        document.getElementById("audio-state").innerText = "🔊 Nhạc đang phát trực tuyến mượt mà!";
                        document.getElementById("audio-state").className = "audio-status playing";
                        document.getElementById("audio-state").style.color = "#69f0ae";
                    }
                }
            }

            requestAnimationFrame(update);
        }

        update();
    </script>
</body>
</html>
