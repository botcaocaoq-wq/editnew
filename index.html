<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Texture Studio</title>

<script type="importmap">
{
  "imports": {
    "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>

<style>
*{
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#0b0d11;
    color:#eee;
}

button,input{
    font:inherit;
}

button{
    cursor:pointer;
}

.topbar{
    height:58px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 14px;
    background:#11141a;
    border-bottom:1px solid #292e38;
}

.logo{
    font-size:18px;
    font-weight:800;
    letter-spacing:1px;
}

.logo span{
    color:#a855f7;
}

.toolbar{
    display:flex;
    gap:7px;
    align-items:center;
}

.toolbar button,
.bottomTools button,
.inspector button{
    border:1px solid #303641;
    background:#171b22;
    color:#ddd;
    border-radius:7px;
    padding:7px 11px;
}

.toolbar button:hover,
.bottomTools button:hover,
.inspector button:hover{
    background:#222832;
}

.toolbar .primary{
    background:#7c3aed;
    border-color:#8b5cf6;
    color:#fff;
}

.layout{
    height:calc(100vh - 58px);
    display:grid;
    grid-template-columns:310px minmax(0,1fr) 300px;
}

.panel{
    min-height:0;
    background:#101319;
}

.library{
    display:flex;
    flex-direction:column;
    border-right:1px solid #292e38;
}

.inspector{
    overflow:auto;
    border-left:1px solid #292e38;
    padding-bottom:30px;
}

.panelTitle{
    height:48px;
    padding:0 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #292e38;
}

.panelTitle span{
    font-size:12px;
    font-weight:800;
    letter-spacing:.8px;
}

.panelTitle small{
    color:#9ca3af;
    font-size:9px;
}

.search{
    margin:10px;
    width:calc(100% - 20px);
    height:36px;
    border:1px solid #303641;
    border-radius:8px;
    background:#171b22;
    color:#fff;
    padding:0 11px;
    outline:none;
}

.search:focus{
    border-color:#8b5cf6;
}

.categories{
    display:flex;
    gap:6px;
    overflow-x:auto;
    overflow-y:hidden;
    padding:0 10px 9px;
    scrollbar-width:thin;
    flex-shrink:0;
}

.categories::-webkit-scrollbar{
    height:6px;
}

.categories::-webkit-scrollbar-thumb{
    background:#444;
    border-radius:10px;
}

.categories button{
    flex:0 0 auto;
    border:1px solid #303641;
    background:#171b22;
    color:#aaa;
    border-radius:7px;
    padding:7px 10px;
    font-size:10px;
    white-space:nowrap;
}

.categories button.active{
    background:#7c3aed;
    color:#fff;
    border-color:#8b5cf6;
}

.textureList{
    flex:1;
    min-height:0;
    overflow-y:auto;
    overflow-x:hidden;
    padding:4px 10px 20px;
    scrollbar-width:thin;
}

.textureList::-webkit-scrollbar{
    width:7px;
}

.textureList::-webkit-scrollbar-thumb{
    background:#3d424d;
    border-radius:10px;
}

.textureCard{
    display:flex;
    align-items:center;
    gap:9px;
    width:100%;
    min-height:65px;
    margin-bottom:7px;
    padding:6px;
    border:1px solid #292e38;
    border-radius:9px;
    background:#151920;
    transition:.15s;
    user-select:none;
}

.textureCard:hover{
    border-color:#8b5cf6;
    background:#1c2029;
    transform:translateX(1px);
}

.textureCard.loading{
    opacity:.65;
    border-color:#a855f7;
}

.textureCard img{
    width:54px;
    height:54px;
    flex:0 0 54px;
    object-fit:cover;
    border-radius:6px;
    background:#242933;
}

.textureCard img.thumbnailError{
    background:
        linear-gradient(45deg,#20242c 25%,transparent 25%),
        linear-gradient(-45deg,#20242c 25%,transparent 25%),
        linear-gradient(45deg,transparent 75%,#20242c 75%),
        linear-gradient(-45deg,transparent 75%,#20242c 75%);
    background-size:12px 12px;
    background-position:0 0,0 6px,6px -6px,-6px 0;
}

.textureCard strong{
    display:block;
    color:#f1f1f1;
    font-size:11px;
    line-height:15px;
}

.textureCard small{
    display:block;
    color:#8f96a3;
    margin-top:3px;
    font-size:9px;
}

.loading,
.empty,
.error{
    padding:25px 12px;
    text-align:center;
    color:#888;
    font-size:11px;
    line-height:18px;
}

.credit{
    padding:9px 12px;
    border-top:1px solid #292e38;
    color:#777;
    font-size:9px;
    flex-shrink:0;
}

.credit a{
    color:#a855f7;
}

.viewport{
    position:relative;
    min-width:0;
    min-height:0;
    background:#0d1015;
}

#viewer{
    position:absolute;
    inset:0;
}

#viewer canvas{
    display:block;
    width:100%;
    height:100%;
}

.viewerTop{
    position:absolute;
    top:12px;
    left:12px;
    right:12px;
    display:flex;
    justify-content:space-between;
    pointer-events:none;
}

.viewerTop span{
    background:rgba(10,12,16,.78);
    border:1px solid #303641;
    padding:7px 9px;
    border-radius:7px;
    font-size:10px;
}

#selectionInfo{
    color:#c4b5fd;
}

.bottomTools{
    position:absolute;
    left:50%;
    bottom:14px;
    transform:translateX(-50%);
    display:flex;
    gap:7px;
}

.bottomTools button{
    background:rgba(15,18,24,.9);
}

.crosshair{
    position:absolute;
    left:50%;
    top:50%;
    width:1px;
    height:1px;
    pointer-events:none;
}

.section{
    padding:12px 13px;
    border-bottom:1px solid #252a33;
}

.section>label{
    display:flex;
    justify-content:space-between;
    font-size:10px;
    color:#aaa;
    margin-bottom:8px;
}

.section b{
    color:#ddd;
    font-weight:500;
}

input[type="range"]{
    width:100%;
    accent-color:#8b5cf6;
}

.colorRow{
    display:flex;
    align-items:center;
    gap:10px;
}

#baseColor{
    width:48px;
    height:32px;
    border:0;
    padding:0;
    background:none;
}

#baseColorValue{
    color:#aaa;
    font-size:10px;
}

.wide{
    width:100%;
    margin-top:7px;
}

.danger{
    border-color:#7f1d1d!important;
    color:#fca5a5!important;
}

.layer{
    display:flex;
    align-items:center;
    gap:7px;
    padding:8px;
    margin-bottom:5px;
    background:#171b22;
    border:1px solid #303641;
    border-radius:7px;
    font-size:10px;
}

.layer.selected{
    border-color:#7c3aed;
}

.layer button{
    margin-left:auto;
    padding:2px 7px;
}

.matcap-btn {
    background: #1e1b4b !important;
    border-color: #4338ca !important;
    color: #c7d2fe !important;
    transition: 0.2s;
}
.matcap-btn:hover {
    background: #312e81 !important;
    border-color: #6366f1 !important;
}
</style>
</head>

<body>

<header class="topbar">
    <div class="logo">TEXTURE<span>STUDIO</span></div>

    <div class="toolbar">
        <button id="uploadModel">＋ Model</button>
        <button id="uploadTexture">＋ Texture</button>
        <button id="undoBtn">↶</button>
        <button id="redoBtn">↷</button>
        <button id="saveProject">Save</button>
        <button id="exportGLB" class="primary">Export GLB</button>
    </div>

    <input id="modelInput" type="file" accept=".glb,.gltf,.bin" hidden>
    <input id="textureInput" type="file" accept="image/*" hidden>
</header>

<main class="layout">

<aside class="panel library">
    <div class="panelTitle">
        <span>TEXTURE LIBRARY</span>
        <small>POLY HAVEN</small>
    </div>

    <input id="searchBox" class="search" placeholder="Search wood, glass, skin...">

    <div class="categories">
        <button data-cat="all" class="active">ALL</button>
        <button data-cat="wood">WOOD</button>
        <button data-cat="stone">STONE</button>
        <button data-cat="metal">METAL</button>
        <button data-cat="concrete">CONCRETE</button>
        <button data-cat="ground">GROUND</button>
        <button data-cat="brick">BRICK</button>
        <button data-cat="wall">WALL</button>
        <button data-cat="floor">FLOOR</button>
        <button data-cat="roof">ROOF</button>
        <button data-cat="fabric">FABRIC</button>
        <button data-cat="glass">🪟 GLASS</button>
        <button data-cat="creature">🐾 CREATURE</button>
        <button data-cat="cartoon">🎨 CARTOON</button>
    </div>

    <div id="textureList" class="textureList">
        <div class="loading">Đang tải thư viện texture...</div>
    </div>
    <div class="credit">Powered by <a href="https://polyhaven.com" target="_blank">Poly Haven</a></div>
</aside>

<section class="viewport">
    <div id="viewer"></div>
    <div class="viewerTop">
        <span id="modelStatus">No model</span>
        <span id="selectionInfo">Nothing selected</span>
    </div>
    <div class="bottomTools">
        <button id="focusBtn">Focus</button>
        <button id="wireframeBtn">Wireframe</button>
        <button id="gridBtn">Grid</button>
    </div>
    <div class="crosshair"></div>
</section>

<aside class="panel inspector">
    <div class="panelTitle">
        <span>MATERIAL</span>
        <small id="matNameDisplay">NONE</small>
    </div>

    <div class="section">
        <label>Base Color</label>
        <div class="colorRow">
            <input type="color" id="baseColor" value="#ffffff">
            <span id="baseColorValue">#ffffff</span>
        </div>
    </div>

    <div class="section">
        <label>Texture Scale <b id="scaleVal">1.00</b></label>
        <input type="range" id="textureScale" min="0.1" max="10" step="0.05" value="1">
    </div>

    <div class="section">
        <label>Rotation <b id="rotVal">0°</b></label>
        <input type="range" id="textureRot" min="0" max="360" step="1" value="0">
    </div>

    <div class="section">
        <label>Offset X <b id="offsetXVal">0</b></label>
        <input type="range" id="textureOffsetX" min="-2" max="2" step="0.01" value="0">
    </div>

    <div class="section">
        <label>Offset Y <b id="offsetYVal">0</b></label>
        <input type="range" id="textureOffsetY" min="-2" max="2" step="0.01" value="0">
    </div>

    <div class="section">
        <label>Roughness <b id="roughVal">0.50</b></label>
        <input type="range" id="textureRough" min="0" max="1" step="0.01" value="0.5">
    </div>

    <div class="section">
        <label>Metallic <b id="metalVal">0.00</b></label>
        <input type="range" id="textureMetal" min="0" max="1" step="0.01" value="0">
    </div>

    <div class="section">
        <label>Layers</label>
        <div id="layersList">
            <div class="layer selected">
                <span>● Base Material</span>
                <button class="danger">×</button>
            </div>
        </div>
        <button id="addLayerBtn" class="wide">＋ Add Layer</button>
        <button id="addMatcapBtn" class="wide matcap-btn">＋ Add Gray MatCap (Auto)</button>
    </div>

    <div class="section">
        <label>TOOLS</label>
        <button id="removeTexBtn" class="wide danger">Remove Texture</button>
        <button id="resetMatBtn" class="wide" style="margin-top:6px;">Reset Material</button>
    </div>
</aside>

</main>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const container = document.getElementById('viewer');
const scene = new THREE.Scene();
scene.background = new THREE.Color('#0d1015');

const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
camera.position.set(0, 0, 5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(5, 10, 7);
scene.add(dirLight);

let loadedMesh = null;

const defaultGeo = new THREE.SphereGeometry(1.2, 64, 64);
const defaultMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5, metalness: 0.0 });
loadedMesh = new THREE.Mesh(defaultGeo, defaultMat);
scene.add(loadedMesh);
document.getElementById('modelStatus').innerText = "Default Sphere Mesh";

const MATCAP_IMAGE_DATA = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAQAAAAEBAQMAAAB8gI9gAAAABlBMVEUAAICAgID///+Vw9E4AAAACXBIWXMAAAsTAAALEwEAmpwYAAAAB3RJTUUHNgMGDhIsF3973QAAAB1pVFh0Q29tbWVudAAAAAAAQ3JlYXRlZCB3aXRoIEdJTVBkLm3fAAABEUlEQVR42u3YMQ0AAAwDoB39O68VvAEC6ZInSgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAADgYwF7AwAB6mU60QAAAABJRU5ErkJggg==";

const matcapTexture = new THREE.TextureLoader().load(MATCAP_IMAGE_DATA);
const smartMatcapMaterial = new THREE.MeshMatcapMaterial({
    matcap: matcapTexture,
    color: 0xffffff
});

document.getElementById('addMatcapBtn').addEventListener('click', () => {
    if (!loadedMesh) {
        alert("Chưa tìm thấy mô hình nào để xử lý!");
        return;
    }
    
    loadedMesh.traverse((child) => {
        if (child.isMesh) {
            child.geometry.computeVertexNormals();
            if (child.geometry.attributes.normal) {
                child.geometry.attributes.normal.needsUpdate = true;
            }
            child.material = smartMatcapMaterial;
            child.material.needsUpdate = true;
        }
    });
    
    document.getElementById('matNameDisplay').innerText = "GRAY_MATCAP_AUTO";
    console.log("Texture Studio: Đã tự động phủ lớp xám Matcap.");
});

const modelInput = document.getElementById('modelInput');
document.getElementById('uploadModel').addEventListener('click', () => modelInput.click());

modelInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    
    const url = URL.createObjectURL(file);
    const loader = new GLTFLoader();
    
    loader.load(url, (gltf) => {
        if (loadedMesh) scene.remove(loadedMesh);
        
        loadedMesh = gltf.scene;
        scene.add(loadedMesh);
        
        const box = new THREE.Box3().setFromObject(loadedMesh);
        const center = box.getCenter(new THREE.Vector3());
        loadedMesh.position.sub(center);
        
        document.getElementById('modelStatus').innerText = file.name;
        URL.revokeObjectURL(url);
    }, undefined, (error) => {
        alert("Lỗi khi đọc file 3D! Vui lòng sử dụng file .gltf hoặc .glb chuẩn.");
    });
});

setTimeout(() => {
    document.getElementById('textureList').innerHTML = `<div class="empty">Thư viện đã sẵn sàng. Hãy bấm nút "＋ Add Gray MatCap (Auto)" ở cột phải để xem hiệu ứng khối phủ lên mô hình.</div>`;
}, 1000);

window.addEventListener('resize', () => {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
});

function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
