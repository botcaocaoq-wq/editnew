<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>editnew - Advanced Glitch & After Effects Motion FX Pro</title>

    <!-- Thư viện GIF -->
    <script src="https://cdn.jsdelivr.net/npm/gifshot@0.4.5/build/gifshot.min.js"></script>

    <!-- Thư viện WebM -->
    <script src="https://cdn.jsdelivr.net/npm/whammy@0.0.2/Whammy.js"></script>

    <style>
        body {
            background: #111;
            color: #fff;
            font-family: sans-serif;
            padding: 20px;
            margin: 0;
            display: flex;
            justify-content: center;
        }

        #app-container {
            display: flex;
            flex-direction: row;
            gap: 20px;
            width: 100%;
            max-width: 1350px;
            align-items: flex-start;
        }

        #left-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
            flex: 1;
        }

        #preview-window {
            background: #000;
            border: 2px solid #333;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            position: relative;
        }

        #videoCanvas {
            display: block;
            width: 960px;
            height: 540px;
            background: #1a1a1a;
            cursor: crosshair;
        }

        #top-controls {
            background: #222;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: space-between;
        }

        .global-slider {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        #right-panel {
            width: 340px;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 85vh;
            overflow-y: auto;
            box-sizing: border-box;
        }

        #right-panel::-webkit-scrollbar {
            width: 6px;
        }

        #right-panel::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 3px;
        }

        #right-panel::-webkit-scrollbar-thumb:hover {
            background: #666;
        }

        .accordion-item {
            border: 1px solid #333;
            border-radius: 4px;
            background: #252525;
            overflow: hidden;
        }

        .accordion-header {
            background: #2d2d2d;
            padding: 10px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            border-bottom: 1px solid #222;
        }

        .accordion-header:hover {
            background: #353535;
        }

        .accordion-content {
            padding: 10px;
            display: none;
            flex-direction: column;
            gap: 10px;
            background: #1a1a1a;
            max-height: 380px;
            overflow-y: auto;
        }

        .accordion-content::-webkit-scrollbar {
            width: 4px;
        }

        .accordion-content::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 2px;
        }

        .accordion-item.active .accordion-content {
            display: flex;
        }

        .control-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            font-size: 13px;
        }

        .control-row input[type="range"] {
            flex: 1;
        }

        .value-disp {
            min-width: 35px;
            text-align: right;
            color: #06b6d4;
            font-family: monospace;
        }

        button {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #444;
        }

        button.active {
            background: #2563eb !important;
            border-color: #3b82f6 !important;
        }

        .tool-section {
            display: flex;
            gap: 8px;
            margin-bottom: 5px;
            align-items: center;
        }

        .fx-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        #export-panel {
            background: #222;
            border: 1px solid #3b82f6;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .text-input {
            background: #333;
            border: 1px solid #555;
            color: white;
            padding: 5px;
            border-radius: 4px;
            width: 50px;
            text-align: center;
        }

        select {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 5px;
            border-radius: 4px;
        }

        .section-title {
            font-weight: bold;
            color: #ddd;
            margin-top: 3px;
        }

        .radio-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
        }

        .radio-grid label {
            font-size: 12px;
            background: #292929;
            padding: 5px;
            border-radius: 3px;
        }

        input[type="color"] {
            width: 45px;
            height: 28px;
            border: none;
            padding: 0;
            background: transparent;
        }

        #export-status {
            font-size: 12px;
            color: #06b6d4;
            margin-top: 5px;
        }

        @media (max-width: 1200px) {
            #app-container {
                flex-direction: column;
            }

            #right-panel {
                width: 100%;
                max-height: none;
            }

            #videoCanvas {
                width: 100%;
                height: auto;
            }
        }
    </style>
</head>

<body>

<div id="app-container">

    <!-- ========================= -->
    <!-- LEFT PANEL -->
    <!-- ========================= -->

    <div id="left-panel">

        <div id="top-controls">

            <div class="global-slider">

                <input
                    type="file"
                    id="image-upload"
                    accept="image/*"
                    style="display:none;"
                >

                <button
                    id="btn-upload"
                    style="background:#ea580c; font-weight:bold;"
                >
                    📁 Chọn ảnh từ thiết bị
                </button>

            </div>

            <div class="global-slider">

                <label
                    style="
                        cursor:pointer;
                        display:flex;
                        align-items:center;
                        gap:5px;
                        user-select:none;
                    "
                >
                    <input
                        type="checkbox"
                        id="toggle-greenscreen"
                    >

                    🟢 Kích hoạt phông xanh lót nền dưới
                </label>

            </div>

        </div>


        <!-- PREVIEW -->

        <div id="preview-window">

            <canvas
                id="videoCanvas"
                width="960"
                height="540"
            ></canvas>

        </div>


        <!-- TOOLS -->

        <div class="tool-section">

            <button
                id="btn-pin-mode"
                style="background:#ca8a04;"
            >
                📍 Ghim điểm neo
            </button>

            <button
                id="btn-mask-mode"
                style="background:#9333ea;"
            >
                🎨 Vẽ vùng xử lý (Brush)
            </button>

            <button
                id="btn-clear-all"
                style="background:#dc2626;"
            >
                ❌ Xóa dữ liệu vẽ
            </button>

            <div
                class="global-slider"
                style="margin-left:15px;"
            >

                <label>Cỡ cọ:</label>

                <input
                    type="range"
                    id="slider-brush-size"
                    min="5"
                    max="100"
                    value="30"
                >

            </div>

        </div>


        <!-- ========================= -->
        <!-- EXPORT -->
        <!-- ========================= -->

        <div id="export-panel">

            <div class="global-slider">

                <label>⏱️ Thời lượng video:</label>

                <input
                    type="number"
                    id="export-duration"
                    class="text-input"
                    min="1"
                    max="30"
                    value="3"
                >

                <span>giây</span>

            </div>


            <div class="global-slider">

                <label>🎛️ Định dạng xuất:</label>

                <select id="export-format">

                    <option value="webm">
                        Đoạn Video .WEBM chất lượng cao
                    </option>

                    <option value="gif">
                        Ảnh động .GIF
                    </option>

                </select>

            </div>


            <button
                id="btn-export-start"
                style="
                    background:#10b981;
                    border-color:#059669;
                    font-weight:bold;
                    flex:1;
                "
            >
                🎬 Bắt đầu xuất tệp tin
            </button>

        </div>

        <div id="export-status"></div>

    </div>


    <!-- ========================= -->
    <!-- RIGHT PANEL -->
    <!-- ========================= -->

    <div id="right-panel">


        <!-- ========================= -->
        <!-- DISTORTION -->
        <!-- ========================= -->

        <div class="accordion-item active">

            <div class="accordion-header">

                🌀 Distortion & Warp

                <span>▼</span>

            </div>

            <div class="accordion-content">

                <div class="control-row">

                    <label>Kích hoạt hiệu ứng:</label>

                    <input
                        type="checkbox"
                        id="chk-distort"
                        checked
                    >

                </div>


                <div class="control-row">

                    <label>Tốc độ chuyển động:</label>

                    <input
                        type="range"
                        id="distort-speed"
                        min="0.1"
                        max="5"
                        step="0.1"
                        value="1.0"
                    >

                </div>


                <div class="control-row">

                    <label>Cường độ bóp méo:</label>

                    <input
                        type="range"
                        id="distort-amount"
                        min="1"
                        max="100"
                        value="30"
                    >

                </div>


                <div class="fx-grid">

                    <button id="fx-none" class="active">
                        Gốc
                    </button>

                    <button id="fx-stretch">
                        Sợi tóc
                    </button>

                    <button id="fx-wave">
                        Gợn sóng
                    </button>

                    <button id="fx-wavewarp">
                        WaveWarp
                    </button>

                    <button id="fx-bend">
                        Uốn mềm
                    </button>

                    <button id="fx-zoom">
                        Zoom
                    </button>

                    <button id="fx-mirror">
                        Mirror
                    </button>

                    <button id="fx-fanwarp">
                        Quạt
                    </button>

                    <button id="fx-swirl">
                        Xoáy nước
                    </button>

                    <button id="fx-pinch">
                        Hút tâm
                    </button>

                    <button id="fx-tile">
                        Gạch lặp
                    </button>

                </div>

            </div>

        </div>


        <!-- ========================= -->
        <!-- BAD TV -->
        <!-- ========================= -->

        <div class="accordion-item">

            <div class="accordion-header">

                📺 Bad TV Glitch

                <span>▼</span>

            </div>

            <div class="accordion-content">

                <div class="control-row">

                    <label>Kích hoạt:</label>

                    <input
                        type="checkbox"
                        id="chk-badtv"
                    >

                </div>


                <div class="control-row">

                    <label>Thick Distort:</label>

                    <input
                        type="range"
                        id="slide-thick"
                        min="0.1"
                        max="5"
                        step="0.1"
                        value="1.7"
                    >

                    <span
                        class="value-disp"
                        id="val-thick"
                    >
                        1.70
                    </span>

                </div>


                <div class="control-row">

                    <label>Fine Distort:</label>

                    <input
                        type="range"
                        id="slide-fine"
                        min="0"
                        max="1"
                        step="0.01"
                        value="0.1"
                    >

                    <span
                        class="value-disp"
                        id="val-fine"
                    >
                        0.10
                    </span>

                </div>


                <div class="control-row">

                    <label>Roll Speed:</label>

                    <input
                        type="range"
                        id="slide-roll"
                        min="0"
                        max="5"
                        step="0.1"
                        value="1.0"
                    >

                    <span
                        class="value-disp"
                        id="val-roll"
                    >
                        1.00
                    </span>

                </div>

            </div>

        </div>


        <!-- ========================= -->
        <!-- BRIGHTNESS / CONTRAST -->
        <!-- ========================= -->

        <div class="accordion-item">

            <div class="accordion-header">

                🌓 Brightness & Contrast

                <span>▼</span>

            </div>

            <div class="accordion-content">

                <div class="control-row">

                    <label>Kích hoạt:</label>

                    <input
                        type="checkbox"
                        id="chk-bc"
                    >

                </div>


                <div class="control-row">

                    <label>Contrast:</label>

                    <input
                        type="range"
                        id="slide-contrast"
                        min="-1"
                        max="2"
                        step="0.01"
                        value="0.20"
                    >

                    <span
                        class="value-disp"
                        id="val-contrast"
                    >
                        0.20
                    </span>

                </div>


                <div class="control-row">

                    <label>Brightness:</label>

                    <input
                        type="range"
                        id="slide-brightness"
                        min="-255"
                        max="255"
                        step="1"
                        value="0"
                    >

                    <span
                        class="value-disp"
                        id="val-brightness"
                    >
                        0
                    </span>

                </div>

            </div>

        </div>


        <!-- ========================= -->
        <!-- AFTER EFFECTS SABER -->
        <!-- ========================= -->

        <div class="accordion-item">

            <div class="accordion-header">

                ⚡ After Effects FX (Saber)

                <span>▼</span>

            </div>

            <div class="accordion-content">

                <div class="control-row">

                    <label>Kích hoạt Saber Glow:</label>

                    <input
                        type="checkbox"
                        id="chk-saber"
                    >

                </div>


                <div class="control-row">

                    <label>Màu tia năng lượng:</label>

                    <input
                        type="color"
                        id="color-saber"
                        value="#00ffff"
                    >

                </div>


                <div class="control-row">

                    <label>
                        Độ nhòe (Glow Radius):
                    </label>

                    <input
                        type="range"
                        id="slide-saber-glow"
                        min="0"
                        max="100"

                    >

                </div>


                <div class="control-row">

                    <label>
                        Kích hoạt Lệch sắc Rìa:
                    </label>

                    <input
                        type="checkbox"
                        id="chk-chromatic"
                    >

                </div>


                <div class="control-row">

                    <label>
                        Độ phân tách RGB:
                    </label>

                    <input
                        type="range"

                    >

            </div>

        <!-- ========================= -->
        <!-- ALIGHT STYLIZE -->
        <!-- ========================= -->

        <div class="accordion-item">

            <div class="accordion-header">

                🎨 Alight Stylize FX

                <span>▼</span>

            </div>

            <div class="accordion-content">

                <div class="control-row">

                    <label>Kích hoạt bộ lọc:</label>

                    <input
                        type="checkbox"
                        id="chk-stylize"
                    >

                </div>


                <div class="radio-grid">

                    <label>
                        <input
                            type="radio"
                            name="rad-stylize"
                            value="pixelate"
                            checked
                        >
                        Pixelate (Lego)
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="rad-stylize"
                            value="polar"
                        >
                        Polar Pixelate
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="rad-stylize"
                            value="slices"
                        >
                        Slices (Cắt lát)
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="rad-stylize"
                            value="jitter"
                        >
                        Jitter (Nhiễu giật)
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="rad-stylize"
                            value="melt"
                        >
                        Melt (Tan chảy)
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="rad-stylize"
                            value="wobble"
                        >
                        Wobble (Lung lay)
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="rad-stylize"
                            value="shake"
                        >
                        Shake (Rung lắc)
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="rad-stylize"
                            value="edges"
                        >
                        Edges (Tìm viền)
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="rad-stylize"
                            value="solarize"
                        >
                        Solarize (Âm bản)
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="rad-stylize"
                            value="dotmatrix"
                        >
                        Dot Matrix (LED)
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="rad-stylize"
                            value="posterize"

                        Posterize (Phẳng màu)
