<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Texture Studio</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- =====================================================
     TOP BAR
===================================================== -->

<header class="topbar">

    <div class="logo">
        TEXTURE <span>STUDIO</span>
    </div>

    <div class="toolbar">

        <label class="button primary">
            ⬆ Upload Model

            <input
                id="modelInput"
                type="file"
                accept=".glb,.gltf"
                hidden
            >
        </label>

        <label class="button">
            ＋ Add Texture

            <input
                id="textureInput"
                type="file"
                accept="image/*"
                hidden
            >
        </label>

        <button
            id="selectButton"
            class="button active"
        >
            ⌖ Chọn bề mặt
        </button>

    </div>

</header>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="main">


    <!-- =================================================
         TEXTURE LIBRARY
    ================================================== -->

    <aside class="leftPanel">

        <div class="panelTitle">
            TEXTURE LIBRARY
        </div>


        <div class="searchBox">

            <input
                id="textureSearch"
                type="text"
                placeholder="Tìm texture..."
            >

        </div>


        <div
            id="textureLibrary"
            class="textureLibrary"
        >

            <div class="empty">

                Chưa có texture.

                <br><br>

                Nhấn
                <b>Add Texture</b>
                để thêm.

            </div>

        </div>

    </aside>


    <!-- =================================================
         3D VIEW
    ================================================== -->

    <section class="viewport">

        <div id="viewer"></div>


        <div
            id="status"
            class="status"
        >
            Chưa tải model
        </div>


        <div class="controlsHint">

            🖱 Kéo để xoay
            ·
            Cuộn để zoom
            ·
            Click model để chọn

        </div>

    </section>


    <!-- =================================================
         MATERIAL PANEL
    ================================================== -->

    <aside class="rightPanel">

        <div class="panelTitle">
            MATERIAL
        </div>


        <div
            id="selectedObject"
            class="selectedObject"
        >

            Chưa chọn bề mặt

        </div>


        <!-- SCALE -->

        <div class="property">

            <div class="propertyHeader">

                <span>
                    Texture Scale
                </span>

                <span id="scaleValue">
                    1.00
                </span>

            </div>


            <input
                id="scale"
                type="range"
                min="0.1"
                max="10"
                step="0.05"
                value="1"
            >

        </div>


        <!-- ROTATION -->

        <div class="property">

            <div class="propertyHeader">

                <span>
                    Rotation
                </span>

                <span id="rotationValue">
                    0°
                </span>

            </div>


            <input
                id="rotation"
                type="range"
                min="0"
                max="360"
                step="1"
                value="0"
            >

        </div>


        <!-- ROUGHNESS -->

        <div class="property">

            <div class="propertyHeader">

                <span>
                    Roughness
                </span>

                <span id="roughnessValue">
                    0.50
                </span>

            </div>


            <input
                id="roughness"
                type="range"
                min="0"
                max="1"
                step="0.01"
                value="0.5"
            >

        </div>


        <!-- METALLIC -->

        <div class="property">

            <div class="propertyHeader">

                <span>
                    Metallic
                </span>

                <span id="metallicValue">
                    0.00
                </span>

            </div>


            <input
                id="metallic"
                type="range"
                min="0"
                max="1"
                step="0.01"
                value="0"
            >

        </div>


        <button
            id="removeTexture"
            class="removeButton"
        >

            🗑 Xóa texture

        </button>

    </aside>

</main>


<!-- =====================================================
     THREE.JS
===================================================== -->

<script type="importmap">

{
    "imports": {

        "three":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

        "three/addons/":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"

    }
}

</script>


<!-- =====================================================
     EVERYTHING BELOW IS JAVASCRIPT
     Không cần index.js
===================================================== -->

<script type="module">

import * as THREE from "three";

import {
    OrbitControls
}
from "three/addons/controls/OrbitControls.js";

import {
    GLTFLoader
}
from "three/addons/loaders/GLTFLoader.js";


/* =====================================================
   ELEMENTS
===================================================== */

const viewer =
    document.getElementById("viewer");

const status =
    document.getElementById("status");

const library =
    document.getElementById("textureLibrary");

const selectedObject =
    document.getElementById("selectedObject");

const modelInput =
    document.getElementById("modelInput");

const textureInput =
    document.getElementById("textureInput");

const selectButton =
    document.getElementById("selectButton");

const searchInput =
    document.getElementById("textureSearch");

const scale =
    document.getElementById("scale");

const rotation =
    document.getElementById("rotation");

const roughness =
    document.getElementById("roughness");

const metallic =
    document.getElementById("metallic");


/* =====================================================
   THREE.JS SCENE
===================================================== */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x0c0e12);


const camera =
    new THREE.PerspectiveCamera(
        45,
        1,
        0.01,
        1000
    );


camera.position.set(
    3,
    2,
    5
);


const renderer =
    new THREE.WebGLRenderer({
        antialias: true
    });


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);


viewer.appendChild(
    renderer.domElement
);


/* =====================================================
   CAMERA
===================================================== */

const controls =
    new OrbitControls(
        camera,
        renderer.domElement
    );


controls.enableDamping = true;


/* =====================================================
   LIGHT
===================================================== */

const hemisphere =
    new THREE.HemisphereLight(
        0xffffff,
        0x252a34,
        2
    );


scene.add(hemisphere);


const directional =
    new THREE.DirectionalLight(
        0xffffff,
        3
    );


directional.position.set(
    4,
    6,
    4
);


scene.add(directional);


/* =====================================================
   GRID
===================================================== */

const grid =
    new THREE.GridHelper(
        10,
        20
    );


scene.add(grid);


/* =====================================================
   VARIABLES
===================================================== */

const loader =
    new GLTFLoader();


const raycaster =
    new THREE.Raycaster();


const mouse =
    new THREE.Vector2();


let model = null;

let selectedMesh = null;

let selectMode = true;

let textureList = [];


/* =====================================================
   RESIZE
===================================================== */

function resizeViewer() {

    const width =
        viewer.clientWidth;

    const height =
        viewer.clientHeight;


    camera.aspect =
        width / height;


    camera.updateProjectionMatrix();


    renderer.setSize(
        width,
        height,
        false
    );

}


window.addEventListener(
    "resize",
    resizeViewer
);


resizeViewer();


/* =====================================================
   UPLOAD MODEL
===================================================== */

modelInput.addEventListener(
    "change",
    event => {

        const file =
            event.target.files[0];

        if (!file)
            return;


        const url =
            URL.createObjectURL(file);


        status.textContent =
            "Đang tải model...";


        loader.load(

            url,

            gltf => {

                if (model) {

                    scene.remove(model);

                }


                model =
                    gltf.scene;


                model.traverse(
                    object => {

                        if (
                            object.isMesh
                        ) {

                            object.userData.originalMaterial =
                                object.material;

                        }

                    }
                );


                scene.add(model);


                centerModel(
                    model
                );


                selectedMesh =
                    null;


                selectedObject.textContent =
                    "Chưa chọn bề mặt";


                status.textContent =
                    "Model: " +
                    file.name;


                URL.revokeObjectURL(
                    url
                );

            },

            undefined,

            error => {

                console.error(error);

                status.textContent =
                    "Không thể đọc model.";

            }

        );

    }
);


/* =====================================================
   CENTER MODEL
===================================================== */

function centerModel(root) {

    const box =
        new THREE.Box3()
            .setFromObject(root);


    const size =
        box.getSize(
            new THREE.Vector3()
        );


    const center =
        box.getCenter(
            new THREE.Vector3()
        );


    const maxSize =
        Math.max(
            size.x,
            size.y,
            size.z
        );


    root.position.sub(
        center
    );


    camera.position.set(
        maxSize * 1.8,
        maxSize * 1.2,
        maxSize * 2.2
    );


    controls.target.set(
        0,
        0,
        0
    );


    controls.update();

}


/* =====================================================
   ADD TEXTURE
===================================================== */

textureInput.addEventListener(
    "change",
    event => {

        const file =
            event.target.files[0];

        if (!file)
            return;


        const url =
            URL.createObjectURL(file);


        textureList.push({

            name:
                file.name,

            url:
                url

        });


        renderTextureLibrary();


        textureInput.value = "";

    }
);


/* =====================================================
   TEXTURE LIBRARY
===================================================== */

function renderTextureLibrary() {

    const search =
        searchInput.value
            .toLowerCase();


    library.innerHTML = "";


    const filtered =
        textureList.filter(
            texture =>
                texture.name
                    .toLowerCase()
                    .includes(search)
        );


    if (
        filtered.length === 0
    ) {

        library.innerHTML = `

            <div class="empty">

                Không tìm thấy texture.

            </div>

        `;

        return;

    }


    filtered.forEach(
        texture => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "textureCard";


            card.innerHTML = `

                <img
                    src="${texture.url}"
                    class="texturePreview"
                >

                <div class="textureInfo">

                    <div class="textureName">
                        ${texture.name}
                    </div>

                    <div class="textureType">
                        IMAGE TEXTURE
                    </div>

                </div>

            `;


            card.addEventListener(
                "click",
                () => {

                    applyTexture(
                        texture
                    );

                }
            );


            library.appendChild(
                card
            );

        }
    );

}


/* =====================================================
   SEARCH
===================================================== */

searchInput.addEventListener(
    "input",
    renderTextureLibrary
);


/* =====================================================
   CLICK MODEL
===================================================== */

renderer.domElement.addEventListener(
    "pointerdown",
    event => {

        if (!selectMode)
            return;


        if (!model)
            return;


        const rect =
            renderer.domElement
                .getBoundingClientRect();


        mouse.x =
            (
                (
                    event.clientX -
                    rect.left
                )
                /
                rect.width
            ) * 2 - 1;


        mouse.y =
            -(
                (
                    event.clientY -
                    rect.top
                )
                /
                rect.height
            ) * 2 + 1;


        raycaster.setFromCamera(
            mouse,
            camera
        );


        const hits =
            raycaster.intersectObject(
                model,
                true
            );


        if (
            hits.length > 0 &&
            hits[0].object.isMesh
        ) {

            selectMesh(
                hits[0].object
            );

        }

    }
);


/* =====================================================
   SELECT MESH
===================================================== */

function selectMesh(mesh) {

    selectedMesh =
        mesh;


    selectedObject.textContent =
        mesh.name ||
        "Mesh không tên";


    status.textContent =
        "Đã chọn: " +
        (
            mesh.name ||
            "Mesh"
        );


    const material =
        mesh.material;


    if (!material)
        return;


    roughness.value =
        material.roughness ?? 0.5;


    metallic.value =
        material.metalness ?? 0;


    if (material.map) {

        scale.value =
            material.map.repeat.x;


        rotation.value =
            THREE.MathUtils.radToDeg(
                material.map.rotation
            );

    }


    updateLabels();

}


/* =====================================================
   APPLY TEXTURE
===================================================== */

function applyTexture(
    textureData
) {

    if (!selectedMesh) {

        status.textContent =
            "Hãy click vào phần model trước.";

        return;

    }


    const textureLoader =
        new THREE.TextureLoader();


    textureLoader.load(

        textureData.url,

        texture => {

            texture.wrapS =
                THREE.RepeatWrapping;


            texture.wrapT =
                THREE.RepeatWrapping;


            texture.colorSpace =
                THREE.SRGBColorSpace;


            texture.center.set(
                0.5,
                0.5
            );


            texture.repeat.set(
                Number(scale.value),
                Number(scale.value)
            );


            texture.rotation =
                THREE.MathUtils.degToRad(
                    Number(
                        rotation.value
                    )
                );


            const material =
                selectedMesh.material.clone();


            material.map =
                texture;


            material.roughness =
                Number(
                    roughness.value
                );


            material.metalness =
                Number(
                    metallic.value
                );


            material.needsUpdate =
                true;


            selectedMesh.material =
                material;


            status.textContent =
                "Đã gắn texture: " +
                textureData.name;

        }

    );

}


/* =====================================================
   MATERIAL CONTROLS
===================================================== */

function updateLabels() {

    document.getElementById(
        "scaleValue"
    ).textContent =
        Number(
            scale.value
        ).toFixed(2);


    document.getElementById(
        "rotationValue"
    ).textContent =
        Math.round(
            rotation.value
        ) + "°";


    document.getElementById(
        "roughnessValue"
    ).textContent =
        Number(
            roughness.value
        ).toFixed(2);


    document.getElementById(
        "metallicValue"
    ).textContent =
        Number(
            metallic.value
        ).toFixed(2);

}


[
    scale,
    rotation,
    roughness,
    metallic

].forEach(
    input => {

        input.addEventListener(
            "input",
            () => {

                updateLabels();


                if (!selectedMesh)
                    return;


                const material =
                    selectedMesh.material;


                if (
                    material.map
                ) {

                    material.map.repeat.set(

                        Number(
                            scale.value
                        ),

                        Number(
                            scale.value
                        )

                    );


                    material.map.rotation =
                        THREE.MathUtils.degToRad(
                            Number(
                                rotation.value
                            )
                        );


                    material.map.needsUpdate =
                        true;

                }


                material.roughness =
                    Number(
                        roughness.value
                    );


                material.metalness =
                    Number(
                        metallic.value
                    );

            }
        );

    }
);


/* =====================================================
   REMOVE TEXTURE
===================================================== */

document
    .getElementById(
        "removeTexture"
    )
    .addEventListener(
        "click",
        () => {

            if (!selectedMesh)
                return;


            const material =
                selectedMesh.material;


            if (
                material &&
                material.map
            ) {

                material.map.dispose();

                material.map = null;

                material.needsUpdate =
                    true;

            }


            status.textContent =
                "Đã xóa texture.";

        }
    );


/* =====================================================
   SELECT MODE
===================================================== */

selectButton.addEventListener(
    "click",
    () => {

        selectMode =
            !selectMode;


        selectButton.classList.toggle(
            "active",
            selectMode
        );


        selectButton.textContent =
            selectMode
                ? "⌖ Chọn bề mặt"
                : "✋ Xoay / xem";

    }
);


/* =====================================================
   RENDER
===================================================== */

function animate() {

    requestAnimationFrame(
        animate
    );


    controls.update();


    renderer.render(
        scene,
        camera
    );

}


updateLabels();

animate();

</script>

</body>
</html>
