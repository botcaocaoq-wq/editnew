<script type="module">

import * as THREE from 'three';

import {
  OrbitControls
} from 'three/addons/controls/OrbitControls.js';

import {
  OBJExporter
} from 'three/addons/exporters/OBJExporter.js';

import {
  GLTFExporter
} from 'three/addons/exporters/GLTFExporter.js';


/* =========================================================
   HELPERS
========================================================= */

const $ = id => document.getElementById(id);

function clamp(v,min,max){
  return Math.max(min,Math.min(max,v));
}

function lerp(a,b,t){
  return a+(b-a)*t;
}


/* =========================================================
   THREE
========================================================= */

const renderer =
  new THREE.WebGLRenderer({
    antialias:true,
    alpha:true,
    preserveDrawingBuffer:true
  });

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio,2)
);

renderer.outputColorSpace =
  THREE.SRGBColorSpace;

renderer.setClearColor(
  0x000000,
  0
);

$("viewer").appendChild(
  renderer.domElement
);


const scene =
  new THREE.Scene();


const camera =
  new THREE.PerspectiveCamera(
    45,
    1,
    .1,
    200
  );

camera.position.set(
  5,
  3.5,
  6
);


const controls =
  new OrbitControls(
    camera,
    renderer.domElement
  );

controls.enableDamping = true;

controls.target.set(
  0,
  1,
  0
);


/* LIGHT */

scene.add(
  new THREE.HemisphereLight(
    0xffffff,
    0x303844,
    2
  )
);


const keyLight =
  new THREE.DirectionalLight(
    0xffffff,
    3
  );

keyLight.position.set(
  4,
  6,
  5
);

scene.add(keyLight);


/* GRID */

const grid =
  new THREE.GridHelper(
    10,
    10,
    0x28323e,
    0x18202a
  );

scene.add(grid);


/* =========================================================
   STATE
========================================================= */

const state = {

  parts:[],

  selectedPart:null,

  selectedEffect:null,

  nextPart:1,

  nextEffect:1,

  playing:false,

  time:0,

  duration:2

};


/* =========================================================
   PART
========================================================= */

function makePart(){

  const material =
    new THREE.MeshStandardMaterial({

      color:0x5b6878,

      roughness:.5,

      metalness:.15

    });


  const obj =
    new THREE.Mesh(

      new THREE.BoxGeometry(
        2,
        2,
        .4
      ),

      material

    );


  obj.position.y = 1;

  obj.userData.type =
    "part";


  scene.add(obj);


  const p = {

    id:
      "part"+
      state.nextPart++,

    name:"Part",

    object:obj,

    size:{
      x:2,
      y:2,
      z:.4
    },

    visible:true,

    effects:[]

  };


  state.parts.push(p);

  selectPart(p);

  renderTree();

  return p;

}


/* =========================================================
   EFFECT
========================================================= */

function makeEffect(){

  const p =
    state.selectedPart ||
    state.parts[0] ||
    makePart();


  const e = {

    id:
      "effect"+
      state.nextEffect++,

    name:"Effect",

    partId:p.id,

    textureData:null,

    enabled:true,

    rate:50,

    lifeMin:1,

    lifeMax:2,

    speedMin:3,

    speedMax:6,

    color:"#ffffff",

    emission:1,

    rotMin:0,

    rotMax:360,

    rotSpeed:0,

    spreadX:20,

    spreadY:20,

    direction:"Front",

    shape:"Box",

    locked:false,

    offset:{
      x:0,
      y:0,
      z:.25
    },

    particles:[],

    runtime:0,

    keys:[]

  };


  p.effects.push(e);

  state.selectedPart=p;

  state.selectedEffect=e;


  rebuildEffectVisual(e);

  renderTree();

  renderLibrary();

  syncInspector();

  return e;

}


/* =========================================================
   PARTICLE TEXTURE
========================================================= */

const textureLoader =
  new THREE.TextureLoader();


function makeParticleTexture(data){

  const tex =
    textureLoader.load(data);

  tex.colorSpace =
    THREE.SRGBColorSpace;

  tex.needsUpdate=true;

  return tex;

}


/* =========================================================
   CREATE PARTICLES
========================================================= */

function createParticlesVisual(e){

  e.particles.forEach(
    p => scene.remove(p)
  );

  e.particles=[];


  if(
    !e.textureData ||
    !e.enabled
  )
    return;


  /*
    Runtime particle count.
    Giới hạn để preview không lag.
  */

  const count =
    Math.min(
      180,
      Math.max(
        10,
        Math.floor(e.rate*.7)
      )
    );


  const tex =
    makeParticleTexture(
      e.textureData
    );


  for(
    let i=0;
    i<count;
    i++
  ){

    const material =
      new THREE.SpriteMaterial({

        map:tex,

        color:e.color,

        transparent:true,

        opacity:.9,

        depthWrite:false,

        blending:
          THREE.AdditiveBlending

      });


    const sprite =
      new THREE.Sprite(
        material
      );


    sprite.scale.set(
      .3,
      .3,
      1
    );


    sprite.userData.particleIndex=i;


    e.particles.push(sprite);

    scene.add(sprite);

  }

}


function rebuildEffectVisual(e){

  createParticlesVisual(e);

}


/* =========================================================
   PARTICLE DIRECTION
========================================================= */

function getDirection(e){

  const dir =
    new THREE.Vector3(
      0,
      1,
      0
    );


  if(e.direction==="Front")
    dir.set(0,0,1);

  if(e.direction==="Back")
    dir.set(0,0,-1);

  if(e.direction==="Top")
    dir.set(0,1,0);

  if(e.direction==="Bottom")
    dir.set(0,-1,0);

  if(e.direction==="Left")
    dir.set(-1,0,0);

  if(e.direction==="Right")
    dir.set(1,0,0);


  return dir;

}


/* =========================================================
   PARTICLE POSITION CALCULATION
========================================================= */

function calculateParticleTransform(
  e,
  particleIndex,
  absoluteTime
){

  const p =
    state.parts.find(
      x => x.id===e.partId
    );


  if(!p){

    return {
      position:new THREE.Vector3(),
      scale:1,
      rotation:0,
      opacity:0
    };

  }


  const base =
    p.object.position;


  const life =
    Math.max(
      .05,
      lerp(
        e.lifeMin,
        e.lifeMax,
        (particleIndex%17)/17
      )
    );


  /*
    Stable particle seed.
    Giúp preview và export gần giống nhau.
  */

  const seed =
    particleIndex*17.123;


  const age =
    (
      seed+
      absoluteTime*
      Math.max(
        .01,
        lerp(
          e.speedMin,
          e.speedMax,
          (particleIndex%10)/10
        )
      )
    )%life;


  const t =
    age/life;


  const dir =
    getDirection(e);


  const sx =
    Math.tan(
      THREE.MathUtils.degToRad(
        e.spreadX
      )
    );


  const sy =
    Math.tan(
      THREE.MathUtils.degToRad(
        e.spreadY
      )
    );


  const speed =
    THREE.MathUtils.lerp(
      e.speedMin,
      e.speedMax,
      (particleIndex%10)/10
    );


  const vx =
    dir.x*speed+
    Math.sin(
      particleIndex*13.1
    )*sx;


  const vy =
    dir.y*speed+
    Math.cos(
      particleIndex*7.3
    )*sy;


  const vz =
    dir.z*speed+
    Math.sin(
      particleIndex*9.4
    )*sx;


  const position =
    new THREE.Vector3(

      base.x+
      e.offset.x+
      vx*t,

      base.y+
      e.offset.y+
      vy*t,

      base.z+
      e.offset.z+
      vz*t

    );


  const fade =
    1-t;


  const size =
    .12+
    .65*
    Math.sin(
      t*Math.PI
    );


  const rotation =
    THREE.MathUtils.degToRad(

      e.rotMin+
      (e.rotMax-e.rotMin)*t

    )+
    e.rotSpeed*
    absoluteTime;


  return {

    position,

    scale:Math.max(
      .001,
      size
    ),

    rotation,

    opacity:Math.max(
      0,
      fade
    )

  };

}


/* =========================================================
   PARTICLE SIMULATION
========================================================= */

function simulateEffect(e,dt){

  if(
    !e.enabled ||
    !e.particles.length
  )
    return;


  e.runtime += dt;


  e.particles.forEach(
    (sprite,i)=>{

      const tr =
        calculateParticleTransform(
          e,
          i,
          e.runtime
        );


      sprite.position.copy(
        tr.position
      );


      sprite.scale.setScalar(
        tr.scale
      );


      sprite.material.opacity =
        tr.opacity;


      sprite.material.color.set(
        e.color
      );


      sprite.material.rotation =
        tr.rotation;

    }
  );

}


/* =========================================================
   SELECTION
========================================================= */

function selectPart(p){

  state.selectedPart=p;

  state.selectedEffect=null;


  state.parts.forEach(
    part=>{

      if(
        part.object.material &&
        part.object.material.emissive
      ){

        part.object.material.emissive.setHex(

          part===p
          ?0x1b3555
          :0x000000

        );

      }

    }
  );


  syncInspector();

  renderTree();

}


function selectEffect(e){

  state.selectedEffect=e;


  state.selectedPart =
    state.parts.find(
      p=>p.id===e.partId
    )||null;


  syncInspector();

  renderTree();

  renderLibrary();

  renderTimeline();

}


/* =========================================================
   DELETE
========================================================= */

function removeSelected(){

  if(state.selectedEffect){

    const p =
      state.parts.find(
        x =>
          x.id===
          state.selectedEffect.partId
      );


    if(p){

      const i =
        p.effects.indexOf(
          state.selectedEffect
        );

      if(i>=0)
        p.effects.splice(i,1);

    }


    state.selectedEffect.particles
      .forEach(
        x=>scene.remove(x)
      );


    state.selectedEffect=null;


    syncInspector();

    renderTree();

    renderLibrary();

    renderTimeline();

    return;

  }


  if(state.selectedPart){

    const p =
      state.selectedPart;


    p.effects.forEach(
      e=>
        e.particles.forEach(
          x=>scene.remove(x)
        )
    );


    scene.remove(
      p.object
    );


    const i =
      state.parts.indexOf(p);


    if(i>=0)
      state.parts.splice(i,1);


    state.selectedPart=null;

    state.selectedEffect=null;


    syncInspector();

    renderTree();

    renderLibrary();

    renderTimeline();

  }

}


/* =========================================================
   TREE
========================================================= */

function renderTree(){

  const root =
    $("sceneTree");

  root.innerHTML="";


  if(!state.parts.length){

    root.innerHTML =
      '<div class="empty">Chưa có Part.<br>Bấm ＋ Part.</div>';

    return;

  }


  state.parts.forEach(
    p=>{

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "treeRow"+
        (
          p===state.selectedPart &&
          !state.selectedEffect
          ?" active":""
        );


      row.innerHTML =
        `
        <span class="treeArrow">▼</span>
        <span class="treeIcon">■</span>
        <span>${p.name}</span>
        `;


      row.onclick =
        ()=>selectPart(p);


      root.appendChild(row);


      const child =
        document.createElement(
          "div"
        );


      child.className =
        "treeChildren";


      p.effects.forEach(
        e=>{

          const er =
            document.createElement(
              "div"
            );


          er.className =
            "treeRow"+
            (
              e===state.selectedEffect
              ?" active":""
            );


          er.innerHTML =
            `
            <span class="treeArrow">└</span>
            <span class="treeIcon">✦</span>
            <span>${e.name}</span>
            `;


          er.onclick =
            ev=>{

              ev.stopPropagation();

              selectEffect(e);

            };


          child.appendChild(er);

        }
      );


      root.appendChild(child);

    }
  );

}


/* =========================================================
   LIBRARY
========================================================= */

function placeholder(){

  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width=64;

  canvas.height=64;


  const c =
    canvas.getContext("2d");


  c.fillStyle="#0d131b";

  c.fillRect(
    0,
    0,
    64,
    64
  );


  c.fillStyle="#6aa0ff";


  c.beginPath();

  c.arc(
    32,
    32,
    15,
    0,
    Math.PI*2
  );

  c.fill();


  return canvas.toDataURL();

}


function renderLibrary(){

  const box =
    $("library");

  box.innerHTML="";


  const all =
    state.parts.flatMap(
      p=>p.effects
    );


  if(!all.length){

    box.innerHTML =
      '<div class="empty">Chưa có Effect.</div>';

    return;

  }


  all.forEach(
    e=>{

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "effectCard"+
        (
          e===state.selectedEffect
          ?" active":""
        );


      const img =
        document.createElement(
          "img"
        );


      img.className="thumb";


      img.src =
        e.textureData||
        placeholder();


      const meta =
        document.createElement(
          "div"
        );


      meta.className="effectMeta";


      meta.innerHTML =
        `
        <div class="effectName">
          ${e.name}
        </div>

        <div class="effectSub">
          Rate ${e.rate} · ${e.shape}
        </div>
        `;


      card.append(
        img,
        meta
      );


      card.onclick =
        ()=>selectEffect(e);


      box.appendChild(card);

    }
  );

}


/* =========================================================
   INSPECTOR
========================================================= */

function setVal(id,value){

  $(id).value=value;

}


function syncInspector(){

  const p =
    state.selectedPart;

  const e =
    state.selectedEffect;


  $("selectionTitle")
    .textContent =
      (
        e||p
      )
      ?
      (
        e?
        e.name:
        p.name
      ).toUpperCase()
      :
      "NONE";


  $("partProps").hidden =
    !p||!!e;


  $("effectProps").hidden =
    !e;


  if(p&&!e){

    setVal(
      "partX",
      p.size.x
    );

    setVal(
      "partY",
      p.size.y
    );

    setVal(
      "partZ",
      p.size.z
    );


    $("partXV").textContent =
      p.size.x.toFixed(1);

    $("partYV").textContent =
      p.size.y.toFixed(1);

    $("partZV").textContent =
      p.size.z.toFixed(1);


    $("partVisible").checked =
      p.visible;

  }


  if(!e)
    return;


  setVal(
    "duration",
    state.duration
  );


  $("durationV")
    .textContent =
      state.duration.toFixed(1)+"s";


  const fields=[

    ["rate","rate",v=>Math.round(v)],

    ["lifeMin","lifeMin",v=>v.toFixed(1)],

    ["lifeMax","lifeMax",v=>v.toFixed(1)],

    ["speedMin","speedMin",v=>v.toFixed(1)],

    ["speedMax","speedMax",v=>v.toFixed(1)],

    ["rotMin","rotMin",v=>Math.round(v)+"°"],

    ["rotMax","rotMax",v=>Math.round(v)+"°"],

    ["rotSpeed","rotSpeed",v=>v.toFixed(1)],

    ["spreadX","spreadX",v=>Math.round(v)+"°"],

    ["spreadY","spreadY",v=>Math.round(v)+"°"],

    ["emission","emission",v=>v.toFixed(2)]

  ];


  fields.forEach(
    ([id,key,fmt])=>{

      setVal(
        id,
        e[key]
      );


      $(id+"V")
        .textContent =
          fmt(e[key]);

    }
  );


  setVal(
    "offX",
    e.offset.x
  );

  setVal(
    "offY",
    e.offset.y
  );

  setVal(
    "offZ",
    e.offset.z
  );


  $("offXV").textContent =
    e.offset.x.toFixed(2);

  $("offYV").textContent =
    e.offset.y.toFixed(2);

  $("offZV").textContent =
    e.offset.z.toFixed(2);


  $("enabled").checked =
    e.enabled;


  $("locked").checked =
    e.locked;


  $("color").value =
    e.color;


  $("colorV").textContent =
    e.color;


  $("direction").value =
    e.direction;


  $("shape").value =
    e.shape;


  if($("assetStatus")){

    $("assetStatus").textContent =
      e.textureData
      ?"Texture loaded"
      :"No texture";

  }

}


/* =========================================================
   RANGE BIND
========================================================= */

function bind(
  id,
  callback,
  display
){

  const el=$(id);

  if(!el)return;


  el.addEventListener(
    "input",
    ()=>{

      const v =
        Number(
          el.value
        );


      callback(v);


      if(display){

        const out =
          $(id+"V");

        if(out)
          out.textContent =
            display(v);

      }

    }
  );

}


bind(
  "rate",
  v=>{

    if(state.selectedEffect){

      state.selectedEffect.rate=v;

      rebuildEffectVisual(
        state.selectedEffect
      );

    }

  },
  v=>Math.round(v)
);


bind(
  "lifeMin",
  v=>{

    if(state.selectedEffect)
      state.selectedEffect.lifeMin=v;

  },
  v=>v.toFixed(1)
);


bind(
  "lifeMax",
  v=>{

    if(state.selectedEffect)
      state.selectedEffect.lifeMax=v;

  },
  v=>v.toFixed(1)
);


bind(
  "speedMin",
  v=>{

    if(state.selectedEffect)
      state.selectedEffect.speedMin=v;

  },
  v=>v.toFixed(1)
);


bind(
  "speedMax",
  v=>{

    if(state.selectedEffect)
      state.selectedEffect.speedMax=v;

  },
  v=>v.toFixed(1)
);


bind(
  "rotMin",
  v=>{

    if(state.selectedEffect)
      state.selectedEffect.rotMin=v;

  },
  v=>Math.round(v)+"°"
);


bind(
  "rotMax",
  v=>{

    if(state.selectedEffect)
      state.selectedEffect.rotMax=v;

  },
  v=>Math.round(v)+"°"
);


bind(
  "rotSpeed",
  v=>{

    if(state.selectedEffect)
      state.selectedEffect.rotSpeed=v;

  },
  v=>v.toFixed(1)
);


bind(
  "spreadX",
  v=>{

    if(state.selectedEffect)
      state.selectedEffect.spreadX=v;

  },
  v=>Math.round(v)+"°"
);


bind(
  "spreadY",
  v=>{

    if(state.selectedEffect)
      state.selectedEffect.spreadY=v;

  },
  v=>Math.round(v)+"°"
);


bind(
  "emission",
  v=>{

    if(state.selectedEffect)
      state.selectedEffect.emission=v;

  },
  v=>v.toFixed(2)
);


/* =========================================================
   OFFSET
========================================================= */

bind(
  "offX",
  v=>{

    if(state.selectedEffect)
      state.selectedEffect.offset.x=v;

  },
  v=>v.toFixed(2)
);


bind(
  "offY",
  v=>{

    if(state.selectedEffect)
      state.selectedEffect.offset.y=v;

  },
  v=>v.toFixed(2)
);


bind(
  "offZ",
  v=>{

    if(state.selectedEffect)
      state.selectedEffect.offset.z=v;

  },
  v=>v.toFixed(2)
);


/* =========================================================
   PART PROPERTIES
========================================================= */

$("partX").oninput=()=>{

  const p=
    state.selectedPart;

  if(!p)return;


  p.size.x =
    Number(
      $("partX").value
    );


  p.object.scale.x =
    p.size.x/2;


  $("partXV").textContent =
    p.size.x.toFixed(1);

};


$("partY").oninput=()=>{

  const p=
    state.selectedPart;

  if(!p)return;


  p.size.y =
    Number(
      $("partY").value
    );


  p.object.scale.y =
    p.size.y/2;


  p.object.position.y =
    p.size.y/2;


  $("partYV").textContent =
    p.size.y.toFixed(1);

};


$("partZ").oninput=()=>{

  const p=
    state.selectedPart;

  if(!p)return;


  p.size.z =
    Number(
      $("partZ").value
    );


  p.object.scale.z =
    p.size.z/.4;


  $("partZV").textContent =
    p.size.z.toFixed(1);

};


$("partVisible").onchange=()=>{

  const p=
    state.selectedPart;

  if(!p)return;


  p.visible =
    $("partVisible").checked;


  p.object.visible =
    p.visible;

};


/* =========================================================
   OTHER EFFECT SETTINGS
========================================================= */

$("enabled").onchange=()=>{

  const e=
    state.selectedEffect;

  if(!e)return;


  e.enabled =
    $("enabled").checked;


  rebuildEffectVisual(e);

};


$("locked").onchange=()=>{

  if(state.selectedEffect)
    state.selectedEffect.locked =
      $("locked").checked;

};


$("direction").onchange=()=>{

  if(state.selectedEffect)
    state.selectedEffect.direction =
      $("direction").value;

};


$("shape").onchange=()=>{

  if(state.selectedEffect)
    state.selectedEffect.shape =
      $("shape").value;

};


$("color").oninput=()=>{

  const e=
    state.selectedEffect;

  if(!e)return;


  e.color =
    $("color").value;


  $("colorV").textContent =
    e.color;

};


/* =========================================================
   DURATION
========================================================= */

$("duration").oninput=()=>{

  state.duration =
    Number(
      $("duration").value
    );


  $("durationV")
    .textContent =
      state.duration.toFixed(1)+"s";


  state.time =
    clamp(
      state.time,
      0,
      state.duration
    );


  renderTimeline();

  updateTimeline();

};


/* =========================================================
   TIMELINE
========================================================= */

function updateTimeline(){

  const percent =
    state.time/
    Math.max(
      .001,
      state.duration
    );


  $("timelineLine")
    .style.left =
      clamp(
        percent*100,
        0,
        100
      )+"%";


  $("currentTime")

        key.type+

        key.time.toFixed(2)+

      div.onclick=

          ev.stopPropagation();

          state.time=
            key.time;

          updateTimeline();

/* =========================================================
   EXPORT HELPERS
========================================================= */

/*
  Chuyển HEX thành THREE.Color
*/

function colorToNumber(hex){

  return new THREE.Color(hex);

}


/*
  Tạo texture material cho GLB
*/

function createExportMaterial(e){

  let map=null;


  if(e.textureData){

    map =
      textureLoader.load(
        e.textureData
      );

    map.colorSpace =
      THREE.SRGBColorSpace;

    map.needsUpdate=true;

  }


  const material =
    new THREE.MeshBasicMaterial({

      map,

      color:
        colorToNumber(
          e.color
        ),

      transparent:true,

      opacity:1,

      side:
        THREE.DoubleSide,

      depthWrite:false,

      alphaTest:.001

    });


  /*
    Emission được mô phỏng bằng màu sáng.
    GLTF/Blender sẽ vẫn nhận material.
  */

  if(e.emission>1){

    material.color.multiplyScalar(
      Math.min(
        2,
        e.emission
      )
    );

  }


  return material;

}


/* =========================================================
   EXPORT PARTICLE MESH
========================================================= */

function createExportParticle(
  e,
  particleIndex,
  material
){

  /*
    PlaneGeometry thay Sprite.

    Sprite không phải geometry chuẩn GLTF.
    PlaneGeometry thì Blender đọc được.
  */

  const geometry =
    new THREE.PlaneGeometry(
      1,
      1
    );


  const mesh =
    new THREE.Mesh(
      geometry,
      material.clone()
    );


  mesh.name =
    e.name+
    "_Particle_"+
    particleIndex;


  /*
    Cho plane hướng về camera mặc định.
  */

  mesh.rotation.x=0;


  return mesh;

}


/* =========================================================
   APPLY EFFECT KEYFRAMES
========================================================= */

function getEffectKeyValue(
  e,
  time
){

  if(!e.keys || !e.keys.length){

    return {

      position:{
        x:e.offset.x,
        y:e.offset.y,
        z:e.offset.z
      },

      rotation:{
        x:0,
        y:0,
        z:0
      },

      scale:1,

      opacity:1

    };

  }


  /*
    Tìm key gần nhất trước/sau.
  */

  let before=null;

  let after=null;


  for(const key of e.keys){

    if(key.time<=time)
      before=key;

    if(key.time>=time){

      after=key;

      break;

    }

  }


  if(!before)
    before=e.keys[0];

  if(!after)
    after=e.keys[e.keys.length-1];


  if(before===after){

    return {

      position:
        {...before.position},

      rotation:
        {...before.rotation},

      scale:
        before.scale,

      opacity:
        before.opacity

    };

  }


  const span =
    Math.max(
      .0001,
      after.time-before.time
    );


  const t =
    clamp(
      (time-before.time)/span,
      0,
      1
    );


  return {

    position:{

      x:lerp(
        before.position.x,
        after.position.x,
        t
      ),

      y:lerp(
        before.position.y,
        after.position.y,
        t
      ),

      z:lerp(
        before.position.z,
        after.position.z,
        t
      )

    },

    rotation:{

      x:lerp(
        before.rotation.x,
        after.rotation.x,
        t
      ),

      y:lerp(
        before.rotation.y,
        after.rotation.y,
        t
      ),

      z:lerp(
        before.rotation.z,
        after.rotation.z,
        t
      )

    },

    scale:
      lerp(
        before.scale,
        after.scale,
        t
      ),

    opacity:
      lerp(
        before.opacity,
        after.opacity,
        t
      )

  };

}


/* =========================================================
   BAKE PARTICLE ANIMATION
========================================================= */

function bakeEffectToGLTF(
  e,
  group,
  fps=24
){

  if(
    !e.enabled ||
    !e.textureData
  )
    return;


  /*
    Giới hạn export particle.

    Preview có thể 180.
    GLB dùng tối đa 80 để tránh file quá nặng.
  */

  const count =
    Math.min(
      80,
      Math.max(
        10,
        Math.floor(e.rate*.45)
      )
    );


  const material =
    createExportMaterial(e);


  const particleMeshes=[];


  for(
    let i=0;
    i<count;
    i++
  ){

    const mesh =
      createExportParticle(
        e,
        i,
        material
      );


    group.add(mesh);

    particleMeshes.push(mesh);

  }


  /*
    Số frame.

    Ví dụ:
    2 giây × 24fps = 48 frames.
  */

  const frameCount =
    Math.max(
      2,
      Math.ceil(
        state.duration*fps
      )
    );


  /*
    AnimationClip sẽ chứa
    Position + Quaternion + Scale.
  */

  const tracks=[];


  for(
    let i=0;
    i<particleMeshes.length;
    i++
  ){

    const mesh =
      particleMeshes[i];


    const times=[];

    const positions=[];

    const quaternions=[];

    const scales=[];


    for(
      let frame=0;
      frame<=frameCount;
      frame++
    ){

      const time =
        Math.min(
          state.duration,
          frame/fps
        );


      const tr =
        calculateParticleTransform(
          e,
          i,
          time
        );


      const effectKey =
        getEffectKeyValue(
          e,
          time
        );


      /*
        Particle position
        + Effect Position keyframe.
      */

      const px =
        tr.position.x+
        effectKey.position.x;


      const py =
        tr.position.y+
        effectKey.position.y;


      const pz =
        tr.position.z+
        effectKey.position.z;


      times.push(time);


      positions.push(
        px,
        py,
        pz
      );


      /*
        Rotation particle.
      */

      const q =
        new THREE.Quaternion();


      q.setFromEuler(

        new THREE.Euler(
          0,
          0,
          tr.rotation
        )

      );


      /*
        Effect Rotation.
      */

      const effectQ =
        new THREE.Quaternion();


      effectQ.setFromEuler(

        new THREE.Euler(

          THREE.MathUtils.degToRad(
            effectKey.rotation.x
          ),

          THREE.MathUtils.degToRad(
            effectKey.rotation.y
          ),

          THREE.MathUtils.degToRad(
            effectKey.rotation.z
          )

        )

      );


      q.multiply(effectQ);


      quaternions.push(
        q.x,
        q.y,
        q.z,
        q.w
      );


      const finalScale =
        tr.scale*
        Math.max(
          .001,
          effectKey.scale
        );


      scales.push(
        finalScale,
        finalScale,
        finalScale
      );

    }


    tracks.push(

      new THREE.VectorKeyframeTrack(
        mesh.name+
        ".position",
        times,
        positions
      )

    );


    tracks.push(

      new THREE.QuaternionKeyframeTrack(
        mesh.name+
        ".quaternion",
        times,
        quaternions
      )

    );


    tracks.push(

      new THREE.VectorKeyframeTrack(
        mesh.name+
        ".scale",
        times,
        scales
      )

    );

  }


  /*
    Opacity không được export ổn định
    dưới dạng material track giữa các
    Blender/GLTF importer.

    Vì vậy opacity được bake vào scale:
    particle nhỏ dần về 0 khi fade.
  */

  const clip =
    new THREE.AnimationClip(
      e.name+
      "_Animation",
      state.duration,
      tracks
    );


  group.animations =
    group.animations||[];


  group.animations.push(
    clip
  );


  /*
    Đặt animation name rõ ràng.
  */

  clip.name =
    e.name+
    "_Animation";

}


/* =========================================================
   EXPORT COMPLETE EFFECT PROJECT
========================================================= */

function buildExportScene(){

  const exportScene =
    new THREE.Scene();


  exportScene.name =
    "EffectProject";


  /*
    Không export grid/light.
    Chỉ export object cần thiết.
  */


  state.parts.forEach(
    p=>{

      /*
        PART
      */

      const part =
        p.object.clone(true);


      part.name =
        p.name+
        "_Part";


      part.position.copy(
        p.object.position
      );


      part.rotation.copy(
        p.object.rotation
      );


      part.scale.copy(
        p.object.scale
      );


      part.visible =
        p.visible;


      exportScene.add(
        part
      );


      /*
        EFFECTS
      */

      p.effects.forEach(
        e=>{

          bakeEffectToGLTF(
            e,
            exportScene,
            24
          );

        }
      );

    }
  );


  return exportScene;

}


/* =========================================================
   GLB EXPORT
========================================================= */

async function exportGLB(){

  if(!state.parts.length){

    alert(
      "Chưa có Part để export."
    );

    return;

  }


  const exportScene =
    buildExportScene();


  const exporter =
    new GLTFExporter();


  try{

    const result =
      await new Promise(
        (resolve,reject)=>{

          exporter.parse(

            exportScene,

            resolve,

            reject,

            {

              binary:true,

              animations:
                exportScene.animations||[],

              trs:true,

              onlyVisible:false,

              includeCustomExtensions:true

            }

          );

        }
      );


    const blob =
      new Blob(
        [result],
        {
          type:
            "model/gltf-binary"
        }
      );


    const url =
      URL.createObjectURL(
        blob
      );


    const a =
      document.createElement(
        "a"
      );


    a.href=url;

    a.download =
      "effect-project-ANIMATED.glb";


    document.body.appendChild(a);

    a.click();

    a.remove();


    setTimeout(
      ()=>{
        URL.revokeObjectURL(url);
      },
      3000
    );


    console.log(
      "GLB exported with animations:",
      exportScene.animations
    );


    alert(
      "Đã export GLB có Effect + Animation.\n\n"+
      "Mở Blender → File → Import → glTF 2.0 (.glb/.gltf).\n"+
      "Animation nằm trong Dope Sheet / Action."
    );

  }
  catch(error){

    console.error(
      "GLB EXPORT ERROR:",
      error
    );


    alert(
      "Không thể export GLB.\n"+
      "Mở F12 → Console để xem lỗi."
    );

  }

}

/* =========================================================
   JSON LOAD
========================================================= */

$("loadEffect").onclick =
  ()=>$("jsonInput").click();


$("jsonInput").onchange =
  ev=>{

    const file =
      ev.target.files[0];

    if(!file)return;


    const reader =
      new FileReader();


    reader.onload=()=>{

      try{

        const data =
          JSON.parse(
            reader.result
          );


        /*
          CLEAR
        */

        state.parts.forEach(
          p=>{

            p.effects.forEach(
              e=>
                e.particles.forEach(
                  x=>
                    scene.remove(x)
                )
            );


            scene.remove(
              p.object
            );

          }
        );


        state.parts=[];

        state.selectedPart=null;

        state.selectedEffect=null;


        if(
          typeof data.duration==="number"
        ){

          state.duration =
            data.duration;

        }


        /*
          LOAD PARTS
        */

        for(
          const pd of
          data.parts||[]
        ){

          const p =
            makePart();


          p.id =
            pd.id||
            p.id;


          p.name =
            pd.name||
            "Part";


          p.size =
            pd.size||
            p.size;


          p.visible =
            pd.visible!==false;


          p.object.scale.set(

            p.size.x/2,

            p.size.y/2,

            p.size.z/.4

          );


          p.object.position.y =
            p.size.y/2;


          p.object.visible =
            p.visible;


          p.effects=[];


          /*
            LOAD EFFECTS
          */

          for(
            const ed of
            pd.effects||[]
          ){

            const e =
              Object.assign(

                {

                  particles:[],

                  runtime:0,

                  keys:[],

                  offset:{
                    x:0,
                    y:0,
                    z:.25
                  }

                },

                ed

              );


            /*
              Backward compatibility.
            */

            if(!e.offset){

              e.offset={
                x:0,
                y:0,
                z:.25
              };

            }


            if(!e.keys)
              e.keys=[];


            p.effects.push(e);


            rebuildEffectVisual(e);

          }

        }


        state.selectedPart =
          state.parts[0]||
          null;


        state.selectedEffect =
          state.selectedPart &&
          state.selectedPart.effects[0]||
          null;


        renderTree();

        renderLibrary();

        syncInspector();

        renderTimeline();

        updateTimeline();


      }
      catch(err){

        console.error(
          err
        );


        alert(
          "JSON không hợp lệ."
        );

      }

    };


    reader.readAsText(file);

  };

    },

  );

/* =========================================================
   MOUSE PICK
========================================================= */

const raycaster =
  new THREE.Raycaster();


const mouse =
  new THREE.Vector2();


renderer.domElement.addEventListener(
  "pointerdown",
  ev=>{

    const rect =
      renderer.domElement
      .getBoundingClientRect();


    mouse.x =
      (
        (ev.clientX-rect.left)/
        rect.width
      )*2-1;


    mouse.y =
      -(
        (ev.clientY-rect.top)/
        rect.height
      )*2+1;


    raycaster.setFromCamera(
      mouse,
      camera
    );


    const hits =
      raycaster.intersectObjects(
        state.parts.map(
          p=>p.object
        )
      );


    if(hits.length){

      const p =
        state.parts.find(
          x=>
            x.object===
            hits[0].object
        );


      if(p)
        selectPart(p);

    }

  }
);

function resize(){

    .getBoundingClientRect();


  if(
    rect.width<=0||
    rect.height<=0
  )
    return;


  renderer.setSize(
    rect.width,
    rect.height,
    false
  );


  camera.aspect =
    rect.width/
    rect.height;


  camera.updateProjectionMatrix();

}


window.addEventListener(
  "resize",
  resize
);


/* =========================================================
   ANIMATION LOOP
========================================================= */

const clock =
  new THREE.Clock();


function animate(){

  requestAnimationFrame(
    animate
  );


  const dt =
    Math.min(
      .05,
      clock.getDelta()
    );


  if(
    state.playing &&
    state.selectedEffect
  ){

    state.time += dt;


    if(
      state.time>=
      state.duration
    ){

      state.time=0;

    }


    updateTimeline();

  }


  /*
    Runtime simulation.
  */

  state.parts.forEach(
    p=>
      p.effects.forEach(
        e=>
          simulateEffect(
            e,
            dt
          )
      )
  );


  controls.update();


  renderer.render(
    scene,
    camera
  );

}


/* =========================================================
   TOP BUTTONS
========================================================= */

$("addPart").onclick =
  ()=>makePart();


$("addEffect").onclick =
  ()=>makeEffect();


$("deleteSelected").onclick =
  removeSelected;


/* =========================================================
   START
========================================================= */

makePart();

makeEffect();

renderTree();

renderLibrary();

syncInspector();

renderTimeline();

updateTimeline();

resize();

animate();

</script>
