        .value-disp {

        button {

            width: 50px;
            text-align: center;
        }
    </style>
</head>

<body>

<script>

class MotionFXEngine {

    constructor() {

        this.canvas =
            document.getElementById("videoCanvas");

        this.ctx =
            this.canvas.getContext("2d");

        this.bgImage = null;

        this.interactionMode = "none";

        this.pins = [];

        this.brushMaskCanvas =
            document.createElement("canvas");

        this.brushMaskCanvas.width =
            this.canvas.width;

        this.brushMaskCanvas.height =
            this.canvas.height;

        this.brushMaskCtx =
            this.brushMaskCanvas.getContext("2d");

        this.isDrawing = false;

        this.brushSize = 30;

        this.time = 0;

        this.useGreenScreen = false;

        this.currentDistortFX = "none";

        this.initAccordion();

        this.initEvents();

        this.animate();
    }


    initAccordion() {

        document
            .querySelectorAll(".accordion-header")
            .forEach(header => {

                header.addEventListener(
                    "click",
                    () => {

                        header.parentElement
                            .classList
                            .toggle("active");

                    }
                );

            });

    }


    initEvents() {

        const greenScreen =
            document.getElementById(
                "toggle-greenscreen"
            );

        if (greenScreen) {

            greenScreen.addEventListener(
                "change",
                e => {

                    this.useGreenScreen =
                        e.target.checked;

                }
            );

        }


        const brushSlider =
            document.getElementById(
                "slider-brush-size"
            );

        if (brushSlider) {

            brushSlider.addEventListener(
                "input",
                e => {

                    this.brushSize =
                        parseInt(e.target.value);

                }
            );

        }


        const bindSlider =
            (sliderId, displayId) => {

                const slider =
                    document.getElementById(
                        sliderId
                    );

                const display =
                    document.getElementById(
                        displayId
                    );

                if (slider && display) {

                    slider.addEventListener(
                        "input",
                        e => {

                            display.innerText =
                                parseFloat(
                                    e.target.value
                                ).toFixed(
                                    sliderId.includes(
                                        "brightness"
                                    )
                                        ? 0
                                        : 2
                                );

                        }
                    );

                }

            };


        bindSlider(
            "slide-thick",
            "val-thick"
        );

        bindSlider(
            "slide-fine",
            "val-fine"
        );

        bindSlider(
            "slide-roll",
            "val-roll"
        );

        bindSlider(
            "slide-contrast",
            "val-contrast"
        );

        bindSlider(
            "slide-brightness",
            "val-brightness"
        );


        const btnPin =
            document.getElementById(
                "btn-pin-mode"
            );

        const btnMask =
            document.getElementById(
                "btn-mask-mode"
            );

        const btnClearAll =
            document.getElementById(
                "btn-clear-all"
            );


        if (btnPin) {

            btnPin.addEventListener(
                "click",
                () => {

                    this.interactionMode =
                        this.interactionMode === "pin"
                            ? "none"
                            : "pin";

                    this.updateButtons();

                }
            );

        }


        if (btnMask) {

            btnMask.addEventListener(
                "click",
                () => {

                    this.interactionMode =
                        this.interactionMode === "mask"
                            ? "none"
                            : "mask";

                    this.updateButtons();

                }
            );

        }


        if (btnClearAll) {

            btnClearAll.addEventListener(
                "click",
                () => {

                    this.pins = [];

                    this.brushMaskCtx.clearRect(
                        0,
                        0,
                        this.brushMaskCanvas.width,
                        this.brushMaskCanvas.height
                    );

                }
            );

        }


        const distortFXs = [
            "none",
            "stretch",
            "wave",
            "wavewarp",
            "bend",
            "zoom",
            "mirror",
            "fanwarp",
            "swirl",
            "pinch",
            "tile"
        ];


        distortFXs.forEach(fx => {

            const button =
                document.getElementById(
                    `fx-${fx}`
                );

            if (!button) {
                return;
            }


            button.addEventListener(
                "click",
                e => {

                    distortFXs.forEach(
                        f => {

                            const target =
                                document.getElementById(
                                    `fx-${f}`
                                );

                            if (target) {

                                target.classList
                                    .remove(
                                        "active"
                                    );

                            }

                        }
                    );


                    e.currentTarget
                        .classList
                        .add("active");


                    this.currentDistortFX =
                        fx;

                }
            );

        });


        const uploadBtn =
            document.getElementById(
                "btn-upload"
            );

        const fileInp =
            document.getElementById(
                "image-upload"
            );


        if (uploadBtn && fileInp) {

            uploadBtn.addEventListener(
                "click",
                () => {

                    fileInp.click();

                }
            );


            fileInp.addEventListener(
                "change",
                e => {

                    const files =
                        e.target.files;

                    if (
                        !files ||
                        files.length === 0
                    ) {
                        return;
                    }


                    const reader =
                        new FileReader();


                    reader.onload =
                        ev => {

                            const img =
                                new Image();


                            img.onload =
                                () => {

                                    this.bgImage =
                                        img;

                                    this.pins = [];

                                    this.canvas.width =
                                        960;

                                    this.canvas.height =
                                        540;

                                    this.brushMaskCanvas.width =
                                        960;

                                    this.brushMaskCanvas.height =
                                        540;

                                    this.brushMaskCtx
                                        .clearRect(
                                            0,
                                            0,
                                            960,
                                            540
                                        );

                                };


                            img.src =
                                ev.target.result;

                        };


                    reader.readAsDataURL(
                        files[0]
                    );

                }
            );

        }


        const getMousePos =
            e => {

                const rect =
                    this.canvas
                        .getBoundingClientRect();


                return {

                    x:
                        (e.clientX - rect.left) *
                        (
                            this.canvas.width /
                            rect.width
                        ),

                    y:
                        (e.clientY - rect.top) *
                        (
                            this.canvas.height /
                            rect.height
                        )

                };

            };


        this.canvas.addEventListener(
            "mousedown",
            e => {

                const pos =
                    getMousePos(e);


                if (
                    this.interactionMode ===
                    "pin"
                ) {

                    this.pins.push(pos);

                }

                else if (
                    this.interactionMode ===
                    "mask"
                ) {

                    this.isDrawing =
                        true;

                    this.drawBrush(
                        pos.x,
                        pos.y,
                        false
                    );

                }

            }
        );


        this.canvas.addEventListener(
            "mousemove",
            e => {

                if (
                    !this.isDrawing ||
                    this.interactionMode !==
                    "mask"
                ) {
                    return;
                }


                const pos =
                    getMousePos(e);


                this.drawBrush(
                    pos.x,
                    pos.y,
                    true
                );

            }
        );


        window.addEventListener(
            "mouseup",
            () => {

                this.isDrawing =
                    false;

            }
        );


        const exportBtn =
            document.getElementById(
                "btn-export-start"
            );


        if (exportBtn) {

            exportBtn.addEventListener(
                "click",
                () => {

                    this.handleAdvancedExport();

                }
            );

        }

    }


    drawBrush(
        x,
        y,
        isLeft
    ) {

        this.brushMaskCtx.save();

        this.brushMaskCtx.fillStyle =
            "#fff";

        this.brushMaskCtx.strokeStyle =
            "#fff";

        this.brushMaskCtx.lineWidth =
            this.brushSize;

        this.brushMaskCtx.lineCap =
            "round";

        this.brushMaskCtx.lineJoin =
            "round";


        if (!isLeft) {

            this.brushMaskCtx.beginPath();

            this.brushMaskCtx.arc(
                x,
                y,
                this.brushSize / 2,
                0,
                Math.PI * 2
            );

            this.brushMaskCtx.fill();

            this.lastX = x;
            this.lastY = y;

        }

        else {

            this.brushMaskCtx.beginPath();

            this.brushMaskCtx.moveTo(
                this.lastX,
                this.lastY
            );

            this.brushMaskCtx.lineTo(
                x,
                y
            );

            this.brushMaskCtx.stroke();

            this.lastX = x;
            this.lastY = y;

        }


        this.brushMaskCtx.restore();

    }


    updateButtons() {

        const pinBtn =
            document.getElementById(
                "btn-pin-mode"
            );

        const maskBtn =
            document.getElementById(
                "btn-mask-mode"
            );


        if (pinBtn) {

            pinBtn.style.boxShadow =
                this.interactionMode === "pin"
                    ? "0 0 12px #f59e0b"
                    : "none";

        }


        if (maskBtn) {

            maskBtn.style.boxShadow =
                this.interactionMode === "mask"
                    ? "0 0 12px #a855f7"
                    : "none";

        }

    }


    applyAllFX(
        srcData,
        dstData,
        w,
        h
    ) {

        const src =
            srcData.data;

        const dst =
            dstData.data;


        const maskData =
            this.brushMaskCtx
                .getImageData(
                    0,
                    0,
                    w,
                    h
                ).data;


        let hasMask = false;


        for (
            let i = 0;
            i < maskData.length;
            i += 4
        ) {

            if (
                maskData[i] > 0
            ) {

                hasMask = true;
                break;

            }

        }


        const getChecked =
            id => {

                const el =
                    document.getElementById(
                        id
                    );

                return el
                    ? el.checked
                    : false;

            };


        const getValue =
            (
                id,
                fallback = 0
            ) => {

                const el =
                    document.getElementById(
                        id
                    );

                return el
                    ? parseFloat(el.value)
                    : fallback;

            };


        const doDistort =
            getChecked(
                "chk-distort"
            );

        const doBadTV =
            getChecked(
                "chk-badtv"
            );

        const doBC =
            getChecked(
                "chk-bc"
            );

        const doStylize =
            getChecked(
                "chk-stylize"
            );

        const doChromatic =
            getChecked(
                "chk-chromatic"
            );


        const dAmt =
            getValue(
                "distort-amount",
                30
            );

        const dSpd =
            getValue(
                "distort-speed",
                1
            );


        const tvThick =
            getValue(
                "slide-thick",
                1.7
            );

        const tvFine =
            getValue(
                "slide-fine",
                0.1
            );

        const tvRoll =
            getValue(
                "slide-roll",
                1
            );


        const bcCont =
            getValue(
                "slide-contrast",
                0.2
            ) + 1;

        const bcBright =
            getValue(
                "slide-brightness",
                0
            );


        const chromAmt =
            parseInt(
                getValue(
                    "slide-chromatic-amt",
                    5
                )
            );


        const stylizeRadio =
            document.querySelector(
                'input[name="rad-stylize"]:checked'
            );


        const stylType =
            stylizeRadio
                ? stylizeRadio.value
                : "pixelate";


        const t =
            this.time;


        for (
            let y = 0;
            y < h;
            y++
        ) {

            for (
                let x = 0;
                x < w;
                x++
            ) {

                const idx =
                    (y * w + x) * 4;


                const inMask =
                    hasMask
                        ? maskData[idx] > 128
                        : true;


                let pinFactor = 1;


                if (
                    this.pins.length > 0
                ) {

                    let minDist =
                        Infinity;


                    this.pins.forEach(
                        pin => {

                            const d =
                                Math.sqrt(
                                    (x - pin.x) ** 2 +
                                    (y - pin.y) ** 2
                                );


                            if (
                                d < minDist
                            ) {

                                minDist = d;

                            }

                        }
                    );


                    pinFactor =
                        Math.min(
                            1,
                            minDist / 100
                        );

                }


                let srcX = x;
                let srcY = y;


                const edgeThreshold =
                    6;


                const isEdge =
                    x < edgeThreshold ||
                    x > w - edgeThreshold ||
                    y < edgeThreshold ||
                    y > h - edgeThreshold;


                if (
                    doDistort &&
                    inMask &&
                    this.currentDistortFX !== "none" &&
                    !isEdge
                ) {

                    const tDist =
                        t * dSpd;


                    switch (
                        this.currentDistortFX
                    ) {

                        case "stretch":

                            srcY +=
                                Math.sin(
                                    x * 0.05 +
                                    tDist
                                ) *
                                (dAmt * 0.3) *
                                pinFactor;

                            break;


                        case "wave":

                            srcX +=
                                Math.sin(
                                    y * 0.05 +
                                    tDist
                                ) *
                                (dAmt * 0.4) *
                                pinFactor;

                            break;


                        case "wavewarp":

                            srcX +=
                                Math.sin(
                                    y * 0.08 +
                                    tDist * 1.5
                                ) *
                                (dAmt * 0.3) *
                                pinFactor;


                            srcY +=
                                Math.cos(
                                    x * 0.08 +
                                    tDist * 1.5
                                ) *
                                (dAmt * 0.2) *
                                pinFactor;

                            break;


                        case "bend":

                            srcX +=
                                (
                                    (y / h) *
                                    Math.sin(tDist)
                                ) *
                                (dAmt * 0.5) *
                                pinFactor;

                            break;


                        case "zoom": {

                            const zFactor =
                                1 +
                                (
                                    Math.sin(tDist) *
                                    (dAmt / 200)
                                ) *
                                pinFactor;


                            srcX =
                                w / 2 +
                                (x - w / 2) *
                                zFactor;


                            srcY =
                                h / 2 +
                                (y - h / 2) *
                                zFactor;

                            break;
                        }


                        case "mirror":

                            if (
                                x > w / 2
                            ) {

                                srcX =
                                    w - x;

                            }

                            break;


                        case "fanwarp": {

                            const angleFan =
                                Math.atan2(
                                    y - h / 2,
                                    x - w / 2
                                ) +
                                Math.sin(tDist) *
                                (dAmt / 50) *
                                pinFactor;


                            const dFan =
                                Math.sqrt(
                                    (x - w / 2) ** 2 +
                                    (y - h / 2) ** 2
                                );


                            srcX =
                                w / 2 +
                                Math.cos(angleFan) *
                                dFan;


                            srcY =
                                h / 2 +
                                Math.sin(angleFan) *
                                dFan;


                            break;
                        }


                        case "swirl": {

                            const sDist =
                                Math.sqrt(
                                    (x - w / 2) ** 2 +
                                    (y - h / 2) ** 2
                                );


                            if (
                                sDist < 250
                            ) {

                                const swirlAmt =
                                    (
                                        (250 - sDist) /
                                        250
                                    ) *
                                    (dAmt / 10) *
                                    Math.sin(tDist) *
                                    pinFactor;


                                const sAngle =
                                    Math.atan2(
                                        y - h / 2,
                                        x - w / 2
                                    ) +
                                    swirlAmt;


                                srcX =
                                    w / 2 +
                                    Math.cos(sAngle) *
                                    sDist;


                                srcY =
                                    h / 2 +
                                    Math.sin(sAngle) *
                                    sDist;

                            }


                            break;
                        }


                        case "pinch": {

                            const pDist =
                                Math.sqrt(
                                    (x - w / 2) ** 2 +
                                    (y - h / 2) ** 2
                                );


                            if (
                                pDist < 300
                            ) {

                                const pScale =
                                    Math.pow(
                                        pDist / 300,
                                        Math.sin(tDist) *
                                        (dAmt / 100) *
                                        pinFactor
                                    );


                                srcX =
                                    w / 2 +
                                    (x - w / 2) *
                                    pScale;


                                srcY =
                                    h / 2 +
                                    (y - h / 2) *
                                    pScale;

                            }


                            break;
                        }


                        case "tile":

                            srcX =
                                (
                                    x *
                                    (1 + dAmt / 50) +
                                    tDist * 20
                                ) % w;


                            srcY =
                                (
                                    y *
                                    (1 + dAmt / 50)
                                ) % h;


                            if (
                                srcX < 0
                            ) {
                                srcX += w;
                            }


                            if (
                                srcY < 0
                            ) {
                                srcY += h;
                            }


                            break;

                    }

                }


                srcX =
                    Math.max(
                        0,
                        Math.min(
                            w - 1,
                            Math.floor(srcX)
                        )
                    );


                srcY =
                    Math.max(
                        0,
                        Math.min(
                            h - 1,
                            Math.floor(srcY)
                        )
                    );


                const sIdx =
                    (srcY * w + srcX) * 4;


                let r =
                    src[sIdx];

                let g =
                    src[sIdx + 1];

                let b =
                    src[sIdx + 2];

                let a =
                    src[sIdx + 3];


                if (
                    inMask &&
                    !isEdge
                ) {

                    if (
                        doStylize
                    ) {

                        switch (
                            stylType
                        ) {

                            case "pixelate": {

                                const size =
                                    12;


                                const px =
                                    Math.floor(
                                        srcX / size
                                    ) * size;


                                const py =
                                    Math.floor(
                                        srcY / size
                                    ) * size;


                                const pIdx =
                                    (py * w + px) * 4;


                                r =
                                    src[pIdx];

                                g =
                                    src[pIdx + 1];

                                b =
                                    src[pIdx + 2];


                                break;
                            }


                            case "polar": {

                                const pr =
                                    Math.floor(
                                        Math.sqrt(
                                            (srcX - w / 2) ** 2 +
                                            (srcY - h / 2) ** 2
                                        ) / 10
                                    ) * 10;


                                const pa =
                                    Math.floor(
                                        Math.atan2(
                                            srcY - h / 2,
                                            srcX - w / 2
                                        ) * 10
                                    ) / 10;


                                const pX =
                                    Math.floor(
                                        w / 2 +
                                        Math.cos(pa) *
                                        pr
                                    );


                                const pY =
                                    Math.floor(
                                        h / 2 +
                                        Math.sin(pa) *
                                        pr
                                    );


                                const safeX =
                                    Math.max(
                                        0,
                                        Math.min(
                                            w - 1,
                                            pX
                                        )
                                    );


                                const safeY =
                                    Math.max(
                                        0,
                                        Math.min(
                                            h - 1,
                                            pY
                                        )
                                    );


                                const plIdx =
                                    (
                                        safeY * w +
                                        safeX
                                    ) * 4;


                                r =
                                    src[plIdx];

                                g =
                                    src[plIdx + 1];

                                b =
                                    src[plIdx + 2];


                                break;
                            }


                            case "slices": {

                                if (
                                    Math.floor(
                                        srcY / 15
                                    ) % 2 === 0
                                ) {

                                    const safeX =
                                        Math.max(
                                            0,
                                            Math.min(
                                                w - 1,
                                                srcX + 25
                                            )
                                        );


                                    const slIdx =
                                        (
                                            srcY * w +
                                            safeX
                                        ) * 4;


                                    r =
                                        src[slIdx];

                                    g =
                                        src[slIdx + 1];

                                    b =
                                        src[slIdx + 2];

                                }


                                break;
                            }


                            case "jitter":

                                if (
                                    Math.random() > 0.7
                                ) {

                                    r =
                                        Math.min(
                                            255,
                                            r + 40
                                        );

                                    g =
                                        Math.max(
                                            0,
                                            g - 30
                                        );

                                }

                                break;


                            case "melt": {

                                const meltY =
                                    Math.max(
                                        0,
                                        Math.min(
                                            h - 1,
                                            Math.floor(
                                                srcY +
                                                Math.sin(
                                                    srcX * 0.05
                                                ) * 20
                                            )
                                        )
                                    );


                                const mIdx =
                                    (
                                        meltY * w +
                                        srcX
                                    ) * 4;


                                r =
                                    src[mIdx];

                                g =
                                    src[mIdx + 1];

                                b =
                                    src[mIdx + 2];


                                break;
                            }


                            case "wobble": {

                                const wobX =
                                    Math.max(
                                        0,
                                        Math.min(
                                            w - 1,
                                            Math.floor(
                                                srcX +
                                                Math.sin(
                                                    srcY * 0.04 +
                                                    t * 4
                                                ) * 12
                                            )
                                        )
                                    );


                                const wbIdx =
                                    (
                                        srcY * w +
                                        wobX
                                    ) * 4;


                                r =
                                    src[wbIdx];

                                g =
                                    src[wbIdx + 1];

                                b =
                                    src[wbIdx + 2];


                                break;
                            }


                            case "shake": {

                                const shk =
                                    Math.floor(
                                        Math.sin(
                                            t * 8
                                        ) * 8
                                    );


                                const safeY =
                                    Math.max(
                                        0,
                                        Math.min(
                                            h - 1,
                                            srcY + shk
                                        )
                                    );


                                const safeX =
                                    Math.max(
                                        0,
                                        Math.min(
                                            w - 1,
                                            srcX + shk
                                        )
                                    );


                                const skIdx =
                                    (
                                        safeY * w +
                                        safeX
                                    ) * 4;


                                r =
                                    src[skIdx];

                                g =
                                    src[skIdx + 1];

                                b =
                                    src[skIdx + 2];


                                break;
                            }


                            case "edges": {

                                const edgeVal =
                                    (r + g + b) / 3;


                                r =
                                    edgeVal > 120
                                        ? 0
                                        : 255;


                                g =
                                    edgeVal > 120
                                        ? 255
                                        : 0;


                                b = 255;


                                break;
                            }


                            case "solarize":

                                r =
                                    r > 128
                                        ? 255 - r
                                        : r;

                                g =
                                    g > 128
                                        ? 255 - g
                                        : g;

                                break;


                            case "dotmatrix":

                                if (
                                    srcX % 6 > 2 ||
                                    srcY % 6 > 2
                                ) {

                                    r *= 0.2;
                                    g *= 0.2;
                                    b *= 0.2;

                                }

                                break;


                            case "posterize":

                                r =
                                    Math.floor(
                                        r / 64
                                    ) * 64;

                                g =
                                    Math.floor(
                                        g / 64
                                    ) * 64;

                                b =
                                    Math.floor(
                                        b / 64
                                    ) * 64;

                                break;


                            case "duotone": {

                                const gray =
                                    (r + g + b) / 3;


                                r =
                                    gray * 0.4;

                                g =
                                    gray * 0.3;

                                b =
                                    gray * 0.9;


                                break;
                            }

                        }

                    }


                    if (
                        doBadTV
                    ) {

                        const rollY =
                            Math.floor(
                                srcY +
                                t * tvRoll * 150
                            ) % h;


                        const tvIdx =
                            (
                                rollY * w +
                                srcX
                            ) * 4;


                        const noise =
                            Math.sin(
                                srcY *
                                tvThick +
                                t * 10
                            ) * 15 +
                            (
                                Math.random() -
                                0.5
                            ) *
                            tvFine *
                            100;


                        r =
                            Math.max(
                                0,
                                Math.min(
                                    255,
                                    src[tvIdx] +
                                    noise
                                )
                            );


                        g =
                            Math.max(
                                0,
                                Math.min(
                                    255,
                                    src[tvIdx + 1] +
                                    noise
                                )
                            );


                        b =
                            Math.max(
                                0,
                                Math.min(
                                    255,
                                    src[tvIdx + 2] +
                                    noise
                                )
                            );

                    }


                    if (
                        doBC
                    ) {

                        r =
                            (r - 128) *
                            bcCont +
                            128 +
                            bcBright;


                        g =
                            (g - 128) *
                            bcCont +
                            128 +
                            bcBright;


                        b =
                            (b - 128) *
                            bcCont +
                            128 +
                            bcBright;

                    }


                    if (
                        doChromatic
                    ) {

                        const rIdx =
                            (
                                srcY * w +
                                Math.max(
                                    0,
                                    srcX - chromAmt
                                )
                            ) * 4;


                        const bIdx =
                            (
                                srcY * w +
                                Math.min(
                                    w - 1,
                                    srcX + chromAmt
                                )
                            ) * 4;


                        r =
                            src[rIdx];

                        b =
                            src[bIdx];

                    }

                }


                dst[idx] =
                    Math.max(
                        0,
                        Math.min(
                            255,
                            r
                        )
                    );


                dst[idx + 1] =
                    Math.max(
                        0,
                        Math.min(
                            255,
                            g
                        )
                    );


                dst[idx + 2] =
                    Math.max(
                        0,
                        Math.min(
                            255,
                            b
                        )
                    );


                dst[idx + 3] =
                    a;

            }

        }

    }


    animate() {

        this.time += 0.03;


        const w =
            this.canvas.width;

        const h =
            this.canvas.height;


        this.ctx.clearRect(
            0,
            0,
            w,
            h
        );


        if (
            this.useGreenScreen
        ) {

            this.ctx.fillStyle =
                "#00ff00";

        }

        else {

            this.ctx.fillStyle =
                "#1e1e24";

        }


        this.ctx.fillRect(
            0,
            0,
            w,
            h
        );


        if (
            this.bgImage
        ) {

            const tempCanvas =
                document.createElement(
                    "canvas"
                );


            tempCanvas.width =
                w;

            tempCanvas.height =
                h;


            const tempCtx =
                tempCanvas.getContext(
                    "2d"
                );


            tempCtx.drawImage(
                this.bgImage,
                0,
                0,
                w,
                h
            );


            const srcData =
                tempCtx.getImageData(
                    0,
                    0,
                    w,
                    h
                );


            const dstData =
                tempCtx.createImageData(
                    w,
                    h
                );


            this.applyAllFX(
                srcData,
                dstData,
                w,
                h
            );


            tempCtx.putImageData(
                dstData,
                0,
                0
            );


            this.ctx.drawImage(
                tempCanvas,
                0,
                0
            );


            const saber =
                document.getElementById(
                    "chk-saber"
                );


            const saberColor =
                document.getElementById(
                    "color-saber"
                );


            const saberGlow =
                document.getElementById(
                    "slide-saber-glow"
                );


            if (
                saber &&
                saber.checked &&
                saberColor &&
                saberGlow
            ) {

                this.ctx.save();


                this.ctx.globalCompositeOperation =
                    "screen";


                this.ctx.shadowColor =
                    saberColor.value;


                this.ctx.shadowBlur =
                    parseInt(
                        saberGlow.value
                    );


                this.ctx.drawImage(
                    this.brushMaskCanvas,
                    0,
                    0
                );


                this.ctx.restore();

            }

        }

        else {

            this.ctx.fillStyle =
                "#aaa";


            this.ctx.font =
                "22px sans-serif";


            this.ctx.fillText(
                "📁 Vui lòng bấm nút chọn ảnh để bắt đầu...",
                w / 2 - 200,
                h / 2
            );

        }


        this.pins.forEach(
            pin => {

                this.ctx.beginPath();


                this.ctx.arc(
                    pin.x,
                    pin.y,
                    6,
                    0,
                    Math.PI * 2
                );


                this.ctx.fillStyle =
                    "#f59e0b";


                this.ctx.fill();


                this.ctx.strokeStyle =
                    "#fff";


                this.ctx.stroke();

            }
        );


        if (
            this.interactionMode ===
            "mask"
        ) {

            this.ctx.save();


            this.ctx.globalAlpha =
                0.2;


            this.ctx.drawImage(
                this.brushMaskCanvas,
                0,
                0
            );


            this.ctx.restore();

        }


        requestAnimationFrame(
            () => this.animate()
        );

    }


    handleAdvancedExport() {

        if (
            !this.bgImage
        ) {

            alert(
                "Vui lòng nạp ảnh trước bro ơi!"
            );

            return;

        }


        const durationInput =
            document.getElementById(
                "export-duration"
            );


        const formatInput =
            document.getElementById(
                "export-format"
            );


        const secs =
            durationInput
                ? parseInt(
                    durationInput.value
                )
                : 3;


        const format =
            formatInput
                ? formatInput.value
                : "mp4";


        const totalFrames =
            secs * 10;


        alert(
            `Đang tiến hành render chuỗi ${totalFrames} khung hình nâng cao. Vui lòng giữ nguyên màn hình...`
        );


        const frames = [];


        const w =
            this.canvas.width;

        const h =
            this.canvas.height;


        const backupTime =
            this.time;


        let encoder = null;


        if (
            format === "mp4" &&
            typeof Whammy !== "undefined"
        ) {

            encoder =
                new Whammy.Video(10);

        }


        for (
            let i = 0;
            i < totalFrames;
            i++
        ) {

            this.time =
                i * 0.2;


            const outCanvas =
                document.createElement(
                    "canvas"
                );


            outCanvas.width =
                w;

            outCanvas.height =
                h;


            const outCtx =
                outCanvas.getContext(
                    "2d"
                );


            if (
                this.useGreenScreen
            ) {

                outCtx.fillStyle =
                    "#00ff00";

            }

            else {

                outCtx.fillStyle =
                    "#1e1e24";

            }


            outCtx.fillRect(
                0,
                0,
                w,
                h
            );


            const imgCanvas =
                document.createElement(
                    "canvas"
                );


            imgCanvas.width =
                w;

            imgCanvas.height =
                h;


            const imgCtx =
                imgCanvas.getContext(
                    "2d"
                );


            imgCtx.drawImage(
                this.bgImage,
                0,
                0,
                w,
                h
            );


            const srcData =
                imgCtx.getImageData(
                    0,
                    0,
                    w,
                    h
                );


            const dstData =
                imgCtx.createImageData(
                    w,
                    h
                );


            this.applyAllFX(
                srcData,
                dstData,
                w,
                h
            );


            imgCtx.putImageData(
                dstData,
                0,
                0
            );


            outCtx.drawImage(
                imgCanvas,
                0,
                0
            );


            const saber =
                document.getElementById(
                    "chk-saber"
                );


            const saberColor =
                document.getElementById(
                    "color-saber"
                );


            const saberGlow =
                document.getElementById(
                    "slide-saber-glow"
                );


            if (
                saber &&
                saber.checked &&
                saberColor &&
                saberGlow
            ) {

                outCtx.save();


                outCtx.globalCompositeOperation =
                    "screen";


                outCtx.shadowColor =
                    saberColor.value;


                outCtx.shadowBlur =
                    parseInt(
                        saberGlow.value
                    );


                outCtx.drawImage(
                    this.brushMaskCanvas,
                    0,
                    0
                );


                outCtx.restore();

            }


            if (
                format === "mp4" &&
                encoder
            ) {

                encoder.add(
                    outCanvas
                );

            }

            else {

                frames.push(
                    outCanvas.toDataURL(
                        "image/jpeg",
                        0.85
                    )
                );

            }

        }


        this.time =
            backupTime;


        if (
            format === "gif"
        ) {

            if (
                typeof gifshot ===
                "undefined"
            ) {

                alert(
                    "Không tìm thấy thư viện GIF."
                );

                return;

            }


            gifshot.createGIF(
                {
                    images: frames,
                    gifWidth: w,
                    gifHeight: h,
                    interval: 0.1
                },

                obj => {

                    if (
                        !obj.error
                    ) {

                        this.triggerSystemSave(
                            obj.image,
                            `motion_fx_${Date.now()}.gif`
                        );

                    }

                    else {

                        alert(
                            "Lỗi khi kết xuất GIF."
                        );

                    }

                }
            );

        }

        else {

            if (
                !encoder
            ) {

                alert(
                    "Không tìm thấy thư viện Whammy để xuất MP4."
                );

                return;

            }


            const outputBlob =
                encoder.compile();


            const videoUrl =
                URL.createObjectURL(
                    outputBlob
                );


            this.triggerSystemSave(
                videoUrl,
                `motion_video_${Date.now()}.mp4`
            );

        }

    }


    triggerSystemSave(
        fileUrl,
        defaultName
    ) {

        const link =
            document.createElement(
                "a"
            );


        link.download =
            defaultName;


        link.href =
            fileUrl;


        document.body.appendChild(
            link
        );


        link.click();


        document.body.removeChild(
            link
        );


        setTimeout(
            () => {

                URL.revokeObjectURL(
                    fileUrl
                );

            },
            1000
        );

    }

}


window.addEventListener(
    "DOMContentLoaded",
    () => {

        new MotionFXEngine();

    }
);

</script>
