<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rhythm Music Game</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:
        radial-gradient(circle at top,#17272d,#070a0c 60%);
    color:#fff;
    font-family:Arial,sans-serif;
}

.container{
    width:min(1250px,95%);
    margin:auto;
    padding:25px 0 40px;
}

header{
    text-align:center;
    margin-bottom:20px;
}

header h1{
    margin:0;
    color:#1ed760;
    font-size:34px;
}

header p{
    color:#888;
}

.layout{
    display:grid;
    grid-template-columns:370px 1fr;
    gap:20px;
}

.panel{
    background:#101517;
    border:1px solid #30393d;
    border-radius:15px;
    padding:18px;
}

h2{
    margin:0 0 15px;
}

/* SEARCH */

.search{
    display:flex;
    gap:7px;
}

#searchInput{
    flex:1;
    min-width:0;
    background:#0a0e10;
    border:1px solid #414b50;
    border-radius:8px;
    padding:12px;
    color:white;
    outline:none;
}

#searchInput:focus{
    border-color:#1db954;
}

.search button{
    background:#1db954;
    border:0;
    color:white;
    font-weight:bold;
    padding:0 15px;
    border-radius:8px;
    cursor:pointer;
}

.status{
    color:#888;
    text-align:center;
    padding:15px 5px;
    font-size:13px;
}

.result{
    display:flex;
    gap:9px;
    align-items:center;
    padding:10px 0;
    border-bottom:1px solid #282e31;
}

.cover{
    width:48px;
    height:48px;
    object-fit:cover;
    border-radius:7px;
    background:#222;
    flex-shrink:0;
}

.info{
    flex:1;
    min-width:0;
}

.title{
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.artist{
    color:#888;
    font-size:12px;
    margin-top:4px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.add{
    background:#20292c;
    color:#1ed760;
    border:1px solid #344044;
    border-radius:7px;
    padding:7px;
    cursor:pointer;
}

/* LIBRARY */

.library{
    margin-top:25px;
}

.libraryHead{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.libraryCount{
    color:#777;
    font-size:12px;
}

.clear{
    background:transparent;
    color:#ff5252;
    border:1px solid #542c2c;
    border-radius:7px;
    padding:7px 9px;
    cursor:pointer;
}

.librarySong{
    display:flex;
    align-items:center;
    gap:9px;
    padding:9px;
    margin-top:8px;
    background:#151b1e;
    border:1px solid #2b3438;
    border-radius:9px;
}

.librarySong.active{
    border-color:#1db954;
    background:rgba(29,185,84,.1);
}

.songButtons{
    display:flex;
    gap:4px;
}

.playSmall{
    width:34px;
    height:34px;
    border:0;
    border-radius:50%;
    background:#1db954;
    color:white;
    cursor:pointer;
}

.deleteSmall{
    width:30px;
    height:30px;
    border:0;
    background:transparent;
    color:#ff5252;
    cursor:pointer;
}

.empty{
    text-align:center;
    color:#777;
    border:1px dashed #333c40;
    border-radius:10px;
    padding:25px 10px;
    margin-top:10px;
}

.emptyIcon{
    font-size:38px;
}

/* GAME */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-bottom:10px;
}

.stat{
    background:#0a0f11;
    border:1px solid #30383c;
    border-radius:9px;
    padding:10px;
    text-align:center;
}

.stat span{
    display:block;
    color:#777;
    font-size:11px;
}

.stat strong{
    display:block;
    color:#1ed760;
    font-size:22px;
    margin-top:3px;
}

#message{
    height:28px;
    text-align:center;
    font-size:19px;
    font-weight:bold;
}

.perfect{
    color:#00ff88;
}

.good{
    color:#00e5ff;
}

.miss{
    color:#ff5252;
}

canvas{
    display:block;
    width:100%;
    height:auto;
    background:#070a0c;
    border:2px solid #30383c;
    border-radius:12px;
}

.audio{
    text-align:center;
    min-height:25px;
    color:#777;
    padding:8px;
    font-size:13px;
}

.playing{
    color:#69f0ae;
}

.controls{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:8px;
}

.control{
    border:1px solid #394247;
    background:#20282c;
    color:white;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
}

.help{
    text-align:center;
    color:#777;
    margin-top:14px;
}

.keys{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-top:8px;
}

.key{
    width:48px;
    height:40px;
    border:2px solid #555;
    border-radius:8px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
}

.key.active{
    color:#1db954;
    border-color:#1db954;
    box-shadow:0 0 15px #1db95455;
}

@media(max-width:850px){
    .layout{
        grid-template-columns:1fr;
    }
}

@media(max-width:500px){
    header h1{
        font-size:27px;
    }

    .panel{
        padding:12px;
    }

    .layout{
        gap:12px;
    }

    .stats{
        gap:4px;
    }

    .stat strong{
        font-size:18px;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <h1>🎵 Rhythm Music Game</h1>
    <p>Tìm nhạc trực tuyến • Kho nhạc của tôi • Chơi rhythm</p>
</header>

<div class="layout">

<!-- ================= LEFT ================= -->

<div class="panel">

<h2>🔎 Tìm bài hát</h2>

<div class="search">

<input
    id="searchInput"
    placeholder="Nhập tên bài hát hoặc ca sĩ..."
>

<button onclick="searchMusic()">
    Tìm
</button>

</div>

<div id="results">
    <div class="status">
        Nhập tên bài hát để tìm.
    </div>
</div>


<!-- LIBRARY -->

<div class="library">

<div class="libraryHead">

<div>
    <h2>❤️ Kho nhạc của tôi</h2>

    <div class="libraryCount">
        <span id="libraryCount">0</span>
        bài hát
    </div>
</div>

<button
    class="clear"
    onclick="clearLibrary()"
>
    🗑 Xóa hết
</button>

</div>


<div id="library"></div>

</div>

</div>


<!-- ================= RIGHT ================= -->

<div class="panel">

<div class="stats">

<div class="stat">
    <span>ĐIỂM</span>
    <strong id="score">0</strong>
</div>

<div class="stat">
    <span>COMBO</span>
    <strong id="combo">0</strong>
</div>

<div class="stat">
    <span>BEST</span>
    <strong id="best">0</strong>
</div>

</div>

<div id="message"></div>

<canvas
    id="game"
    width="700"
    height="600"
></canvas>

<div
    id="audioStatus"
    class="audio"
>
    🎧 Chọn một bài hát trong kho.
</div>

<div class="controls">

<button
    class="control"
    onclick="pauseGame()"
>
    ⏸ Tạm dừng
</button>

<button
    class="control"
    onclick="restartGame()"
>
    🔄 Chơi lại
</button>

<button
    class="control"
    onclick="stopSong()"
>
    ⏹ Dừng
</button>

</div>

<div class="help">

🎮 Bấm theo nốt nhạc:

<div class="keys">

<div id="A" class="key">A</div>
<div id="S" class="key">S</div>
<div id="D" class="key">D</div>
<div id="F" class="key">F</div>

</div>

</div>

</div>

</div>

</div>


<script>

/* =========================================================
   GLOBAL
========================================================= */

let library =
    JSON.parse(
        localStorage.getItem("rhythmLibrary") || "[]"
    );

let currentSong = null;

let audio = null;

let playing = false;

let paused = false;

let notes = [];

let score = 0;

let combo = 0;

let best = 0;


/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");


const keys = [
    "KeyA",
    "KeyS",
    "KeyD",
    "KeyF"
];


const keyNames = [
    "A",
    "S",
    "D",
    "F"
];


const laneX = [
    87.5,
    262.5,
    437.5,
    612.5
];


const targetY = 510;

const radius = 29;


const colors = [
    "#ff3366",
    "#00e5ff",
    "#ffeb3b",
    "#e040fb"
];


let keyState = {
    KeyA:false,
    KeyS:false,
    KeyD:false,
    KeyF:false
};


/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(text){

    return String(text || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   SEARCH ONLINE
   iTunes public search API
========================================================= */

async function searchMusic(){

    const q =
        document
            .getElementById("searchInput")
            .value
            .trim();

    const box =
        document.getElementById("results");


    if(!q){

        box.innerHTML =
            `<div class="status">
                Nhập tên bài hát để tìm.
            </div>`;

        return;

    }


    box.innerHTML =
        `<div class="status">
            🔎 Đang tìm "${escapeHTML(q)}"...
        </div>`;


    try{

        const url =
            "https://itunes.apple.com/search" +
            "?term=" +
            encodeURIComponent(q) +
            "&media=music" +
            "&entity=song" +
            "&limit=20";


        const response =
            await fetch(url);


        if(!response.ok){

            throw new Error("Search failed");

        }


        const data =
            await response.json();


        const songs =
            (data.results || [])
                .filter(x => x.previewUrl);


        box.innerHTML = "";


        if(!songs.length){

            box.innerHTML =
                `<div class="status">
                    ❌ Không tìm thấy bài hát.
                </div>`;

            return;

        }


        songs.forEach(song => {

            const item =
                document.createElement("div");

            item.className =
                "result";


            const dataSong = {

                id:
                    String(song.trackId),

                title:
                    song.trackName,

                artist:
                    song.artistName,

                album:
                    song.collectionName || "",

                image:
                    song.artworkUrl100 || "",

                url:
                    song.previewUrl

            };


            item.innerHTML = `

                <img
                    class="cover"
                    src="${escapeHTML(dataSong.image)}"
                    alt=""
                >

                <div class="info">

                    <div class="title">
                        ${escapeHTML(dataSong.title)}
                    </div>

                    <div class="artist">
                        ${escapeHTML(dataSong.artist)}
                    </div>

                </div>

                <button
                    class="add"
                >
                    ❤️ Thêm
                </button>

            `;


            item
                .querySelector(".add")
                .onclick =
                () => addSong(dataSong);


            box.appendChild(item);

        });


    }catch(error){

        console.error(error);


        box.innerHTML =
            `<div class="status">
                ❌ Không thể kết nối nguồn nhạc.
                <br>
                Kiểm tra Internet rồi thử lại.
            </div>`;

    }

}


/* =========================================================
   ENTER SEARCH
========================================================= */

document
    .getElementById("searchInput")
    .addEventListener(
        "keydown",
        e => {

            if(e.key === "Enter"){

                searchMusic();

            }

        }
    );


/* =========================================================
   ADD SONG
========================================================= */

function addSong(song){

    if(
        library.some(
            x => x.id === song.id
        )
    ){

        showMessage(
            "❤️ Bài này đã có trong kho!",
            "good"
        );

        return;

    }


    library.push(song);

    saveLibrary();

    renderLibrary();

    showMessage(
        "❤️ Đã thêm vào kho!",
        "good"
    );

}


/* =========================================================
   SAVE
========================================================= */

function saveLibrary(){

    localStorage.setItem(
        "rhythmLibrary",
        JSON.stringify(library)
    );

}


/* =========================================================
   RENDER LIBRARY
========================================================= */

function renderLibrary(){

    const box =
        document.getElementById(
            "library"
        );


    document.getElementById(
        "libraryCount"
    ).textContent =
        library.length;


    box.innerHTML = "";


    if(!library.length){

        box.innerHTML = `

            <div class="empty">

                <div class="emptyIcon">
                    🎵
                </div>

                <b>Kho nhạc đang trống</b>

                <p>
                    Tìm bài hát phía trên
                    rồi thêm vào kho.
                </p>

            </div>

        `;

        return;

    }


    library.forEach(song => {

        const item =
            document.createElement("div");


        item.className =
            "librarySong";


        if(
            currentSong &&
            currentSong.id === song.id
        ){

            item.classList.add(
                "active"
            );

        }


        item.innerHTML = `

            <img
                class="cover"
                src="${escapeHTML(song.image)}"
                alt=""
            >

            <div class="info">

                <div class="title">
                    ${escapeHTML(song.title)}
                </div>

                <div class="artist">
                    ${escapeHTML(song.artist)}
                </div>

            </div>

            <div class="songButtons">

                <button
                    class="playSmall"
                    title="Chơi"
                >
                    ▶
                </button>

                <button
                    class="deleteSmall"
                    title="Xóa"
                >
                    🗑
                </button>

            </div>

        `;


        item
            .querySelector(".playSmall")
            .onclick =
            () => startSong(song);


        item
            .querySelector(".deleteSmall")
            .onclick =
            () => deleteSong(song.id);


        box.appendChild(item);

    });

}


/* =========================================================
   DELETE
========================================================= */

function deleteSong(id){

    if(
        currentSong &&
        currentSong.id === id
    ){

        stopSong();

    }


    library =
        library.filter(
            song => song.id !== id
        );


    saveLibrary();

    renderLibrary();

}


/* =========================================================
   CLEAR
========================================================= */

function clearLibrary(){

    if(!library.length)
        return;


    if(
        !confirm(
            "Bạn có chắc muốn xóa toàn bộ kho nhạc?"
        )
    ){

        return;

    }


    stopSong();

    library = [];

    saveLibrary();

    renderLibrary();

}


/* =========================================================
   START SONG
========================================================= */

function startSong(song){

    if(audio){

        audio.pause();

        audio.src = "";

    }


    currentSong = song;


    audio =
        new Audio(song.url);


    audio.preload = "auto";

    audio.volume = .7;


    audio
        .play()
        .catch(() => {

            setAudio(
                "▶️ Bấm A/S/D/F để bắt đầu phát.",
                false
            );

        });


    resetGame();


    playing = true;

    paused = false;


    setAudio(
        "🔊 Đang phát: " + song.title,
        true
    );


    renderLibrary();

}


/* =========================================================
   STOP
========================================================= */

function stopSong(){

    if(audio){

        audio.pause();

        audio.currentTime = 0;

    }


    audio = null;

    currentSong = null;

    playing = false;

    paused = false;

    notes = [];


    setAudio(
        "🎧 Đã dừng.",
        false
    );


    resetGame();

    renderLibrary();

}


/* =========================================================
   PAUSE
========================================================= */

function pauseGame(){

    if(!currentSong){

        showMessage(
            "Hãy chọn bài hát trước!",
            "miss"
        );

        return;

    }


    if(paused){

        paused = false;

        if(audio){

            audio.play().catch(()=>{});

        }

        setAudio(
            "🔊 Đang phát.",
            true
        );

    }else{

        paused = true;

        if(audio){

            audio.pause();

        }

        setAudio(
            "⏸ Đã tạm dừng.",
            false
        );

    }

}


/* =========================================================
   RESTART
========================================================= */

function restartGame(){

    if(!currentSong){

        showMessage(
            "Hãy chọn bài hát trước!",
            "miss"
        );

        return;

    }


    startSong(currentSong);

}


/* =========================================================
   RESET
========================================================= */

function resetGame(){

    score = 0;

    combo = 0;

    best = 0;

    notes = [];


    updateStats();

}


/* =========================================================
   STATS
========================================================= */

function updateStats(){

    document.getElementById(
        "score"
    ).textContent = score;


    document.getElementById(
        "combo"
    ).textContent = combo;


    document.getElementById(
        "best"
    ).textContent = best;

}


/* =========================================================
   KEYBOARD
========================================================= */

window.addEventListener(
    "keydown",
    e => {

        if(!keys.includes(e.code))
            return;


        e.preventDefault();


        keyState[e.code] = true;


        const visual =
            document.getElementById(
                e.code.replace("Key","")
            );


        if(visual){

            visual.classList.add(
                "active"
            );

        }


        if(
            audio &&
            audio.paused &&
            !paused
        ){

            audio.play().catch(()=>{});

        }


        hit(e.code);

    }
);


window.addEventListener(
    "keyup",
    e => {

        if(!keys.includes(e.code))
            return;


        keyState[e.code] = false;


        const visual =
            document.getElementById(
                e.code.replace("Key","")
            );


        if(visual){

            visual.classList.remove(
                "active"
            );

        }

    }
);


/* =========================================================
   HIT
========================================================= */

function hit(code){

    if(
        !playing ||
        paused
    ){

        return;

    }


    const lane =
        keys.indexOf(code);


    let bestIndex = -1;

    let smallest =
        Infinity;


    for(
        let i=0;
        i<notes.length;
        i++
    ){

        if(
            notes[i].lane !== lane
        ){

            continue;

        }


        const distance =
            Math.abs(
                notes[i].y - targetY
            );


        if(
            distance < smallest
        ){

            smallest = distance;

            bestIndex = i;

        }

    }


    if(
        bestIndex === -1 ||
        smallest > 65
    ){

        combo = 0;

        updateStats();

        showMessage(
            "MISS!",
            "miss"
        );

        return;

    }


    notes.splice(
        bestIndex,
        1
    );


    if(smallest <= 20){

        score +=
            100 + combo * 2;

        combo++;

        showMessage(
            "PERFECT! ✨",
            "perfect"
        );

    }
    else if(smallest <= 42){

        score +=
            50 + combo;

        combo++;

        showMessage(
            "GOOD! 👍",
            "good"
        );

    }
    else{

        score += 20;

        combo++;

        showMessage(
            "OK!",
            "good"
        );

    }


    if(combo > best){

        best = combo;

    }


    updateStats();

}


/* =========================================================
   SPAWN NOTES
========================================================= */

setInterval(
    () => {

        if(
            !playing ||
            paused
        ){

            return;

        }


        notes.push({

            lane:
                Math.floor(
                    Math.random()*4
                ),

            y:-35,

            speed:
                4.5 +
                Math.random()*1.5

        });

    },
    600
);


/* =========================================================
   MESSAGE
========================================================= */

let messageTimer;


function showMessage(
    text,
    type
){

    const el =
        document.getElementById(
            "message"
        );


    el.textContent =
        text;


    el.className =
        type || "";


    clearTimeout(
        messageTimer
    );


    messageTimer =
        setTimeout(
            () => {

                el.textContent =
                    "";

                el.className =
                    "";

            },
            600
        );

}


/* =========================================================
   AUDIO STATUS
========================================================= */

function setAudio(
    text,
    active
){

    const el =
        document.getElementById(
            "audioStatus"
        );


    el.textContent =
        text;


    el.className =
        active
            ? "audio playing"
            : "audio";

}


/* =========================================================
   DRAW
========================================================= */

function draw(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* BACKGROUND */

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            canvas.height
        );


    gradient.addColorStop(
        0,
        "#050809"
    );


    gradient.addColorStop(
        1,
        "#111a1e"
    );


    ctx.fillStyle =
        gradient;


    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* LANES */

    for(
        let i=0;
        i<4;
        i++
    ){

        const left =
            i === 0
                ? 0
                : (
                    laneX[i-1] +
                    laneX[i]
                ) / 2;


        const right =
            i === 3
                ? canvas.width
                : (
                    laneX[i] +
                    laneX[i+1]
                ) / 2;


        ctx.fillStyle =
            i%2===0
                ? "#ffffff04"
                : "#ffffff09";


        ctx.fillRect(
            left,
            0,
            right-left,
            canvas.height
        );

    }


    /* LINES */

    ctx.strokeStyle =
        "#30393d";

    ctx.lineWidth = 2;


    for(
        let i=0;
        i<4;
        i++
    ){

        ctx.beginPath();

        ctx.moveTo(
            laneX[i],
            0
        );

        ctx.lineTo(
            laneX[i],
            canvas.height
        );

        ctx.stroke();

    }


    /* TARGET */

    ctx.fillStyle =
        "#1db95412";


    ctx.fillRect(
        0,
        targetY-45,
        canvas.width,
        90
    );


    for(
        let i=0;
        i<4;
        i++
    ){

        const active =
            keyState[keys[i]];


        ctx.strokeStyle =
            active
                ? "#1db954"
                : "#666";


        ctx.lineWidth =
            active
                ? 5
                : 2;


        ctx.beginPath();

        ctx.arc(
            laneX[i],
            targetY,
            radius,
            0,
            Math.PI*2
        );

        ctx.stroke();


        ctx.fillStyle =
            active
                ? "#1db954"
                : "#aaa";


        ctx.font =
            "bold 17px Arial";


        ctx.textAlign =
            "center";


        ctx.fillText(
            keyNames[i],
            laneX[i],
            targetY+6
        );

    }


    /* NOTES */

    if(
        playing &&
        !paused
    ){

        for(
            let i=notes.length-1;
            i>=0;
            i--
        ){

            const n =
                notes[i];


            n.y +=
                n.speed;


            ctx.shadowColor =
                colors[n.lane];

            ctx.shadowBlur =
                18;


            ctx.fillStyle =
                colors[n.lane];


            ctx.beginPath();

            ctx.arc(
                laneX[n.lane],
                n.y,
                radius-3,
                0,
                Math.PI*2
            );

            ctx.fill();


            ctx.shadowBlur = 0;


            ctx.fillStyle =
                "#ffffff88";


            ctx.beginPath();

            ctx.arc(
                laneX[n.lane]-7,
                n.y-7,
                6,
                0,
                Math.PI*2
            );

            ctx.fill();


            if(
                n.y >
                canvas.height+40
            ){

                notes.splice(i,1);

                combo = 0;

                updateStats();

                showMessage(
                    "MISS!",
                    "miss"
                );

            }

        }

    }


    /* PAUSE SCREEN */

    if(paused){

        ctx.fillStyle =
            "#00000099";


        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        ctx.fillStyle =
            "white";


        ctx.font =
            "bold 38px Arial";


        ctx.textAlign =
            "center";


        ctx.fillText(
            "⏸ PAUSED",
            canvas.width/2,
            canvas.height/2
        );

    }


    requestAnimationFrame(
        draw
    );

}


/* =========================================================
   LOAD
========================================================= */

renderLibrary();

draw();

</script>

</body>
</html>
