<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Texture Studio</title>

<script type="importmap">
{
  "imports": {
    "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>

<style>
*{
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#0b0d11;
    color:#eee;
}

button,input{
    font:inherit;
}

button{
    cursor:pointer;
}

.topbar{
    height:58px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 14px;
    background:#11141a;
    border-bottom:1px solid #292e38;
}

.logo{
    font-size:18px;
    font-weight:800;
    letter-spacing:1px;
}

.logo span{
    color:#a855f7;
}

.toolbar{
    display:flex;
    gap:7px;
    align-items:center;
}

.toolbar button,
.bottomTools button,
.inspector button{
    border:1px solid #303641;
    background:#171b22;
    color:#ddd;
    border-radius:7px;
    padding:7px 11px;
}

.toolbar button:hover,
.bottomTools button:hover,
.inspector button:hover{
    background:#222832;
}

.toolbar .primary{
    background:#7c3aed;
    border-color:#8b5cf6;
    color:#fff;
}

.layout{
    height:calc(100vh - 58px);
    display:grid;
    grid-template-columns:310px minmax(0,1fr) 300px;
}

.panel{
    min-height:0;
    background:#101319;
}

.library{
    display:flex;
    flex-direction:column;
    border-right:1px solid #292e38;
}

.inspector{
    overflow:auto;
    border-left:1px solid #292e38;
    padding-bottom:30px;
}

.panelTitle{
    height:48px;
    padding:0 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #292e38;
}

.panelTitle span{
    font-size:12px;
    font-weight:800;
    letter-spacing:.8px;
}

.panelTitle small{
    color:#9ca3af;
    font-size:9px;
}

.search{
    margin:10px;
    width:calc(100% - 20px);
    height:36px;
    border:1px solid #303641;
    border-radius:8px;
    background:#171b22;
    color:#fff;
    padding:0 11px;
    outline:none;
}

.search:focus{
    border-color:#8b5cf6;
}

.categories{
    display:flex;
    gap:6px;
    overflow-x:auto;
    overflow-y:hidden;
    padding:0 10px 9px;
    scrollbar-width:thin;
    flex-shrink:0;
}

.categories::-webkit-scrollbar{
    height:6px;
}

.categories::-webkit-scrollbar-thumb{
    background:#444;
    border-radius:10px;
}

.categories button{
    flex:0 0 auto;
    border:1px solid #303641;
    background:#171b22;
    color:#aaa;
    border-radius:7px;
    padding:7px 10px;
    font-size:10px;
    white-space:nowrap;
}

.categories button.active{
    background:#7c3aed;
    color:#fff;
    border-color:#8b5cf6;
}

.textureList{
    flex:1;
    min-height:0;
    overflow-y:auto;
    overflow-x:hidden;
    padding:4px 10px 20px;
    scrollbar-width:thin;
}

.textureList::-webkit-scrollbar{
    width:7px;
}

.textureList::-webkit-scrollbar-thumb{
    background:#3d424d;
    border-radius:10px;
}

.textureCard{
    display:flex;
    align-items:center;
    gap:9px;
    width:100%;
    min-height:65px;
    margin-bottom:7px;
    padding:6px;
    border:1px solid #292e38;
    border-radius:9px;
    background:#151920;
    transition:.15s;
    user-select:none;
}

.textureCard:hover{
    border-color:#8b5cf6;
    background:#1c2029;
    transform:translateX(1px);
}

.textureCard.loading{
    opacity:.65;
    border-color:#a855f7;
}

.textureCard img{
    width:54px;
    height:54px;
    flex:0 0 54px;
    object-fit:cover;
    border-radius:6px;
    background:#242933;
}

.textureCard img.thumbnailError{
    background:
        linear-gradient(45deg,#20242c 25%,transparent 25%),
        linear-gradient(-45deg,#20242c 25%,transparent 25%),
        linear-gradient(45deg,transparent 75%,#20242c 75%),
        linear-gradient(-45deg,transparent 75%,#20242c 75%);
    background-size:12px 12px;
    background-position:0 0,0 6px,6px -6px,-6px 0;
}

.textureCard strong{
    display:block;
    color:#f1f1f1;
    font-size:11px;
    line-height:15px;
}

.textureCard small{
    display:block;
    color:#8f96a3;
    margin-top:3px;
    font-size:9px;
}

.loading,
.empty,
.error{
    padding:25px 12px;
    text-align:center;
    color:#888;
    font-size:11px;
    line-height:18px;
}

.credit{
    padding:9px 12px;
    border-top:1px solid #292e38;
    color:#777;
    font-size:9px;
    flex-shrink:0;
}

.credit a{
    color:#a855f7;
}

.viewport{
    position:relative;
    min-width:0;
    min-height:0;
    background:#0d1015;
}

#viewer{
    position:absolute;
    inset:0;
}

#viewer canvas{
    display:block;
    width:100%;
    height:100%;
}

.viewerTop{
    position:absolute;
    top:12px;
    left:12px;
    right:12px;
    display:flex;
    justify-content:space-between;
    pointer-events:none;
}

.viewerTop span{
    background:rgba(10,12,16,.78);
    border:1px solid #303641;
    padding:7px 9px;
    border-radius:7px;
    font-size:10px;
}

#selectionInfo{
    color:#c4b5fd;
}

.bottomTools{
    position:absolute;
    left:50%;
    bottom:14px;
    transform:translateX(-50%);
    display:flex;
    gap:7px;
}

.bottomTools button{
    background:rgba(15,18,24,.9);
}

.crosshair{
    position:absolute;
    left:50%;
    top:50%;
    width:1px;
    height:1px;
    pointer-events:none;
}

.section{
    padding:12px 13px;
    border-bottom:1px solid #252a33;
}

.section>label{
    display:flex;
    justify-content:space-between;
    font-size:10px;
    color:#aaa;
    margin-bottom:8px;
}

.section b{
    color:#ddd;
    font-weight:500;
}

input[type="range"]{
    width:100%;
    accent-color:#8b5cf6;
}

.colorRow{
    display:flex;
    align-items:center;
    gap:10px;
}

#baseColor{
    width:48px;
    height:32px;
    border:0;
    padding:0;
    background:none;
}

#baseColorValue{
    color:#aaa;
    font-size:10px;
}

.wide{
    width:100%;
    margin-top:7px;
}

.danger{
    border-color:#7f1d1d!important;
    color:#fca5a5!important;
}

.layer{
    display:flex;
    align-items:center;
    gap:7px;
    padding:8px;
    margin-bottom:5px;
    background:#171b22;
    border:1px solid #303641;
    border-radius:7px;
    font-size:10px;
}

.layer.selected{
    border-color:#7c3aed;
}

.layer button{
    margin-left:auto;
    padding:2px 7px;
}
</style>
</head>

<body>

<header class="topbar">
    <div class="logo">TEXTURE<span>STUDIO</span></div>

    <div class="toolbar">
        <button id="uploadModel">＋ Model</button>
        <button id="uploadTexture">＋ Texture</button>
        <button id="undoBtn">↶</button>
        <button id="redoBtn">↷</button>
        <button id="saveProject">Save</button>
        <button id="exportGLB" class="primary">Export GLB</button>
    </div>

    <input id="modelInput" type="file" accept=".glb,.gltf,.bin" hidden>
    <input id="textureInput" type="file" accept="image/*" hidden>
</header>

<main class="layout">

<aside class="panel library">

    <div class="panelTitle">
        <span>TEXTURE LIBRARY</span>
        <small>POLY HAVEN</small>
    </div>

    <input
        id="searchBox"
        class="search"
        placeholder="Search wood, glass, skin..."
    >

    <div class="categories">

        <button data-cat="all" class="active">ALL</button>

        <button data-cat="wood">WOOD</button>
        <button data-cat="stone">STONE</button>
        <button data-cat="metal">METAL</button>
        <button data-cat="concrete">CONCRETE</button>
        <button data-cat="ground">GROUND</button>

        <button data-cat="brick">BRICK</button>
        <button data-cat="wall">WALL</button>
        <button data-cat="floor">FLOOR</button>
        <button data-cat="roof">ROOF</button>
        <button data-cat="fabric">FABRIC</button>

        <button data-cat="glass">🪟 GLASS</button>
        <button data-cat="creature">🐾 CREATURE</button>
        <button data-cat="cartoon">🎨 CARTOON</button>

    </div>

    <div id="textureList" class="textureList">
        <div class="loading">
            Đang tải thư viện texture...
        </div>
    </div>

    <div class="credit">
        Powered by
        <a href="https://polyhaven.com" target="_blank">
            Poly Haven
        </a>
    </div>

</aside>


<section class="viewport">

    <div id="viewer"></div>

    <div class="viewerTop">
        <span id="modelName">No model</span>
        <span id="selectionInfo">Nothing selected</span>
    </div>

    <div class="crosshair"></div>

    <div class="bottomTools">
        <button id="focusBtn">Focus</button>
        <button id="wireBtn">Wireframe</button>
        <button id="gridBtn">Grid</button>
    </div>

</section>


<aside class="panel inspector">

    <div class="panelTitle">
        <span>MATERIAL</span>
        <small id="selectedName">NONE</small>
    </div>

    <div class="section">

        <label>
            Base Color
        </label>

        <div class="colorRow">
            <input id="baseColor" type="color" value="#ffffff">
            <span id="baseColorValue">#ffffff</span>
        </div>

    </div>


    <div class="section">

        <label>
            Texture Scale
            <b id="scaleValue">1.00</b>
        </label>

        <input
            id="scale"
            type="range"
            min=".05"
            max="20"
            step=".05"
            value="1"
        >

    </div>


    <div class="section">

        <label>
            Rotation
            <b id="rotationValue">0°</b>
        </label>

        <input
            id="rotation"
            type="range"
            min="-180"
            max="180"
            step="1"
            value="0"
        >

    </div>


    <div class="section">

        <label>
            Offset X
            <b id="offsetXValue">0</b>
        </label>

        <input
            id="offsetX"
            type="range"
            min="-2"
            max="2"
            step=".01"
            value="0"
        >

    </div>


    <div class="section">

        <label>
            Offset Y
            <b id="offsetYValue">0</b>
        </label>

        <input
            id="offsetY"
            type="range"
            min="-2"
            max="2"
            step=".01"
            value="0"
        >

    </div>


    <div class="section">

        <label>
            Roughness
            <b id="roughnessValue">0.50</b>
        </label>

        <input
            id="roughness"
            type="range"
            min="0"
            max="1"
            step=".01"
            value=".5"
        >

    </div>


    <div class="section">

        <label>
            Metallic
            <b id="metallicValue">0.00</b>
        </label>

        <input
            id="metallic"
            type="range"
            min="0"
            max="1"
            step=".01"
            value="0"
        >

    </div>


    <div class="section">

        <label>Layers</label>

        <div id="layers">

            <div class="layer selected">
                <span>●</span>
                <span>Base Material</span>
                <button>×</button>
            </div>

        </div>

        <button id="newLayer" class="wide">
            ＋ Add Layer
        </button>

    </div>


    <div class="section">

        <label>TOOLS</label>

        <button id="removeTexture" class="danger wide">
            Remove Texture
        </button>

        <button id="resetMaterial" class="wide">
            Reset Material
        </button>

    </div>

</aside>

</main>


<script type="module">

import * as THREE from "three";

import {
    OrbitControls
} from "three/addons/controls/OrbitControls.js";

import {
    GLTFLoader
} from "three/addons/loaders/GLTFLoader.js";

import {
    GLTFExporter
} from "three/addons/exporters/GLTFExporter.js";


/* =========================================================
   CONFIG
========================================================= */

const API = "https://api.polyhaven.com";

const ASSET_CACHE_KEY =
    "textureStudio_polyhaven_assets_v5";

const MAX_LOCAL_TEXTURE_SIZE = 2048;

const ITEMS_PER_PAGE = 40;


/* =========================================================
   CATEGORY KEYWORDS
========================================================= */

const CATEGORY_KEYWORDS = {

    all: [],

    wood: [
        "wood",
        "timber",
        "plank",
        "oak",
        "pine",
        "bark",
        "wooden"
    ],

    stone: [
        "stone",
        "rock",
        "marble",
        "granite",
        "slate",
        "cobble",
        "pebble"
    ],

    metal: [
        "metal",
        "steel",
        "iron",
        "aluminium",
        "aluminum",
        "copper",
        "gold",
        "silver",
        "bronze",
        "rust"
    ],

    concrete: [
        "concrete",
        "cement"
    ],

    ground: [
        "ground",
        "dirt",
        "soil",
        "sand",
        "mud",
        "gravel",
        "earth"
    ],

    brick: [
        "brick",
        "brickwall",
        "brick wall"
    ],

    wall: [
        "wall",
        "plaster",
        "stucco",
        "facade",
        "facade"
    ],

    floor: [
        "floor",
        "flooring",
        "parquet",
        "tile"
    ],

    roof: [
        "roof",
        "roofing",
        "roof tile",
        "slate roof"
    ],

    fabric: [
        "fabric",
        "cloth",
        "cotton",
        "wool",
        "denim",
        "carpet",
        "leather"
    ],

    glass: [
        "glass",
        "window",
        "frosted",
        "crystal",
        "transparent",
        "translucent",
        "reflective",
        "reflection",
        "tinted",
        "ice",
        "mirror",
        "plexiglass"
    ],

    creature: [
        "skin",
        "scales",
        "scale",
        "fur",
        "hair",
        "leather",
        "bone",
        "horn",
        "shell",
        "organic",
        "creature",
        "reptile",
        "snake",
        "fish",
        "animal",
        "feather",
        "feathers",
        "hide",
        "wings",
        "wing",
        "monster",
        "alien"
    ],

    cartoon: [
        "toon",
        "cartoon",
        "stylized",
        "stylised",
        "hand painted",
        "hand-painted",
        "painted",
        "comic",
        "fantasy",
        "colorful",
        "colourful",
        "illustrated",
        "stylized"
    ]
};


/* =========================================================
   GLOBAL
========================================================= */

let scene;
let camera;
let renderer;
let controls;

let model = null;

let selectedMesh = null;

let selectedMaterialIndex = 0;

let wireframe = false;

let gridVisible = true;

let textureApplyToken = 0;

let libraryPage = 1;

let libraryLoading = false;

let libraryFiltered = [];

let polyAssets = [];

let history = [];

let historyIndex = -1;

const textureCache = new Map();

const pendingTextureLoads = new Map();

const polyFilesCache = new Map();

const raycaster = new THREE.Raycaster();

const mouse = new THREE.Vector2();

const viewer =
    document.getElementById("viewer");

const textureList =
    document.getElementById("textureList");


/* =========================================================
   INIT
========================================================= */

init();

loadPolyHaven();


function init(){

    scene = new THREE.Scene();

    scene.background =
        new THREE.Color(0x101216);


    camera =
        new THREE.PerspectiveCamera(
            45,
            Math.max(viewer.clientWidth,1) /
            Math.max(viewer.clientHeight,1),
            .01,
            5000
        );

    camera.position.set(3,2,5);


    renderer =
        new THREE.WebGLRenderer({
            antialias:true,
            preserveDrawingBuffer:false,
            powerPreference:"high-performance"
        });


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio || 1,
            1.5
        )
    );


    renderer.setSize(
        Math.max(viewer.clientWidth,1),
        Math.max(viewer.clientHeight,1),
        false
    );


    renderer.outputColorSpace =
        THREE.SRGBColorSpace;


    viewer.appendChild(
        renderer.domElement
    );


    controls =
        new OrbitControls(
            camera,
            renderer.domElement
        );

    controls.enableDamping = true;

    controls.dampingFactor = .08;


    scene.add(
        new THREE.HemisphereLight(
            0xffffff,
            0x202020,
            2
        )
    );


    const key =
        new THREE.DirectionalLight(
            0xffffff,
            3
        );

    key.position.set(4,8,5);

    scene.add(key);


    const fill =
        new THREE.DirectionalLight(
            0x8aaaff,
            1
        );

    fill.position.set(-4,2,-4);

    scene.add(fill);


    window.addEventListener(
        "resize",
        resize
    );


    renderer.domElement.addEventListener(
        "pointerdown",
        selectObject
    );


    document
        .getElementById("uploadModel")
        .onclick =
        () =>
        document
            .getElementById("modelInput")
            .click();


    document
        .getElementById("uploadTexture")
        .onclick =
        () =>
        document
            .getElementById("textureInput")
            .click();


    document
        .getElementById("modelInput")
        .addEventListener(
            "change",
            loadModel
        );


    document
        .getElementById("textureInput")
        .addEventListener(
            "change",
            uploadTexture
        );


    document
        .getElementById("searchBox")
        .addEventListener(
            "input",
            debounce(
                () => {
                    libraryPage = 1;
                    renderLibrary();
                },
                100
            )
        );


    document
        .querySelectorAll("[data-cat]")
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    document
                        .querySelectorAll(
                            "[data-cat]"
                        )
                        .forEach(
                            x =>
                            x.classList.remove(
                                "active"
                            )
                        );

                    button.classList.add(
                        "active"
                    );

                    libraryPage = 1;

                    renderLibrary();

                }
            );

        });


    textureList.addEventListener(
        "scroll",
        handleLibraryScroll
    );


    document
        .getElementById("wireBtn")
        .onclick =
        toggleWire;


    document
        .getElementById("gridBtn")
        .onclick =
        toggleGrid;


    document
        .getElementById("focusBtn")
        .onclick =
        focusModel;


    document
        .getElementById("removeTexture")
        .onclick =
        removeTexture;


    document
        .getElementById("resetMaterial")
        .onclick =
        resetMaterial;


    document
        .getElementById("undoBtn")
        .onclick =
        undo;


    document
        .getElementById("redoBtn")
        .onclick =
        redo;


    document
        .getElementById("saveProject")
        .onclick =
        saveProject;


    document
        .getElementById("exportGLB")
        .onclick =
        exportGLB;


    document
        .getElementById("newLayer")
        .onclick =
        addLayer;


    renderLibrary();

    animate();

}


/* =========================================================
   RESIZE
========================================================= */

function resize(){

    const w =
        Math.max(viewer.clientWidth,1);

    const h =
        Math.max(viewer.clientHeight,1);


    camera.aspect = w / h;

    camera.updateProjectionMatrix();

    renderer.setSize(
        w,
        h,
        false
    );
}


/* =========================================================
   POLY HAVEN
========================================================= */

async function loadPolyHaven(){

    try{

        const cached =
            JSON.parse(
                localStorage.getItem(
                    ASSET_CACHE_KEY
                ) || "null"
            );


        if(
            cached &&
            Array.isArray(cached.assets) &&
            cached.assets.length
        ){

            polyAssets =
                cached.assets;

            renderLibrary();

        }

    }catch(error){

        console.warn(
            "Cache error:",
            error
        );

    }


    try{

        const response =
            await fetch(
                API + "/assets",
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        polyAssets =
            Object
                .entries(data)
                .filter(
                    ([,asset]) =>
                        asset &&
                        asset.type === 1
                )
                .map(
                    ([id,asset]) => ({

                        id,

                        name:
                            asset.name ||
                            id,

                        category:
                            asset.category ||
                            "",

                        tags:
                            Array.isArray(
                                asset.tags
                            )
                            ?
                            asset.tags
                            :
                            [],

                        thumbnail_url:
                            asset.thumbnail_url ||
                            ""

                    })
                );


        try{

            localStorage.setItem(
                ASSET_CACHE_KEY,
                JSON.stringify({
                    time:Date.now(),
                    assets:polyAssets
                })
            );

        }catch(_){}


        libraryPage = 1;

        renderLibrary();


    }catch(error){

        console.error(
            "Poly Haven API:",
            error
        );


        if(!polyAssets.length){

            textureList.innerHTML = `
                <div class="error">
                    Không tải được thư viện online.<br><br>
                    Bạn vẫn có thể dùng
                    <b>＋ Texture</b>
                    để đưa texture riêng vào model.
                    <br><br>
                    Nếu mở HTML trực tiếp,
                    hãy chạy bằng local server/proxy
                    để API Poly Haven hoạt động.
                </div>
            `;

        }

    }

}


/* =========================================================
   CATEGORY
========================================================= */

function assetMatchesCategory(
    asset,
    category
){

    if(category === "all")
        return true;


    const text = `
        ${asset.name || ""}
        ${asset.category || ""}
        ${(asset.tags || []).join(" ")}
    `.toLowerCase();


    const keywords =
        CATEGORY_KEYWORDS[category] ||
        [];


    return keywords.some(
        keyword =>
            text.includes(
                keyword.toLowerCase()
            )
    );

}


/* =========================================================
   FILTER
========================================================= */

function getFilteredAssets(){

    const query =
        document
            .getElementById("searchBox")
            .value
            .toLowerCase()
            .trim();


    const category =
        document
            .querySelector(
                "[data-cat].active"
            )
            ?.dataset.cat ||
        "all";


    return polyAssets.filter(
        asset => {

            const text = `
                ${asset.name || ""}
                ${asset.category || ""}
                ${(asset.tags || []).join(" ")}
            `.toLowerCase();


            const searchOK =
                !query ||
                text.includes(query);


            return (
                searchOK &&
                assetMatchesCategory(
                    asset,
                    category
                )
            );

        }
    );

}


/* =========================================================
   RENDER LIBRARY
========================================================= */

function renderLibrary(){

    libraryFiltered =
        getFilteredAssets();


    const amount =
        libraryPage *
        ITEMS_PER_PAGE;


    const items =
        libraryFiltered.slice(
            0,
            amount
        );


    textureList.innerHTML = "";


    if(!items.length){

        textureList.innerHTML = `
            <div class="empty">
                Không tìm thấy vật liệu.
            </div>
        `;

        return;

    }


    const fragment =
        document.createDocumentFragment();


    for(const asset of items){

        const card =
            document.createElement("div");


        card.className =
            "textureCard";


        card.dataset.assetId =
            asset.id;


        const img =
            document.createElement("img");


        img.loading = "lazy";

        img.decoding = "async";

        img.alt =
            asset.name;


        /*
         * Thumbnail lỗi KHÔNG khóa card.
         */

        img.onerror = () => {

            img.removeAttribute("src");

            img.classList.add(
                "thumbnailError"
            );

        };


        if(asset.thumbnail_url){

            img.src =
                asset.thumbnail_url;

        }


        const info =
            document.createElement("div");


        const strong =
            document.createElement("strong");


        const small =
            document.createElement("small");


        strong.textContent =
            asset.name;


        small.textContent =
            asset.category ||
            "PBR";


        info.append(
            strong,
            small
        );


        card.append(
            img,
            info
        );


        /*
         * CLICK GẮN TRỰC TIẾP CARD.
         * Không phụ thuộc ảnh.
         */

        card.addEventListener(
            "click",
            () => {

                applyPolyMaterial(
                    asset,
                    card
                );

            }
        );


        fragment.appendChild(
            card
        );

    }


    textureList.appendChild(
        fragment
    );


    if(
        items.length <
        libraryFiltered.length
    ){

        const more =
            document.createElement(
                "div"
            );

        more.className =
            "loading";

        more.textContent =
            "Cuộn xuống để tải thêm...";

        textureList.appendChild(
            more
        );

    }

}


/* =========================================================
   INFINITE SCROLL
========================================================= */

function handleLibraryScroll(){

    if(libraryLoading)
        return;


    const nearBottom =
        textureList.scrollTop +
        textureList.clientHeight >=
        textureList.scrollHeight -
        250;


    if(!nearBottom)
        return;


    if(
        libraryPage *
        ITEMS_PER_PAGE >=
        libraryFiltered.length
    )
        return;


    libraryLoading = true;


    setTimeout(
        () => {

            libraryPage++;

            renderLibrary();

            libraryLoading = false;

        },
        80
    );

}


/* =========================================================
   APPLY POLY MATERIAL
========================================================= */

async function applyPolyMaterial(
    asset,
    card
){

    if(!selectedMesh){

        alert(
            "Hãy click vào một mesh trước."
        );

        return;

    }


    const targetMesh =
        selectedMesh;


    const targetMaterialIndex =
        selectedMaterialIndex;


    const applyId =
        ++textureApplyToken;


    const material =
        ensureEditableMaterial(
            targetMesh
        );


    if(card){

        card.dataset.loading =
            "1";

        card.classList.add(
            "loading"
        );

    }


    try{

        const files =
            await getPolyFiles(
                asset.id
            );


        const maps =
            findTextureFiles(
                files
            );


        if(
            !Object
                .values(maps)
                .some(Boolean)
        ){

            throw new Error(
                "Không tìm thấy PBR maps"
            );

        }


        saveHistory();


        /*
         * BASE COLOR
         */

        if(maps.diff){

            const diff =
                await loadCachedTexture(
                    maps.diff,
                    THREE.SRGBColorSpace
                );


            if(
                !isCurrentApply(
                    applyId,
                    targetMesh,
                    targetMaterialIndex
                )
            )
                return;


            material.map =
                diff;


            material.needsUpdate =
                true;


            applyUVToMaterial(
                material
            );


            updateSelectionUI();

        }


        /*
         * KÍNH
         */

        if(
            isGlassAsset(asset)
        ){

            applyGlassMaterial(
                material
            );

        }


        /*
         * CREATURE
         */

        if(
            isCreatureAsset(asset)
        ){

            material.transparent =
                false;

            material.depthWrite =
                true;

        }


        /*
         * BACKGROUND PBR MAPS
         */

        const jobs = [];


        if(maps.rough){

            jobs.push(
                loadCachedTexture(
                    maps.rough,
                    THREE.NoColorSpace
                ).then(
                    tex => ({
                        type:"rough",
                        tex
                    })
                )
            );

        }


        if(maps.normal){

            jobs.push(
                loadCachedTexture(
                    maps.normal,
                    THREE.NoColorSpace
                ).then(
                    tex => ({
                        type:"normal",
                        tex
                    })
                )
            );

        }


        if(maps.ao){

            jobs.push(
                loadCachedTexture(
                    maps.ao,
                    THREE.NoColorSpace
                ).then(
                    tex => ({
                        type:"ao",
                        tex
                    })
                )
            );

        }


        if(maps.metal){

            jobs.push(
                loadCachedTexture(
                    maps.metal,
                    THREE.NoColorSpace
                ).then(
                    tex => ({
                        type:"metal",
                        tex
                    })
                )
            );

        }


        Promise.all(jobs)
            .then(
                loadedMaps => {

                    if(
                        !isCurrentApply(
                            applyId,
                            targetMesh,
                            targetMaterialIndex
                        )
                    )
                        return;


                    for(
                        const item
                        of loadedMaps
                    ){

                        if(
                            item.type ===
                            "rough"
                        )
                            material.roughnessMap =
                                item.tex;


                        if(
                            item.type ===
                            "normal"
                        )
                            material.normalMap =
                                item.tex;


                        if(
                            item.type ===
                            "ao"
                        ){

                            material.aoMap =
                                item.tex;

                            ensureUV2(
                                targetMesh
                            );

                        }


                        if(
                            item.type ===
                            "metal"
                        )
                            material.metalnessMap =
                                item.tex;

                    }


                    material.needsUpdate =
                        true;


                    applyUVToMaterial(
                        material
                    );


                    updateSelectionUI();

                }
            )
            .catch(
                error =>
                    console.warn(
                        "PBR map:",
                        error
                    )
            );


    }catch(error){

        console.error(
            "Texture error:",
            error
        );


        if(
            isCurrentApply(
                applyId,
                targetMesh,
                targetMaterialIndex
            )
        ){

            alert(
                "Không thể tải texture này."
            );

        }

    }finally{

        if(card){

            card.dataset.loading =
                "0";

            card.classList.remove(
                "loading"
            );

        }

    }

}


/* =========================================================
   SPECIAL MATERIAL TYPES
========================================================= */

function isGlassAsset(asset){

    const text = `
        ${asset.name || ""}
        ${asset.category || ""}
        ${(asset.tags || []).join(" ")}
    `.toLowerCase();


    return CATEGORY_KEYWORDS.glass.some(
        key =>
            text.includes(
                key
            )
    );

}


function isCreatureAsset(asset){

    const text = `
        ${asset.name || ""}
        ${asset.category || ""}
        ${(asset.tags || []).join(" ")}
    `.toLowerCase();


    return CATEGORY_KEYWORDS.creature.some(
        key =>
            text.includes(
                key
            )
    );

}


function applyGlassMaterial(
    material
){

    if(!material)
        return;


    material.transparent =
        true;


    material.opacity =
        .48;


    material.metalness =
        .05;


    material.roughness =
        .08;


    material.depthWrite =
        false;


    material.side =
        THREE.DoubleSide;


    material.needsUpdate =
        true;

}


/* =========================================================
   CURRENT REQUEST
========================================================= */

function isCurrentApply(
    id,
    mesh,
    materialIndex
){

    return (
        id === textureApplyToken &&
        selectedMesh === mesh &&
        selectedMaterialIndex ===
            materialIndex
    );

}


/* =========================================================
   FILES
========================================================= */

async function getPolyFiles(
    assetId
){

    if(
        polyFilesCache.has(
            assetId
        )
    ){

        return polyFilesCache.get(
            assetId
        );

    }


    const sessionKey =
        "polyFiles:" +
        assetId;


    try{

        const cached =
            sessionStorage.getItem(
                sessionKey
            );


        if(cached){

            const parsed =
                JSON.parse(cached);


            polyFilesCache.set(
                assetId,
                parsed
            );


            return parsed;

        }

    }catch(_){}


    const response =
        await fetch(
            `${API}/files/${encodeURIComponent(assetId)}`,
            {
                cache:"force-cache"
            }
        );


    if(!response.ok){

        throw new Error(
            "HTTP " +
            response.status
        );

    }


    const files =
        await response.json();


    polyFilesCache.set(
        assetId,
        files
    );


    try{

        sessionStorage.setItem(
            sessionKey,
            JSON.stringify(files)
        );

    }catch(_){}


    return files;

}


/* =========================================================
   FIND PBR MAPS
========================================================= */

function findTextureFiles(
    obj
){

    const candidates = {

        diff:[],
        rough:[],
        normal:[],
        ao:[],
        metal:[]

    };


    function put(
        type,
        url,
        key
    ){

        if(!url)
            return;


        candidates[type].push({

            url,

            lower:
                `${key} ${url}`
                    .toLowerCase()

        });

    }


    function walk(
        value
    ){

        if(
            !value ||
            typeof value !==
            "object"
        )
            return;


        for(
            const key
            in value
        ){

            const v =
                value[key];


            if(
                v &&
                typeof v ===
                "object"
            ){

                if(v.url){

                    const s =
                        `${key} ${v.url}`
                            .toLowerCase();


                    if(
                        s.includes("diff") ||
                        s.includes("albedo") ||
                        s.includes("basecolor")
                    )
                        put(
                            "diff",
                            v.url,
                            key
                        );


                    if(
                        s.includes("rough")
                    )
                        put(
                            "rough",
                            v.url,
                            key
                        );


                    if(
                        s.includes("nor_gl") ||
                        s.includes("normal")
                    )
                        put(
                            "normal",
                            v.url,
                            key
                        );


                    if(
                        s.includes("ao")
                    )
                        put(
                            "ao",
                            v.url,
                            key
                        );


                    if(
                        s.includes("metal")
                    )
                        put(
                            "metal",
                            v.url,
                            key
                        );

                }


                walk(v);

            }

        }

    }


    function pick(
        list
    ){

        if(!list.length)
            return null;


        /*
         * Ưu tiên file vừa phải
         * để tránh lag.
         */

        const score =
            item => {

                const s =
                    item.lower;


                if(
                    /(^|[^0-9])512([^0-9]|$)/
                    .test(s)
                )
                    return 5;


                if(
                    /(^|[^0-9])1k([^0-9]|$)/
                    .test(s)
                )
                    return 10;


                if(
                    /(^|[^0-9])2k([^0-9]|$)/
                    .test(s)
                )
                    return 20;


                if(
                    /(^|[^0-9])4k([^0-9]|$)/
                    .test(s)
                )
                    return 40;


                return 30;

            };


        return [...list]
            .sort(
                (a,b) =>
                    score(a) -
                    score(b)
            )[0]
            .url;

    }


    walk(obj);


    return {

        diff:
            pick(
                candidates.diff
            ),

        rough:
            pick(
                candidates.rough
            ),

        normal:
            pick(
                candidates.normal
            ),

        ao:
            pick(
                candidates.ao
            ),

        metal:
            pick(
                candidates.metal
            )

    };

}


/* =========================================================
   TEXTURE LOADER
========================================================= */

function loadCachedTexture(
    url,
    colorSpace
){

    const key =
        `${url}|${colorSpace}`;


    if(
        textureCache.has(key)
    ){

        return Promise.resolve(
            textureCache.get(key)
        );

    }


    if(
        pendingTextureLoads.has(key)
    ){

        return pendingTextureLoads.get(
            key
        );

    }


    const promise =
        new Promise(
            (resolve,reject) => {

                const loader =
                    new THREE.TextureLoader();


                loader.load(

                    url,

                    texture => {

                        prepareTexture(
                            texture,
                            colorSpace
                        );


                        textureCache.set(
                            key,
                            texture
                        );


                        pendingTextureLoads.delete(
                            key
                        );


                        resolve(
                            texture
                        );

                    },

                    undefined,

                    error => {

                        pendingTextureLoads.delete(
                            key
                        );


                        reject(error);

                    }

                );

            }
        );


    pendingTextureLoads.set(
        key,
        promise
    );


    return promise;

}


/* =========================================================
   TEXTURE PREPARE
========================================================= */

function prepareTexture(
    texture,
    colorSpace
){

    texture.colorSpace =
        colorSpace;


    texture.wrapS =
        THREE.RepeatWrapping;


    texture.wrapT =
        THREE.RepeatWrapping;


    texture.anisotropy =
        Math.min(
            renderer
                .capabilities
                .getMaxAnisotropy(),
            4
        );

}


/* =========================================================
   MATERIAL
========================================================= */

function ensureEditableMaterial(
    mesh
){

    if(
        Array.isArray(
            mesh.material
        )
    ){

        if(
            !mesh.userData
                .textureStudioCloned
        ){

            mesh.material =
                mesh.material.map(
                    m =>
                    m.clone()
                );


            mesh.userData
                .textureStudioCloned =
                true;

        }


        return (
            mesh.material[
                selectedMaterialIndex
            ] ||
            mesh.material[0]
        );

    }


    if(
        !mesh.userData
            .textureStudioCloned
    ){

        mesh.material =
            mesh.material.clone();


        mesh.userData
            .textureStudioCloned =
            true;

    }


    return mesh.material;

}


function getSelectedMaterial(){

    if(
        !selectedMesh ||
        !selectedMesh.material
    )
        return null;


    if(
        Array.isArray(
            selectedMesh.material
        )
    ){

        return (
            selectedMesh.material[
                selectedMaterialIndex
            ] ||
            selectedMesh.material[0] ||
            null
        );

    }


    return selectedMesh.material;

}


/* =========================================================
   MODEL
========================================================= */

function loadModel(
    event
){

    const file =
        event.target.files[0];


    event.target.value = "";


    if(!file)
        return;


    const url =
        URL.createObjectURL(file);


    const loader =
        new GLTFLoader();


    loader.load(

        url,

        gltf => {

            disposeModel(
                model
            );


            model =
                gltf.scene;


            selectedMesh =
                null;


            selectedMaterialIndex =
                0;


            textureApplyToken++;


            scene.add(
                model
            );


            model.traverse(
                obj => {

                    if(!obj.isMesh)
                        return;


                    obj.castShadow =
                        false;


                    obj.receiveShadow =
                        false;


                    const mats =
                        Array.isArray(
                            obj.material
                        )
                        ?
                        obj.material
                        :
                        [obj.material];


                    mats.forEach(
                        mat => {

                            if(mat?.map){

                                mat.map.colorSpace =
                                    THREE.SRGBColorSpace;

                            }

                        }
                    );

                }
            );


            centerModel();


            document
                .getElementById(
                    "modelName"
                )
                .textContent =
                file.name;


            document
                .getElementById(
                    "selectionInfo"
                )
                .textContent =
                "Nothing selected";


            document
                .getElementById(
                    "selectedName"
                )
                .textContent =
                "NONE";


            URL.revokeObjectURL(
                url
            );

        },

        undefined,

        error => {

            console.error(error);

            URL.revokeObjectURL(
                url
            );

            alert(
                "Không thể đọc model."
            );

        }

    );

}


/* =========================================================
   DISPOSE MODEL
========================================================= */

function disposeModel(
    root
){

    if(!root)
        return;


    root.traverse(
        obj => {

            if(!obj.isMesh)
                return;


            obj.geometry?.dispose();


            const mats =
                Array.isArray(
                    obj.material
                )
                ?
                obj.material
                :
                [obj.material];


            mats.forEach(
                mat => {

                    if(!mat)
                        return;


                    disposeMaterialTextures(
                        mat
                    );


                    mat.dispose();

                }
            );

        }
    );


    scene.remove(
        root
    );

}


/* =========================================================
   DISPOSE MATERIAL TEXTURES
========================================================= */

function disposeMaterialTextures(
    material
){

    const maps = [

        material.map,
        material.normalMap,
        material.roughnessMap,
        material.metalnessMap,
        material.aoMap

    ];


    maps.forEach(
        texture => {

            if(texture)
                releaseTextureIfUnused(
                    texture
                );

        }
    );

}


/* =========================================================
   CENTER MODEL
========================================================= */

function centerModel(){

    if(!model)
        return;


    const box =
        new THREE.Box3()
            .setFromObject(
                model
            );


    const center =
        box.getCenter(
            new THREE.Vector3()
        );


    model.position.sub(
        center
    );


    const size =
        box.getSize(
            new THREE.Vector3()
        );


    const max =
        Math.max(
            size.x,
            size.y,
            size.z,
            .1
        );


    const distance =
        max * 2.5;


    camera.position.set(
        distance*.8,
        distance*.6,
        distance
    );


    controls.target.set(
        0,
        0,
        0
    );


    controls.update();

}


/* =========================================================
   SELECT MESH
========================================================= */

function selectObject(
    event
){

    if(!model)
        return;


    const rect =
        renderer
            .domElement
            .getBoundingClientRect();


    mouse.x =
        (
            (
                event.clientX -
                rect.left
            ) /
            rect.width
        ) * 2 - 1;


    mouse.y =
        -(
            (
                event.clientY -
                rect.top
            ) /
            rect.height
        ) * 2 + 1;


    raycaster.setFromCamera(
        mouse,
        camera
    );


    const hits =
        raycaster.intersectObject(
            model,
            true
        );


    if(!hits.length)
        return;


    const hit =
        hits[0];


    if(!hit.object.isMesh)
        return;


    selectedMesh =
        hit.object;


    selectedMaterialIndex =
        hit.face?.materialIndex ??
        0;


    textureApplyToken++;


    updateSelectionUI();

}

            "offsetY"
        );


    const roughness =
        document.getElementById(
            "roughness"
        );


    const metallic =
        document.getElementById(
            "metallic"
        );


    const baseColor =
        document.getElementById(
            "baseColor"
        );


    scale.oninput =
        () => {

            document
                .getElementById(
                    "scaleValue"
                )
                .textContent =
                Number(
                    scale.value
                ).toFixed(2);


            applyUV();

        };


    rotation.oninput =
        () => {

            document
                .getElementById(
                    "rotationValue"
                )
                .textContent =
                rotation.value +
                "°";


            applyUV();

        };


    offsetX.oninput =
        () => {

            document
                .getElementById(
                    "offsetXValue"
                )
                .textContent =
                offsetX.value;


            applyUV();

        };


    offsetY.oninput =
        () => {

            document
                .getElementById(
                    "offsetYValue"
                )
                .textContent =
                offsetY.value;


            applyUV();

        };


    roughness.oninput =
        () => {

            const m =
                getSelectedMaterial();


            if(!m)
                return;


            m.roughness =
                Number(
                    roughness.value
                );


            document
                .getElementById(
                    "roughnessValue"
                )
                .textContent =
                Number(
                    roughness.value
                ).toFixed(2);

        };


    metallic.oninput =
        () => {

            const m =
                getSelectedMaterial();


            if(!m)
                return;


            m.metalness =
                Number(
                    metallic.value
                );


            document
                .getElementById(
                    "metallicValue"
                )
                .textContent =
                Number(
                    metallic.value
                ).toFixed(2);

        };


    baseColor.oninput =
        event => {

            const m =
                getSelectedMaterial();


            if(!m)
                return;


            m.color.set(
                event.target.value
            );


            document
                .getElementById(
                    "baseColorValue"
                )
                .textContent =
                event.target.value;

        };

}


bindMaterialControls();


/* =========================================================
   UV
========================================================= */

function applyUVToMaterial(
    material
){

    if(!material)
        return;


    const maps = [

        material.map,
        material.normalMap,
        material.roughnessMap,
        material.metalnessMap,
        material.aoMap

    ];


    const scale =
        Number(
            document
                .getElementById(
                    "scale"
                )
                .value
        );


    const rotation =
        Number(
            document
                .getElementById(
                    "rotation"
                )
                .value
        ) *
        Math.PI /
        180;


    const x =
        Number(
            document
                .getElementById(
                    "offsetX"
                )
                .value
        );


    const y =
        Number(
            document
                .getElementById(
                    "offsetY"
                )
                .value
        );


    maps.forEach(
        texture => {

            if(!texture)
                return;


            texture.wrapS =
                THREE.RepeatWrapping;


            texture.wrapT =
                THREE.RepeatWrapping;


            texture.repeat.set(
                scale,
                scale
            );


            texture.rotation =
                rotation;


            texture.offset.set(
                x,
                y
            );

        }
    );

}


function applyUV(){

    applyUVToMaterial(
        getSelectedMaterial()
    );

}


/* =========================================================
   LOCAL TEXTURE
========================================================= */

async function uploadTexture(
    event
){

    const file =
        event.target.files[0];


    event.target.value = "";


    if(!file)
        return;


    if(!selectedMesh){

        alert(
            "Hãy chọn mesh trước."
        );

        return;

    }


    try{

        const texture =
            await loadLocalTextureFast(
                file
            );


        saveHistory();


        const material =
            ensureEditableMaterial(
                selectedMesh
            );


        const oldTexture =
            material.map;


        material.map =
            texture;


        material.needsUpdate =
            true;


        applyUVToMaterial(
            material
        );


        if(oldTexture)
            releaseTextureIfUnused(
                oldTexture
            );


        updateSelectionUI();

    }catch(error){

        console.error(error);

        alert(
            "Không thể đọc texture."
        );

    }

}


function loadLocalTextureFast(
    file
){

    return new Promise(
        (resolve,reject) => {

            const objectURL =
                URL.createObjectURL(
                    file
                );


            const img =
                new Image();


            img.onload =
                () => {

                    try{

                        const scale =
                            Math.min(
                                1,
                                MAX_LOCAL_TEXTURE_SIZE /
                                Math.max(
                                    img.width,
                                    img.height
                                )
                            );


                        const width =
                            Math.max(
                                1,
                                Math.round(
                                    img.width *
                                    scale
                                )
                            );


                        const height =
                            Math.max(
                                1,
                                Math.round(
                                    img.height *
                                    scale
                                )
                            );


                        const canvas =
                            document.createElement(
                                "canvas"
                            );


                        canvas.width =
                            width;


                        canvas.height =
                            height;


                        const ctx =
                            canvas.getContext(
                                "2d",
                                {
                                    alpha:true
                                }
                            );


                        ctx.drawImage(
                            img,
                            0,
                            0,
                            width,
                            height
                        );


                        const texture =
                            new THREE.CanvasTexture(
                                canvas
                            );


                        prepareTexture(
                            texture,
                            THREE.SRGBColorSpace
                        );


                        URL.revokeObjectURL(
                            objectURL
                        );


                        resolve(
                            texture
                        );

                    }catch(error){

                        URL.revokeObjectURL(
                            objectURL
                        );

                        reject(error);

                    }

                };


            img.onerror =
                () => {

                    URL.revokeObjectURL(
                        objectURL
                    );


                    reject(
                        new Error(
                            "Image decode failed"
                        )
                    );

                };


            img.decoding =
                "async";


            img.src =
                objectURL;

        }
    );

}


/* =========================================================
   UV2
========================================================= */

function ensureUV2(
    mesh
){

    const uv =
        mesh
            ?.geometry
            ?.attributes
            ?.uv;


    if(
        uv &&
        !mesh
            .geometry
            .attributes
            .uv2
    ){

        mesh.geometry.setAttribute(
            "uv2",
            uv
        );

    }

}


/* =========================================================
   REMOVE TEXTURE
========================================================= */

function removeTexture(){

    const material =
        getSelectedMaterial();


    if(!material)
        return;


    saveHistory();


    ++textureApplyToken;


    const oldTextures = [

        material.map,
        material.normalMap,
        material.roughnessMap,
        material.metalnessMap,
        material.aoMap

    ].filter(Boolean);


    material.map =
        null;


    material.normalMap =
        null;


    material.roughnessMap =
        null;


    material.metalnessMap =
        null;


    material.aoMap =
        null;


    material.transparent =
        false;


    material.opacity =
        1;


    material.depthWrite =
        true;


    material.needsUpdate =
        true;


    oldTextures.forEach(
        releaseTextureIfUnused
    );


    updateSelectionUI();

}


/* =========================================================
   CLEANUP TEXTURE
========================================================= */

function releaseTextureIfUnused(
    texture
){

    if(!texture)
        return;


    let used = false;


    if(model){

        model.traverse(
            obj => {

                if(
                    used ||
                    !obj.isMesh
                )
                    return;


                const mats =
                    Array.isArray(
                        obj.material
                    )
                    ?
                    obj.material
                    :
                    [obj.material];


                mats.forEach(
                    mat => {

                        if(
                            !mat ||
                            used
                        )
                            return;


                        if(

                            mat.map ===
                            texture ||

                            mat.normalMap ===
                            texture ||

                            mat.roughnessMap ===
                            texture ||

                            mat.metalnessMap ===
                            texture ||

                            mat.aoMap ===
                            texture

                        ){

                            used = true;

                        }

                    }
                );

            }
        );

    }


    if(used)
        return;


    for(
        const [
            key,
            cached
        ]
        of textureCache.entries()
    ){

        if(
            cached === texture
        ){

            textureCache.delete(
                key
            );

        }

    }


    texture.dispose();

}


/* =========================================================
   RESET
========================================================= */

function resetMaterial(){

    if(!selectedMesh)
        return;


    saveHistory();


    ++textureApplyToken;


    const oldMaterials =
        Array.isArray(
            selectedMesh.material
        )
        ?
        selectedMesh.material
        :
        [selectedMesh.material];


    oldMaterials.forEach(
        material => {

            if(material)
                disposeMaterialTextures(
                    material
                );

        }
    );


    if(
        Array.isArray(
            selectedMesh.material
        )
    ){

        selectedMesh.material =
            selectedMesh.material.map(
                () =>
                new THREE.MeshStandardMaterial({

                    color:0xffffff,

                    roughness:.5,

                    metalness:0

                })
            );

    }else{

        selectedMesh.material =
            new THREE.MeshStandardMaterial({

                color:0xffffff,

                roughness:.5,

                metalness:0

            });

    }


    selectedMesh.userData
        .textureStudioCloned =
        true;


    updateSelectionUI();

}


/* =========================================================
   LAYERS
========================================================= */

function addLayer(){

    const layer =
        document.createElement(
            "div"
        );


    layer.className =
        "layer";


    layer.innerHTML =
        `
        <span>●</span>
        <span>New Layer</span>

        .querySelector(
            "button"
        )
        .onclick =

        layer.remove();


    document
        .getElementById(
            "layers"
        )
        .appendChild(
            layer
        );

}


/* =========================================================
   WIREFRAME
========================================================= */

function toggleWire(){

    if(!model)
        return;


    wireframe =
        !wireframe;


    model.traverse(
        obj => {

            if(!obj.isMesh)
                return;


            const mats =
                Array.isArray(
                    obj.material
                )
                ?
                obj.material
                :
                [obj.material];


            mats.forEach(
                mat => {

                    if(mat)
                        mat.wireframe =
                            wireframe;

                }
            );

        }
    );

}


/* =========================================================
   GRID
========================================================= */

function toggleGrid(){

    gridVisible =
        !gridVisible;

}


/* =========================================================
   FOCUS
========================================================= */

function focusModel(){

    if(model)
        centerModel();

}


/* =========================================================
   HISTORY
========================================================= */

function saveHistory(){

    const material =
        getSelectedMaterial();


    if(
        !selectedMesh ||
        !material
    )
        return;


    history =
        history.slice(
            0,
            historyIndex + 1
        );


    history.push({

        mesh:
            selectedMesh.uuid,

        material:
            material.clone(),

        materialIndex:
            selectedMaterialIndex

    });


    historyIndex =
        history.length - 1;


    if(
        history.length > 30
    ){

        history.shift();

        historyIndex--;

    }

}


function undo(){

    if(historyIndex < 0)
        return;


    restoreHistory(
        history[
            historyIndex
        ]
    );


    historyIndex--;

}


function redo(){

    if(
        historyIndex >=
        history.length - 1
    )
        return;


    historyIndex++;


    restoreHistory(
        history[
            historyIndex
        ]
    );

}


function restoreHistory(
    state
){

    if(!model)
        return;


    let mesh = null;


    model.traverse(
        obj => {

            if(
                obj.uuid ===
                state.mesh
            )
                mesh = obj;

        }
    );


    if(!mesh)
        return;


    selectedMaterialIndex =
        state.materialIndex ??
        0;


    if(
        Array.isArray(
            mesh.material
        )
    ){

        mesh.material[
            selectedMaterialIndex
        ] =
            state.material.clone();

    }else{

        mesh.material =
            state.material.clone();

    }


    selectedMesh =
        mesh;


    ++textureApplyToken;


    updateSelectionUI();

}


/* =========================================================
   SAVE
========================================================= */

function saveProject(){

    const project = {

        version:3,

        modelName:
            document
                .getElementById(
                    "modelName"
                )
                .textContent,

        selected:
            selectedMesh?.name ||
            null,

        materials:[]

    };


    if(model){

        model.traverse(
            obj => {

                if(!obj.isMesh)
                    return;


                const mats =
                    Array.isArray(
                        obj.material
                    )
                    ?
                    obj.material
                    :
                    [obj.material];


                mats.forEach(
                    (m,index) => {

                        project.materials.push({

                            name:
                                obj.name,

                            materialIndex:
                                index,

                            color:
                                m.color
                                ?
                                m.color.getHexString()
                                :
                                "ffffff",

                            roughness:
                                m.roughness ??
                                .5,

                            metallic:
                                m.metalness ??
                                0,

                            hasBaseTexture:
                                !!m.map,

                            hasNormal:
                                !!m.normalMap,

                            hasRoughness:
                                !!m.roughnessMap,

                            hasMetallic:
                                !!m.metalnessMap,

                            hasAO:
                                !!m.aoMap

                        });

                    }
                );

            }
        );

    }


    downloadBlob(

        new Blob(
            [
                JSON.stringify(
                    project,
                    null,
                    2
                )
            ],
            {
                type:
                    "application/json"
            }
        ),

        "texture-project.json"

    );

}


/* =========================================================
   EXPORT GLB
========================================================= */

function exportGLB(){

    if(!model){

        alert(
            "Chưa có model."
        );

        return;

    }


    new GLTFExporter()
        .parse(

            model,

            result => {

                downloadBlob(

                    new Blob(
                        [result],
                        {
                            type:
                                "model/gltf-binary"
                        }
                    ),

                    "textured-model.glb"

                );

            },

            error => {

                console.error(
                    error
                );


                alert(
                    "Export thất bại."
                );

            },

            {
                binary:true
            }

        );

}


/* =========================================================
   DOWNLOAD
========================================================= */

function downloadBlob(
    blob,
    filename
){

    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement(
            "a"
        );


    a.href =
        url;


    a.download =
        filename;


    document.body.appendChild(
        a
    );


    a.click();


    a.remove();


    setTimeout(
        () =>
        URL.revokeObjectURL(
            url
        ),
        1000
    );

}


/* =========================================================
   DEBOUNCE
========================================================= */

function debounce(
    fn,
    delay
){

    let timer = 0;


    return (...args) => {

        clearTimeout(
            timer
        );


        timer =
            setTimeout(
                () =>
                fn(...args),
                delay
            );

    };

}


/* =========================================================
   ANIMATE
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    controls.update();


    renderer.render(
        scene,
        camera
    );

}
