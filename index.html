<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rhythm Game</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#070b0d;color:#fff;font-family:Arial}
.wrap{width:min(1100px,95%);margin:auto;padding:20px}
h1{text-align:center;color:#1ed760}
.box{background:#101719;border:1px solid #303a3e;border-radius:14px;padding:16px;margin-bottom:15px}
input{width:100%;padding:12px;background:#080d0f;color:#fff;border:1px solid #444;border-radius:8px}
button{padding:10px 14px;border:0;border-radius:8px;cursor:pointer;font-weight:bold}
.green{background:#1ed760;color:#000}
.dark{background:#263034;color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{text-align:center;background:#080d0f;padding:10px;border-radius:8px}
.stat small{display:block;color:#777}
.stat b{font-size:23px;color:#1ed760}
#song{margin:12px 0;color:#aaa;text-align:center}
canvas{width:100%;background:#050708;border:2px solid #333;border-radius:10px}
.keys{display:flex;justify-content:center;gap:10px;margin-top:12px}
.key{width:65px;height:50px;background:#20292d;color:#fff;border:2px solid #555}
.key.on{border-color:#1ed760;background:#173c28}
#msg{text-align:center;height:30px;font-size:21px;font-weight:bold}
.perfect{color:#00ff88}.good{color:#00e5ff}.miss{color:#ff5252}
#list{margin-top:12px}
.item{display:flex;gap:8px;align-items:center;background:#171f22;padding:10px;margin-top:7px;border-radius:8px}
.item span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item button{padding:7px}
@media(max-width:600px){
 .stats{grid-template-columns:repeat(2,1fr)}
 .keys{gap:5px}
 .key{width:55px}
}
</style>
</head>

<body>
<div class="wrap">

<h1>🎵 RHYTHM GAME</h1>

<div class="box">
<h3>🎧 Nhạc của bạn</h3>

<input id="url"
placeholder="Dán URL FILE .mp3 / .ogg / .wav">

<br><br>

<button class="green" onclick="loadSong()">▶ Nạp nhạc</button>
<button class="dark" onclick="start()">🎮 Bắt đầu</button>
<button class="dark" onclick="pause()">⏸ Tạm dừng</button>

<div id="song">Chưa có bài hát</div>

<audio id="audio" controls style="width:100%"></audio>

<div id="list"></div>
</div>

<div class="box">

<div class="stats">
<div class="stat"><small>ĐIỂM</small><b id="score">0</b></div>
<div class="stat"><small>COMBO</small><b id="combo">0</b></div>
<div class="stat"><small>BEST</small><b id="best">0</b></div>
<div class="stat"><small>MISS</small><b id="miss">0</b></div>
</div>

<div id="msg"></div>

<canvas id="game" width="700" height="600"></canvas>

<div class="keys">
<button class="key" id="A">A</button>
<button class="key" id="S">S</button>
<button class="key" id="D">D</button>
<button class="key" id="F">F</button>
</div>

<p style="text-align:center;color:#777">
Bàn phím: A S D F
</p>

</div>
</div>

<script>
const audio=document.getElementById("audio");
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const keys=["A","S","D","F"];
const x=[87.5,262.5,437.5,612.5];
const colors=["#ff3366","#00e5ff","#ffeb3b","#e040fb"];

const targetY=510;
let notes=[];
let score=0;
let combo=0;
let best=0;
let miss=0;
let playing=false;
let paused=false;

let library=JSON.parse(
 localStorage.getItem("rhythmSongs")||"[]"
);

/* ---------- ÂM THANH ---------- */

let ac=null;
let master=null;

function initAudio(){
 if(!ac){
  ac=new(window.AudioContext||window.webkitAudioContext)();
  master=ac.createGain();
  master.gain.value=.15;
  master.connect(ac.destination);
 }
 if(ac.state==="suspended") ac.resume();
}

function beep(freq,duration=.1,type="sine"){
 initAudio();

 let o=ac.createOscillator();
 let g=ac.createGain();

 o.type=type;
 o.frequency.value=freq;

 g.gain.setValueAtTime(.001,ac.currentTime);
 g.gain.exponentialRampToValueAtTime(
  .25,ac.currentTime+.01
 );
 g.gain.exponentialRampToValueAtTime(
  .001,ac.currentTime+duration
 );

 o.connect(g);
 g.connect(master);

 o.start();
 o.stop(ac.currentTime+duration+.03);
}

function perfectSound(){
 beep(880,.1);
 setTimeout(()=>beep(1320,.15),60);
}

function goodSound(){
 beep(600,.12);
}

function missSound(){
 beep(150,.18,"sawtooth");
}

/* ---------- NHẠC ---------- */

function loadSong(){

 initAudio();

 let url=document.getElementById("url").value.trim();

 if(!url){
  alert("Hãy dán URL file âm thanh!");
  return;
 }

 try{
  new URL(url);
 }catch{
  alert("URL không hợp lệ!");
  return;
 }

 audio.src=url;
 audio.load();

 let name=url.split("/").pop().split("?")[0]||"Nhạc";

 document.getElementById("song").textContent=
  "🎵 "+name;

 if(!library.includes(url)){
  library.push(url);
  localStorage.setItem(
   "rhythmSongs",
   JSON.stringify(library)
  );
 }

 renderLibrary();

 audio.play().then(()=>{
  audio.pause();
 }).catch(()=>{});

}

function renderLibrary(){

 let list=document.getElementById("list");
 list.innerHTML="";

 library.forEach((url,i)=>{

  let div=document.createElement("div");
  div.className="item";

  let span=document.createElement("span");
  span.textContent=url;

  let play=document.createElement("button");
  play.className="green";
  play.textContent="▶";
  play.onclick=()=>{
   document.getElementById("url").value=url;
   audio.src=url;
   audio.play().catch(()=>{});
   document.getElementById("song").textContent=
    "🎵 "+url.split("/").pop();
  };

  let del=document.createElement("button");
  del.className="dark";
  del.textContent="🗑";
  del.onclick=()=>{
   library.splice(i,1);
   localStorage.setItem(
    "rhythmSongs",
    JSON.stringify(library)
   );
   renderLibrary();
  };

  div.append(span,play,del);
  list.appendChild(div);
 });
}

/* ---------- GAME ---------- */

function reset(){

 notes=[];
 score=0;
 combo=0;
 miss=0;

 updateStats();

}

function start(){

 initAudio();

 if(!audio.src){
  alert("Hãy nạp nhạc trước!");
  return;
 }

 reset();

 playing=true;
 paused=false;

 audio.currentTime=0;

 audio.play().catch(()=>{
  alert("Trình duyệt cần bạn bấm nút Bắt đầu để phát nhạc.");
 });

}

function pause(){

 if(!playing)return;

 paused=!paused;

 if(paused){
  audio.pause();
 }else{
  audio.play().catch(()=>{});
 }

}

audio.addEventListener("ended",()=>{
 playing=false;
 paused=false;
});

function updateStats(){

 document.getElementById("score").textContent=score;
 document.getElementById("combo").textContent=combo;
 document.getElementById("best").textContent=best;
 document.getElementById("miss").textContent=miss;

}

function message(text,cls){

 let m=document.getElementById("msg");

 m.textContent=text;
 m.className=cls;

 setTimeout(()=>{
  if(m.textContent===text)m.textContent="";
 },500);

}

/* ---------- TẠO NỐT ---------- */

setInterval(()=>{

 if(!playing||paused)return;

 let lane=Math.floor(Math.random()*4);

 notes.push({
  lane,
  y:-30,
  speed:5
 });

},550);

/* ---------- ĐÁNH ---------- */

function hit(letter){

 initAudio();

 let lane=keys.indexOf(letter);

 if(!playing||paused)return;

 let bestIndex=-1;
 let distance=9999;

 for(let i=0;i<notes.length;i++){

  if(notes[i].lane!==lane)continue;

  let d=Math.abs(notes[i].y-targetY);

  if(d<distance){
   distance=d;
   bestIndex=i;
  }
 }

 if(bestIndex===-1||distance>65){

  combo=0;
  miss++;

  missSound();

  message("MISS","miss");

  updateStats();

  return;
 }

 notes.splice(bestIndex,1);

 if(distance<=20){

  score+=100+combo*2;
  combo++;

  if(combo>best)best=combo;

  perfectSound();

  message("PERFECT ✨","perfect");

 }else{

  score+=50+combo;
  combo++;

  if(combo>best)best=combo;

  goodSound();

  message("GOOD 👍","good");

 }

 updateStats();

}

/* ---------- KEYBOARD ---------- */

window.addEventListener("keydown",e=>{

 let k=e.key.toUpperCase();

 if(!keys.includes(k))return;

 e.preventDefault();

 document.getElementById(k).classList.add("on");

 hit(k);

});

window.addEventListener("keyup",e=>{

 let k=e.key.toUpperCase();

 if(!keys.includes(k))return;

 document.getElementById(k).classList.remove("on");

});

/* ---------- MOBILE ---------- */

keys.forEach(k=>{

 let b=document.getElementById(k);

 b.addEventListener("pointerdown",e=>{
  e.preventDefault();
  b.classList.add("on");
  hit(k);
 });

 b.addEventListener("pointerup",()=>{
  b.classList.remove("on");
 });

 b.addEventListener("pointerleave",()=>{
  b.classList.remove("on");
 });

});

/* ---------- VẼ ---------- */

function draw(){

 ctx.clearRect(0,0,700,600);

 ctx.fillStyle="#050708";
 ctx.fillRect(0,0,700,600);

 /* lane */

 for(let i=0;i<4;i++){

  ctx.strokeStyle="#30383b";
  ctx.lineWidth=2;

  ctx.beginPath();
  ctx.moveTo(x[i],0);
  ctx.lineTo(x[i],600);
  ctx.stroke();

 }

 /* target */

 ctx.fillStyle="#1ed76014";
 ctx.fillRect(0,targetY-45,700,90);

 for(let i=0;i<4;i++){

  ctx.strokeStyle=
   document.getElementById(keys[i]).classList.contains("on")
   ? "#1ed760"
   : "#555";

  ctx.lineWidth=4;

  ctx.beginPath();
  ctx.arc(x[i],targetY,27,0,Math.PI*2);
  ctx.stroke();

  ctx.fillStyle="#aaa";
  ctx.font="bold 17px Arial";
  ctx.textAlign="center";
  ctx.fillText(keys[i],x[i],targetY+6);

 }

 /* notes */

 if(playing&&!paused){

  for(let i=notes.length-1;i>=0;i--){

   let n=notes[i];

   n.y+=n.speed;

   ctx.shadowColor=colors[n.lane];
   ctx.shadowBlur=20;

   ctx.fillStyle=colors[n.lane];

   ctx.beginPath();
   ctx.arc(
    x[n.lane],
    n.y,
    23,
    0,
    Math.PI*2
   );
   ctx.fill();

   ctx.shadowBlur=0;

   if(n.y>640){

    notes.splice(i,1);

    combo=0;
    miss++;

    missSound();

    message("MISS","miss");

    updateStats();

   }

  }

 }

 requestAnimationFrame(draw);

}

renderLibrary();
updateStats();
draw();
</script>

</body>
</html>
