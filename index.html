<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>editnew - Web Video Rigging App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app-container">

        <!-- 1. MÀN HÌNH PREVIEW CHÍNH -->
        <div id="preview-window">
            <canvas id="videoCanvas" width="800" height="450"></canvas>
        </div>

        <!-- 2. THANH CÔNG CỤ TOOLS CHUYÊN NGHIỆP -->
        <div id="toolbar">
            <!-- NHÓM UPLOAD -->
            <div class="upload-section">
                <input type="file" id="image-upload" accept="image/*" style="display: none;">
                <button id="btn-upload">📁 Tải ảnh lên</button>
            </div>
            
            <div class="divider"></div>

            <!-- NHÓM CHẾ ĐỘ CẤU HÌNH RIG (SETUP MODE) -->
            <div class="rig-setup-section">
                <button id="btn-mode-rig" class="active" style="background: #eab308; border-color: #ca8a04; color: black; font-weight: bold;">Bone Chế độ Gắn Rig</button>
                <button id="btn-create-mesh" style="background: #8b5cf6; border-color: #7c3aed;">Tạo lưới Đa lớp</button>
                <button id="btn-bind-rig" style="background: #06b6d4; border-color: #0891b2;">Kết hợp Rig (Bind)</button>
            </div>

            <div class="divider"></div>

            <!-- NHÓM BỘ CÔNG CỤ HOẠT HÌNH (ANIMATION TOOLS) -->
            <div class="tools-section">
                <button id="btn-translate">Di chuyển Ảnh/Lưới</button>
                <button id="btn-rotate">Xoay Ảnh/Lưới</button>
                <button id="btn-scale">Phóng to Ảnh/Lưới</button>
            </div>

            <div class="divider"></div>

            <!-- NHÓM KEYFRAME -->
            <div class="keyframe-section">
                <button id="btn-keyframe">Thêm Keyframe</button>
            </div>
        </div>

        <!-- 3. HỆ THỐNG TIMELINE DÒNG THỜI GIAN -->
        <div id="timeline-container">
            <div id="timeline-header">
                <button id="btn-play">Play</button>
                <span id="time-display">0.00s / 10.00s</span>
            </div>
            <div id="timeline-track">
                <div id="playhead"></div> 
            </div>
        </div>

    </div>

    <script>
        // =========================================================================
        // LOGIC 1: BỘ CÔNG CỤ TƯƠNG TÁC (GIZMO & MODES)
        // =========================================================================
        class TransformGizmo {
            constructor(core) {
                this.core = core;
                this.currentMode = 'none';
                this.selectedBone = null;
                this.isDragging = false;
                this.startMousePos = { x: 0, y: 0 };
                this.isRigMode = true;
                
                this.initButtonEvents();
            }

            initButtonEvents() {
                const btnRigMode = document.getElementById('btn-mode-rig');
                const animModes = ['translate', 'rotate', 'scale'];

                btnRigMode?.addEventListener('click', () => {
                    this.isRigMode = !this.isRigMode;
                    if (this.isRigMode) {
                        btnRigMode.classList.add('active');
                        btnRigMode.style.background = '#eab308';
                        this.currentMode = 'none';
                        animModes.forEach(m => document.getElementById(`btn-${m}`)?.classList.remove('active'));
                    } else {
                        btnRigMode.classList.remove('active');
                        btnRigMode.style.background = '#2d2d3d';
                    }
                });

                animModes.forEach(mode => {
                    const btn = document.getElementById(`btn-${mode}`);
                    if (btn) {
                        btn.addEventListener('click', () => {
                            this.isRigMode = false;
                            btnRigMode.classList.remove('active');
                            btnRigMode.style.background = '#2d2d3d';

                            animModes.forEach(m => document.getElementById(`btn-${m}`)?.classList.remove('active'));
                            btn.classList.add('active');
                            this.currentMode = mode;
                        });
                    }
                });
            }

            handleMouseDown(mousePos, bone) {
                if (!bone) return;
                this.selectedBone = bone;
                this.isDragging = true;
                this.startMousePos = { ...mousePos };
            }

            handleMouseMove(currentMousePos) {
                if (!this.isDragging || !this.selectedBone) return;

                const deltaX = currentMousePos.x - this.startMousePos.x;
                const deltaY = currentMousePos.y - this.startMousePos.y;

                if (this.isRigMode) {
                    this.selectedBone.position.x += deltaX;
                    this.selectedBone.position.y += deltaY;
                } else {
                    if (this.currentMode === 'translate') {
                        this.selectedBone.position.x += deltaX;
                        this.selectedBone.position.y += deltaY;
                    } 
                    else if (this.currentMode === 'rotate') {
                        const angle = Math.atan2(
                            currentMousePos.y - this.selectedBone.position.y, 
                            currentMousePos.x - this.startMousePos.x
                        );
                        this.selectedBone.rotation = angle;
                    } 
                    else if (this.currentMode === 'scale') {
                        const scaleFactor = 1 + (deltaX * 0.005);
                        this.selectedBone.scale.x = Math.max(0.1, this.selectedBone.scale.x * scaleFactor);
                        this.selectedBone.scale.y = Math.max(0.1, this.selectedBone.scale.y * scaleFactor);
                    }
                }

                this.startMousePos = { ...currentMousePos };
            }

            handleMouseUp() {
                this.isDragging = false;
            }
        }

        // =========================================================================
        // LOGIC 2: ĐỒNG HỒ ĐẾM GIỜ VÀ LƯU KEYFRAME TIMELINE
        // =========================================================================
        class TimelineManager {
            constructor(core) {
                this.core = core;
                this.currentTime = 0;
                this.maxTime = 10;
                this.isPlaying = false;
                this.keyframes = [];
                this.animationFrameId = null;
                this.initTimelineEvents();
            }

            initTimelineEvents() {
                const btnPlay = document.getElementById('btn-play');
                const btnKeyframe = document.getElementById('btn-keyframe');
                const track = document.getElementById('timeline-track');

                btnPlay?.addEventListener('click', () => this.togglePlay());

                btnKeyframe?.addEventListener('click', () => {
                    if (this.core.gizmo.selectedBone) {
                        this.addKeyframe(this.core.gizmo.selectedBone);
                    } else {
                        alert("Vui lòng click chọn 1 cục xương trên màn hình trước khi tạo Keyframe!");
                    }
                });

                track?.addEventListener('click', (e) => {
                    const rect = track.getBoundingClientRect();
                    const clickX = e.clientX - rect.left;
                    this.seek((clickX / rect.width) * this.maxTime);
                });
            }

            togglePlay() {
                this.isPlaying = !this.isPlaying;
                const btnPlay = document.getElementById('btn-play');
                if (btnPlay) btnPlay.innerText = this.isPlaying ? 'Pause' : 'Play';

                if (this.isPlaying) {
                    this.lastTime = performance.now();
                    this.runClock();
                } else {
                    cancelAnimationFrame(this.animationFrameId);
                }
            }

            runClock() {
                if (!this.isPlaying) return;
                const now = performance.now();
                const deltaTime = (now - this.lastTime) / 1000;
                this.lastTime = now;

                this.seek(this.currentTime + deltaTime);

                if (this.currentTime >= this.maxTime) {
                    this.seek(0);
                }
                this.animationFrameId = requestAnimationFrame(() => this.runClock());
            }

            seek(time) {
                this.currentTime = Math.max(0, Math.min(this.maxTime, time));
                const playhead = document.getElementById('playhead');
                const timeDisplay = document.getElementById('time-display');
                
                if (playhead) playhead.style.left = `${(this.currentTime / this.maxTime) * 100}%`;
                if (timeDisplay) timeDisplay.innerText = `${this.currentTime.toFixed(2)}s / ${this.maxTime.toFixed(2)}s`;

                this.core.applyKeyframesAtTime(this.currentTime);
            }

            addKeyframe(bone) {
                const roundedTime = parseFloat(this.currentTime.toFixed(2));
                this.keyframes = this.keyframes.filter(k => !(k.time === roundedTime && k.boneId === bone.id));

                const newKf = {
                    time: roundedTime,
                    boneId: bone.id,
                    position: { ...bone.position },
                    rotation: bone.rotation,
                    scale: { ...bone.scale }
                };
                this.keyframes.push(newKf);
                this.keyframes.sort((a, b) => a.time - b.time);
                console.log("Đã ghi nhớ Keyframe chuyển động!", newKf);
            }
        }

        // =========================================================================
          // =========================================================================
        // LOGIC 3: TẠO LƯỚI ĐA LỚP, XỬ LÝ LÁT CẮT SLICE VÀ VẼ CANVAS
        // =========================================================================
        class RiggingEngine {
            constructor(core) {
                this.core = core;
                this.canvas = document.getElementById('videoCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.bones = [];
                this.bgImage = null;
                
                this.isMeshCreated = false; 
                this.isRigBound = false;    
                this.slices = []; // Mảng lưu trữ các đường cắt Slice của người dùng
                this.sliceEndPos = null;

                this.initUploadEvent();
                this.initCanvasEvents();
                this.initAdvancedButtons();
                this.drawAll();
            }

            initAdvancedButtons() {
                const btnMesh = document.getElementById('btn-create-mesh');
                const btnBind = document.getElementById('btn-bind-rig');

                btnMesh?.addEventListener('click', () => {
                    if (!this.bgImage) {
                        alert("Vui lòng tải ảnh lên trước!");
                        return;
                    }
                    this.isMeshCreated = !this.isMeshCreated;
                    btnMesh.style.background = this.isMeshCreated ? '#6d28d9' : '#8b5cf6';
                    btnMesh.innerText = this.isMeshCreated ? '✅ Đã tạo lưới Đa lớp' : '🕸️ Tạo lưới Đa lớp';
                    this.drawAll();
                });

                btnBind?.addEventListener('click', () => {
                    if (this.bones.length === 0) {
                        alert("Vui lòng tạo xương để kết hợp!");
                        return;
                    }
                    this.isRigBound = !this.isRigBound;
                    btnBind.style.background = this.isRigBound ? '#0e7490' : '#06b6d4';
                    btnBind.innerText = this.isRigBound ? '🔒 Đã kết hợp Rig' : '🔗 Kết hợp Rig';
                    alert(this.isRigBound ? "Đã khóa liên kết xương vào các mảnh lưới đã Slice thành công!" : "Hủy liên kết.");
                });
            }

            initUploadEvent() {
                const btnUpload = document.getElementById('btn-upload');
                const fileInput = document.getElementById('image-upload');
                btnUpload?.addEventListener('click', () => fileInput.click());
                fileInput?.addEventListener('change', (e) => {
                    // SỬA LỖI ĐỂ NHẬN DIỆN ĐÚNG 1 FILE ẢNH ĐẦU TIÊN
                    const file = e.target.files[0];
                    if (!file) return;
                    
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const img = new Image();
                        img.onload = () => { 
                            this.bgImage = img; 
                            this.drawAll(); 
                        };
                        img.src = event.target.result;
                    };
                    reader.readAsDataURL(file);
                });
            }

            initCanvasEvents() {
                this.canvas.addEventListener('mousedown', (e) => {
                    const rect = this.canvas.getBoundingClientRect();
                    const mousePos = { x: e.clientX - rect.left, y: e.clientY - rect.top };

                    if (this.core.gizmo.isSliceMode) {
                        this.core.gizmo.handleMouseDown(mousePos, null);
                        return;
                    }

                    let clickedBone = this.checkClickBone(mousePos);
                    if (clickedBone) {
                        this.core.gizmo.handleMouseDown(mousePos, clickedBone);
                    } else if (this.core.gizmo.isRigMode) {
                        const newBone = {
                            id: Date.now(),
                            name: `Khớp_${this.bones.length + 1}`,
                            position: { x: mousePos.x, y: mousePos.y },
                            rotation: 0,
                            scale: { x: 1, y: 1 }
                        };
                        this.bones.push(newBone);
                        this.core.gizmo.selectedBone = newBone;
                    }
                    this.drawAll();
                });

                this.canvas.addEventListener('mousemove', (e) => {
                    const rect = this.canvas.getBoundingClientRect();
                    const mousePos = { x: e.clientX - rect.left, y: e.clientY - rect.top };

                    if (this.core.gizmo.isDragging) {
                        this.core.gizmo.handleMouseMove(mousePos);
                        this.drawAll();
                    }
                });

                window.addEventListener('mouseup', () => {
                    if (this.core.gizmo.isSliceMode && this.core.gizmo.isDragging && this.sliceEndPos) {
                        this.slices.push({
                            start: { ...this.core.gizmo.startMousePos },
                            end: { ...this.sliceEndPos }
                        });
                        console.log("[Slice] Đã tạo đường phân cắt mảnh ảnh mới!");
                        this.sliceEndPos = null;
                    }
                    this.core.gizmo.handleMouseUp();
                    this.drawAll();
                });
            }

            checkClickBone(mousePos) {
                for (let bone of this.bones) {
                    const distance = Math.hypot(mousePos.x - bone.position.x, mousePos.y - bone.position.y);
                    if (distance < 15) return bone;
                }
                return null;
            }

            drawAll() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                if (this.bgImage) {
                    this.ctx.drawImage(this.bgImage, 0, 0, this.canvas.width, this.canvas.height);
                } else {
                    this.ctx.fillStyle = '#18181b';
                    this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                }

                if (this.isMeshCreated) {
                    this.ctx.strokeStyle = 'rgba(139, 92, 246, 0.4)';
                    this.ctx.lineWidth = 1;
                    const size = 40;
                    for (let x = 0; x < this.canvas.width; x += size) {
                        for (let y = 0; y < this.canvas.height; y += size) {
                            this.ctx.beginPath(); this.ctx.moveTo(x, y); this.ctx.lineTo(x + size, y); this.ctx.lineTo(x, y + size); this.ctx.closePath(); this.ctx.stroke();
                            this.ctx.beginPath(); this.ctx.moveTo(x + size, y); this.ctx.lineTo(x + size, y + size); this.ctx.lineTo(x, y + size); this.ctx.closePath(); this.ctx.stroke();
                        }
                    }
                }

                this.slices.forEach(slice => {
                    this.ctx.beginPath();
                    this.ctx.moveTo(slice.start.x, slice.start.y);
                    this.ctx.lineTo(slice.end.x, slice.end.y);
                    this.ctx.strokeStyle = '#f97316';
                    this.ctx.lineWidth = 3;
                    this.ctx.stroke();
                });

                if (this.core.gizmo.isSliceMode && this.core.gizmo.isDragging && this.sliceEndPos) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(this.core.gizmo.startMousePos.x, this.core.gizmo.startMousePos.y);
                    this.ctx.lineTo(this.sliceEndPos.x, this.sliceEndPos.y);
                    this.ctx.strokeStyle = '#ffffff';
                    this.ctx.lineWidth = 2;
                    this.ctx.stroke();
                }

                this.bones.forEach(bone => {
                    this.ctx.save();
                    this.ctx.translate(bone.position.x, bone.position.y);
                    this.ctx.rotate(bone.rotation);
                    this.ctx.scale(bone.scale.x, bone.scale.y);

                    const isSelected = (this.core.gizmo.selectedBone?.id === bone.id);

                    this.ctx.beginPath();
                    this.ctx.moveTo(0, 0);
                    this.ctx.lineTo(12, -5);
                    this.ctx.lineTo(45, 0);
                    this.ctx.lineTo(12, 5);
                    this.ctx.closePath();
                    this.ctx.fillStyle = isSelected ? 'rgba(0, 122, 204, 0.4)' : 'rgba(239, 68, 68, 0.3)';
                    this.ctx.fill();
                    this.ctx.strokeStyle = isSelected ? '#007acc' : '#ef4444';
                    this.ctx.lineWidth = 2;
                    this.ctx.stroke();

                    this.ctx.beginPath();
                    this.ctx.arc(0, 0, 7, 0, Math.PI * 2);
                    this.ctx.fillStyle = isSelected ? '#00ebff' : '#fbbf24';
                    this.ctx.fill();
                    this.ctx.strokeStyle = '#ffffff';
                    this.ctx.lineWidth = 1.5;
                    this.ctx.stroke();

                    this.ctx.restore();
                });
            }
        }

        // =========================================================================
        // BỘ NÃO TỔNG ĐIỀU PHỐI ĐỒNG BỘ ỨNG DỤNG
        // =========================================================================
        class AppCore {
            constructor() {
                this.gizmo = new TransformGizmo(this);
                this.timeline = new TimelineManager(this);
                this.rigEngine = new RiggingEngine(this);
            }

            applyKeyframesAtTime(time) {
                const roundedTime = parseFloat(time.toFixed(2));
this.rigEngine.bones.forEach(bone => {const boneKfs = this.timeline.keyframes.filter(k => k.boneId === bone.id);if (boneKfs.length === 0) return;let matchedKf = boneKfs.find(k => Math.abs(k.time - roundedTime) <= 0.05);if (matchedKf) {bone.position = { ...matchedKf.position };bone.rotation = matchedKf.rotation;bone.scale = { ...matchedKf.scale };}});this.rigEngine.drawAll();}}window.onload = () => {window.appEngine = new AppCore();};
