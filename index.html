<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>editnew - Advanced Glitch & Motion FX Pro</title>
    <link real="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gifshot/0.4.5/gifshot.min.js"></script>
    <style>
        body { 
            background: #111; 
            color: #fff; 
            font-family: sans-serif; 
            padding: 20px; 
            margin: 0;
        }
        #app-container { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 15px; 
        }
        #preview-window { 
            background: #000; 
            border: 2px solid #333; 
            border-radius: 8px; 
            overflow: hidden; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        /* MÀN HÌNH TO HƠN: Cấu hình hiển thị Canvas lớn và rõ nét */
        #videoCanvas {
            display: block;
            max-width: 100%;
            height: auto;
            background: #1a1a1a;
        }
        #fx-controls-panel { 
            display: flex; 
            gap: 20px; 
            background: #222; 
            padding: 15px; 
            border-radius: 8px; 
            width: 100%; 
            max-width: 960px; 
            justify-content: space-around; 
            align-items: center; 
            box-sizing: border-box;
        }
        .slider-group { 
            display: flex; 
            flex-direction: column; 
            gap: 5px; 
        }
        #toolbar { 
            background: #222; 
            padding: 15px; 
            border-radius: 8px; 
            width: 100%; 
            max-width: 960px; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            box-sizing: border-box;
        }
        .fx-section { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 8px; 
        }
        button { 
            background: #333; 
            color: white; 
            border: 1px solid #555; 
            padding: 8px 12px; 
            border-radius: 4px; 
            cursor: pointer; 
            transition: 0.2s; 
        }
        button:hover { 
            background: #444; 
        }
        button.active { 
            background: #2563eb !important; 
            border-color: #3b82f6 !important; 
        }
        .divider { 
            height: 1px; 
            background: #444; 
            margin: 5px 0; 
        }
        .upload-section, .export-section { 
            display: flex; 
            gap: 10px; 
        }
    </style>
</head>
<body>
    <div id="app-container">
        <!-- ĐÃ ĐƯỢC TĂNG KÍCH THƯỚC LÊN 960x540 -->
        <div id="preview-window">
            <canvas id="videoCanvas" width="960" height="540"></canvas>
        </div>

        <div id="fx-controls-panel">
            <div class="slider-group">
                <label>⚡ Tốc độ (Speed):</label>
                <input type="range" id="slider-speed" min="0.1" max="5" step="0.1" value="1">
            </div>
            <div class="slider-group">
                <label>💥 Cường độ (Amount):</label>
                <input type="range" id="slider-amount" min="1" max="100" step="1" value="30">
            </div>
            <div class="slider-group" style="margin-left: 15px;">
                <label style="min-width: auto; cursor: pointer; display: flex; align-items: center; gap: 5px;">
                    <input type="checkbox" id="toggle-greenscreen"> 🟢 Phông xanh dưới hình ảnh
                </label>
            </div>
        </div>

        <div id="toolbar">
            <div class="upload-section">
                <input type="file" id="image-upload" accept="image/*" style="display: none;">
                <button id="btn-upload">📁 Tải ảnh lên</button>
            </div>
            <div class="divider"></div>
            <div class="fx-section">
                <button id="btn-pin-mode" style="background: #ca8a04; color: white; border-color: #a16207;">📍 Ghim điểm neo</button>
                <button id="btn-mask-mode" style="background: #9333ea; color: white; border-color: #7e22ce;">🎯 Khoanh vùng xử lý</button>
                <button id="btn-clear-all" style="background: #dc2626; border-color: #b91c1c;">❌ Xóa điểm ghim / vùng</button>
                
                <div class="divider" style="width: 100%;"></div>
                
                <button id="btn-fx-none" class="active">⏹ Giữ ảnh gốc</button>
                <button id="btn-fx-stretch">💇 Co giãn sợi tóc</button>
                <button id="btn-fx-wave">🌊 Uốn gợn sóng</button>
                <button id="btn-fx-wavewarp">🌀 Wave Warp (Alight)</button>
                <button id="btn-fx-bend">🥑 Uốn mềm mại</button>
                <button id="btn-fx-glitch" style="border-color: #06b6d4;">📺 Glitch RGB Split</button>
                <button id="btn-fx-zoom" style="border-color: #ec4899;">🔍 Co giãn Zoom</button>
                <button id="btn-fx-mirror" style="border-color: #f59e0b;">🪞 Gương (Mirror)</button>
                <button id="btn-fx-fanwarp" style="border-color: #f59e0b;">🌟 Biến dạng quạt</button>
                <button id="btn-fx-swirl" style="border-color: #f59e0b;">🌪️ Xoáy nước (Swirl)</button>
                <button id="btn-fx-pinch" style="border-color: #f59e0b;">🕳️ Hút/Đẩy tâm</button>
                <button id="btn-fx-tile" style="border-color: #f59e0b;">🔲 Gạch gương (Tile)</button>
            </div>
            <div class="divider"></div>
            <div class="export-section">
                <button id="btn-export-gif" style="background: #10b981; border-color: #059669; font-weight: bold;">💾 Xuất file GIF</button>
            </div>
        </div>
    </div>

    <script>
        class MotionFXEngine {
            constructor() {
                this.canvas = document.getElementById('videoCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.bgImage = null;
                this.currentFX = 'none';
                this.interactionMode = 'none';
                this.pins = [];              
                this.maskZone = null;
                this.time = 0;
                this.speed = 1;
                this.amount = 30;
                this.useGreenScreen = false;
                
                this.fxModes = ['none', 'stretch', 'wave', 'wavewarp', 'bend', 'glitch', 'zoom', 'mirror', 'fanwarp', 'swirl', 'pinch', 'tile'];
                
                this.initEvents();
                this.animate();
            }

            initEvents() {
                document.getElementById('slider-speed').addEventListener('input', (e) => this.speed = parseFloat(e.target.value));
                document.getElementById('slider-amount').addEventListener('input', (e) => this.amount = parseInt(e.target.value));
                document.getElementById('toggle-greenscreen').addEventListener('change', (e) => this.useGreenScreen = e.target.checked);

                const btnPin = document.getElementById('btn-pin-mode');
                const btnMask = document.getElementById('btn-mask-mode');
                const btnClearAll = document.getElementById('btn-clear-all');

                btnPin?.addEventListener('click', () => {
                    this.interactionMode = this.interactionMode === 'pin' ? 'none' : 'pin';
                    this.updateInteractionButtons();
                });
                btnMask?.addEventListener('click', () => {
                    this.interactionMode = this.interactionMode === 'mask' ? 'none' : 'mask';
                    this.updateInteractionButtons();
                });
                btnClearAll?.addEventListener('click', () => {
                    this.pins = [];
                    this.maskZone = null;
                });

                this.fxModes.forEach(mode => {
                    document.getElementById(`btn-fx-${mode}`)?.addEventListener('click', (e) => {
                        this.fxModes.forEach(m => document.getElementById(`btn-fx-${m}`)?.classList.remove('active'));
                        e.target.classList.add('active');
                        this.currentFX = mode;
                    });
                });

                const btnUpload = document.getElementById('btn-upload');
                const fileInput = document.getElementById('image-upload');
                btnUpload?.addEventListener('click', () => fileInput.click());
                
                fileInput?.addEventListener('change', (e) => {
                    const files = e.target.files;
                    if (!files || files.length === 0) return;
                    const file = files[0];
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        const img = new Image();
                        img.onload = () => { 
                            this.bgImage = img; 
                            this.pins = []; 
                            this.maskZone = null;
                            const maxBoundingWidth = 960;
                            const maxBoundingHeight = 540;
                            let newWidth = img.width;
                            let newHeight = img.height;
                            if (img.width > maxBoundingWidth || img.height > maxBoundingHeight) {
                                const ratioX = maxBoundingWidth / img.width;
                                const ratioY = maxBoundingHeight / img.height;
                                const scale = Math.min(ratioX, ratioY);
                                newWidth = img.width * scale;
                                newHeight = img.height * scale;
                            }
                            this.canvas.width = newWidth;
                            this.canvas.height = newHeight;
                            this.currentFX = 'none';
                            this.fxModes.forEach(m => document.getElementById(`btn-fx-${m}`)?.classList.remove('active'));
                            document.getElementById('btn-fx-none')?.classList.add('active');
                        };
                        img.src = ev.target.result;
                    };
                    reader.readAsDataURL(file);
                });

                this.canvas.addEventListener('mousedown', (e) => {
                    const rect = this.canvas.getBoundingClientRect();
                    const mouseX = (e.clientX - rect.left) * (this.canvas.width / rect.width);
                    const mouseY = (e.clientY - rect.top) * (this.canvas.height / rect.height);
                    const mousePos = { x: mouseX, y: mouseY };
                    
                    if (this.interactionMode === 'pin') {
                        this.pins.push(mousePos); 
                    } else if (this.interactionMode === 'mask') {
                        this.maskZone = { x: mousePos.x, y: mousePos.y, r: 130 };
                    }
                });

                document.getElementById('btn-export-gif')?.addEventListener('click', () => this.exportToGIF());
            }

            updateInteractionButtons() {
                const btnPin = document.getElementById('btn-pin-mode');
                const btnMask = document.getElementById('btn-mask-mode');
                
                if (this.interactionMode === 'pin') {
                    btnPin.style.boxShadow = "0 0 10px #f59e0b";
                    btnMask.style.boxShadow = "none";
                } else if (this.interactionMode === 'mask') {
                    btnMask.style.boxShadow = "0 0 10px #a855f7";
                    btnPin.style.boxShadow = "none";
                } else {
                    btnPin.style.boxShadow = "none";
                    btnMask.style.boxShadow = "none";
                }
            }

            applyDistortion(srcData, dstData, width, height) {
                const src = srcData.data;
                const dst = dstData.data;
                const amt = this.amount;
                const t = this.time;

                if (this.currentFX === 'none') {
                    for (let i = 0; i < src.length; i++) {
                        dst[i] = src[i];
                    }
                    return;
                }

                for (let y = 0; y < height; y++) {
                    for (let x = 0; x < width; x++) {
                        let srcX = x;
                        let srcY = y;

                        let inMask = true;
                        if (this.maskZone) {
                            const dx = x - this.maskZone.x;
                            const dy = y - this.maskZone.y;
                            if (dx * dx + dy * dy > this.maskZone.r * this.maskZone.r) {
                                inMask = false;
                            }
                        }

                        let pinFactor = 1;
                        if (this.pins.length > 0) {
                            let minDist = Infinity;
                            this.pins.forEach(pin => {
                                const dx = x - pin.x;
                                const dy = y - pin.y;
                                const d = Math.sqrt(dx * dx + dy * dy);
                                if (d < minDist) minDist = d;
                            });
                            pinFactor = Math.min(1, minDist / 100);
                        }

                        if (inMask) {
                            switch(this.currentFX) {
                                case 'stretch':
                                    srcY += Math.sin(x * 0.05 + t) * (amt * 0.3) * pinFactor;
                                    break;
                                case 'wave':
                                    srcX += Math.sin(y * 0.05 + t) * (amt * 0.4) * pinFactor;
                                    break;
                                case 'wavewarp':
                                    srcX += Math.sin(y * 0.08 + t * 1.5) * (amt * 0.3) * pinFactor;
                                    srcY += Math.cos(x * 0.08 + t * 1.5) * (amt * 0.2) * pinFactor;
                                    break;
                                case 'bend':
                                    srcX += ((y / height) * Math.sin(t)) * (amt * 0.5) * pinFactor;
                                    break;
                                case 'zoom':
                                    const zx = x - width / 2;
                                    const zy = y - height / 2;
                                    const zFactor = 1 + (Math.sin(t) * (amt / 200)) * pinFactor;
                                    srcX = width / 2 + zx * zFactor;
                                    srcY = height / 2 + zy * zFactor;
                                    break;
                                case 'mirror':
                                    if (x > width / 2) {
                                        srcX = width - x;
                                    }
                                    break;
                                case 'fanwarp':
                                    const fx = x - width / 2;
                                    const fy = y - height / 2;
                                    const angleFan = Math.atan2(fy, fx) + Math.sin(t) * (amt / 50) * pinFactor;
                                    const distFan = Math.sqrt(fx * fx + fy * fy);
                                    srcX = width / 2 + Math.cos(angleFan) * distFan;
                                    srcY = height / 2 + Math.sin(angleFan) * distFan;
                                    break;
                                case 'swirl':
                                    const sx = x - (this.maskZone ? this.maskZone.x : width / 2);
                                    const sy = y - (this.maskZone ? this.maskZone.y : height / 2);
                                    const sDist = Math.sqrt(sx * sx + sy * sy);
                                    if (sDist < 250) {
                                        const swirlAmount = ((250 - sDist) / 250) * (amt / 10) * Math.sin(t) * pinFactor;
                                        const sAngle = Math.atan2(sy, sx) + swirlAmount;
                                        srcX = (this.maskZone ? this.maskZone.x : width / 2) + Math.cos(sAngle) * sDist;
                                        srcY = (this.maskZone ? this.maskZone.y : height / 2) + Math.sin(sAngle) * sDist;
                                    }
                                    break;
                                case 'pinch':
                                    const px = x - (this.maskZone ? this.maskZone.x : width / 2);
                                    const py = y - (this.maskZone ? this.maskZone.y : height / 2);
                                    const pDist = Math.sqrt(px * px + py * py);
                                    if (pDist < 300) {
                                        const bindFactor = Math.sin(t) * (amt / 100); 
                                        const pScale = Math.pow(pDist / 300, bindFactor * pinFactor);
                                        srcX = (this.maskZone ? this.maskZone.x : width / 2) + px * pScale;
                                        srcY = (this.maskZone ? this.maskZone.y : height / 2) + py * pScale;
                                    }
                                    break;
                                case 'tile':
                                    const tileScale = 1 + (amt / 50);
                                    srcX = (x * tileScale + t * 20) % width;
                                    srcY = (y * tileScale) % height;
                                    if (srcX < 0) srcX += width;
                                    if (srcY < 0) srcY += height;
                                    break;
                            }
                        }

                        srcX = Math.max(0, Math.min(width - 1, Math.floor(srcX)));
                        srcY = Math.max(0, Math.min(height - 1, Math.floor(srcY)));

                        const dstIdx = (y * width + x) * 4;
                        const srcIdx = (srcY * width + srcX) * 4;

                        if (this.currentFX === 'glitch' && inMask) {
                            const offset = Math.floor(Math.sin(y * 0.1 + t * 5) * (amt * 0.3) * pinFactor);
                            let rX = Math.max(0, Math.min(width - 1, srcX + offset));
                            let bX = Math.max(0, Math.min(width - 1, srcX - offset));
                            
                            dst[dstIdx]     = src[(srcY * width + rX) * 4];     
                            dst[dstIdx + 1] = src[srcIdx + 1];                  
                            dst[dstIdx + 2] = src[(srcY * width + bX) * 4 + 2]; 
                            dst[dstIdx + 3] = src[srcIdx + 3];
                        } else {
                            dst[dstIdx]     = src[srcIdx];
                            dst[dstIdx + 1] = src[srcIdx + 1];
                            dst[dstIdx + 2] = src[srcIdx + 2];
                            dst[dstIdx + 3] = src[srcIdx + 3];
                        }
                    }
                }
            }

            animate() {
                this.time += 0.05 * this.speed;
                const w = this.canvas.width;
                const h = this.canvas.height;

                this.ctx.clearRect(0, 0, w, h);
                if (this.useGreenScreen) {
                    this.ctx.fillStyle = '#00ff00';
                    this.ctx.fillRect(0, 0, w, h);
                } else {
                    this.ctx.fillStyle = '#1e1e24';
                    this.ctx.fillRect(0, 0, w, h);
                }

                if (this.bgImage) {
                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = w;
                    tempCanvas.height = h;
                    const tempCtx = tempCanvas.getContext('2d');
                    tempCtx.drawImage(this.bgImage, 0, 0, w, h);

                    if (this.currentFX !== 'none') {
                        const srcData = tempCtx.getImageData(0, 0, w, h);
                        const dstData = tempCtx.createImageData(w, h);
                        this.applyDistortion(srcData, dstData, w, h);
                        tempCtx.putImageData(dstData, 0, 0);
                    }
                    
                    this.ctx.drawImage(tempCanvas, 0, 0);
                } else {
                    this.ctx.fillStyle = '#666';
                    this.ctx.font = '18px Arial';
                    this.ctx.fillText('Vui lòng tải ảnh lên để bắt đầu biên tập...', w/2 - 160, h/2);
                }

                this.pins.forEach(pin => {
                    this.ctx.beginPath();
                    this.ctx.arc(pin.x, pin.y, 6, 0, 2 * Math.PI);
                    this.ctx.fillStyle = '#f59e0b';
                    this.ctx.fill();
                    this.ctx.strokeStyle = '#fff';
                    this.ctx.stroke();
                });

                if (this.maskZone) {
                    this.ctx.beginPath();
                    this.ctx.arc(this.maskZone.x, this.maskZone.y, this.maskZone.r, 0, 2 * Math.PI);
                    this.ctx.strokeStyle = 'rgba(147, 51, 234, 0.7)';
                    this.ctx.lineWidth = 3;
                    this.ctx.stroke();
                }

                requestAnimationFrame(() => this.animate());
            }

            exportToGIF() {
                if (!this.bgImage) {
                    alert("Hãy tải ảnh lên trước khi xuất thành file GIF nhé!");
                    return;
                }
                alert("Hệ thống đang render chuỗi hiệu ứng biến dạng. Vui lòng đợi trong giây lát...");
                
                const frames = [];
                const w = this.canvas.width;
                const h = this.canvas.height;
                const duration = 20; 
                let backupTime = this.time;

                for (let i = 0; i < duration; i++) {
                    this.time = i * 0.15 * this.speed;
                    
                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = w;
                    tempCanvas.height = h;
                    const tempCtx = tempCanvas.getContext('2d');
                    
                    if (this.useGreenScreen) {
                        tempCtx.fillStyle = '#00ff00';
                        tempCtx.fillRect(0, 0, w, h);
                    } else {
                        tempCtx.fillStyle = '#1e1e24';
                        tempCtx.fillRect(0, 0, w, h);
                    }
                    
                    const imgCanvas = document.createElement('canvas');
                    imgCanvas.width = w;
                    imgCanvas.height = h;
                    const imgCtx = imgCanvas.getContext('2d');
                    imgCtx.drawImage(this.bgImage, 0, 0, w, h);

                    if (this.currentFX !== 'none') {
                        const srcData = imgCtx.getImageData(0, 0, w, h);
                        const dstData = imgCtx.createImageData(w, h);
                        this.applyDistortion(srcData, dstData, w, h);
                        imgCtx.putImageData(dstData, 0, 0);
                    }
                    
                    tempCtx.drawImage(imgCanvas, 0, 0);
                    frames.push(tempCanvas.toDataURL('image/jpeg', 0.8));
                }

                this.time = backupTime;

                gifshot.createGIF({
                    images: frames,
                    gifWidth: w,
                    gifHeight: h,
                    interval: 0.1,
                    numWorkers: 2
                }, function (obj) {
                    if (!obj.error) {
                        const link = document.createElement('a');
                        link.download = `editnew_alight_fx_${Date.now()}.gif`;
                        link.href = obj.image;
                        link.click();
                    } else {
                        alert("Có lỗi xảy ra khi đóng gói ảnh GIF.");
                    }
                });
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            new MotionFXEngine();
        });
    </script>
</body>
</html>
