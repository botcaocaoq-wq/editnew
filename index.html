    <script src="src/TransformGizmo.js"></script>
    <script src="src/TimelineManager.js"></script>
    <script src="src/RiggingEngine.js"></script>
    
    <script>
        // CẦU NỐI KẾT NỐI 3 FILE SCRIPT ĐỘC LẬP LÀM MỘT
        class AppCore {
            constructor() {
                this.gizmo = new TransformGizmo();
                this.timeline = new TimelineManager();
                this.rigEngine = new RiggingEngine();
            }

            applyKeyframesAtTime(time) {
                const roundedTime = parseFloat(time.toFixed(2));
                this.rigEngine.bones.forEach(bone => {
                    const boneKfs = this.timeline.keyframes.filter(k => k.boneId === bone.id);
                    if (boneKfs.length === 0) return;

                    let matchedKf = boneKfs.find(k => Math.abs(k.time - roundedTime) <= 0.05);
                    if (matchedKf) {
                        bone.position = { ...matchedKf.position };
                        bone.rotation = matchedKf.rotation;
                        bone.scale = { ...matchedKf.scale };
                    }
                });
                this.rigEngine.drawAll();
            }
        }

        // Khởi chạy hệ thống đồng bộ toàn cục
        window.appEngine = new AppCore();
    </script>
</body>
</html>
